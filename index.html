/* Crea el objeto lead a partir de un prospecto (lo usan las dos conversiones). */
function leadFromProspect(p, estado, siguiente){
  const score = prospectScore(p), prio = prospectPrio(score);
  const seg = prio === 'MUY ALTA' || prio === 'ALTA' ? 'A — Prioridad alta' : prio === 'MEDIA' ? 'B — Prioridad media' : 'C — Explorando';
  const señales = SIGNALS.filter(sg => isYes(p[sg.k])).map(sg => sg.label.toLowerCase()).join(', ');
  const oferta = (String(p.oferta || '').match(/OFERTA:\s*(.+)/i) || [])[1] || '';
  return {
    lead_id:uid('PIA'), fecha_iso:nowIso(), fecha:new Date().toLocaleDateString('es-ES'), sector:p.sector || 'manual', origen_pagina:'Prospección',
    nombre:p.nombre || '', email:p.email || '', telefono:p.telefono || '', empresa:p.negocio || '', responsable:p.responsable || yo(),
    score:'', segmento:seg, prioridad:'Prospección: ' + prio, urgencia:'', presupuesto:'', impacto_horas_mes:'', impacto_euros_anual:'',
    metrica_clave:mainNote(p).slice(0, 180), servicio_recomendado:oferta.trim(), tier_recomendado:'', siguiente_accion:siguiente || '',
    resumen:'Prospecto de la base "' + (p.base || '') + '" · ' + score + '/16 puntos' + (señales ? ' · Señales: ' + señales : '') + (p.canal ? ' · Canal: ' + p.canal : ''),
    respuestas_json:'{}', enlace_resultado:'', estado:estado, estado_desde:nowIso(), actualizado_iso:nowIso()
  };
}

/* Al pasar a "En conversación": decidir qué pasa con el prospecto. */
function openConversationChoice(p){
  if(!p) return;
  const tieneLead = !!p.lead_id;
  const opt = (v, t, d, checked, dis) => `<label class="choice ${dis ? 'dis' : ''}"><input type="radio" name="que" value="${v}" ${checked ? 'checked' : ''} ${dis ? 'disabled' : ''}>
      <span><b>${t}</b><small>${d}</small></span></label>`;
  openModal(`
    <h3>${esc(prospectName(p))} está en conversación</h3>
    <p class="lead">¿Qué quieres hacer con este prospecto?</p>
    <form>
      <div class="choices">
        ${opt('seguir', 'Seguir en Prospección', 'Solo se mueve a “En conversación”. Lo decides más adelante.', true)}
        ${opt('lead', 'Pasarlo a Conversión', tieneLead ? 'Ya tiene ficha de lead.' : 'Se crea su lead para trabajar la llamada, la propuesta y el cierre.', false, tieneLead)}
        ${opt('cliente', 'Convertirlo directamente en cliente', tieneLead ? 'Ya tiene ficha de lead: conviértelo desde Conversión.' : 'Si ya ha dicho que sí: crea su ficha de cliente con el servicio, el importe y la cuota.', false, tieneLead)}
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" type="button" data-cancel>Cancelar</button><button class="btn btn-primary" type="submit">Continuar</button></div>
    </form>`, f => {
    const que = String(f.get('que') || 'seguir');
    if(que === 'lead'){ setTimeout(() => openConvertProspect(p, 'Contactado'), 0); return; }
    if(que === 'cliente'){ setTimeout(() => openProspectToClient(p), 0); return; }
    commit('updateProspect', { prospecto_id:p.prospecto_id, fields:{ estado:'En conversación' },
      log:[logItem('prospecto', p.prospecto_id, 'Estado', (p.estado || 'Por investigar') + ' → En conversación')] }, prospectName(p) + ' pasa a En conversación');
  });
}

function openConvertProspect(p, etapa){
  if(!p) return;
  const etapas = ['Contactado','Llamada agendada','Propuesta enviada'];
  openModal(`
    <h3>Pasar a ${esc(prospectName(p))} a Conversión</h3>
    <p class="lead">Se crea su lead con sus datos, su prioridad y el problema detectado. El prospecto queda marcado como convertido.</p>
    <form>
      <div class="field"><label>Etapa en Conversión</label>
        <select class="select" name="estado">${etapas.map(e => `<option ${e === (etapa || 'Contactado') ? 'selected' : ''}>${e}</option>`).join('')}</select></div>
      <div class="field"><label>Siguiente paso</label><input class="input" name="siguiente" value="Proponer llamada de diagnóstico de 30 minutos"></div>
      <div class="modal-foot"><button class="btn btn-ghost" type="button" data-cancel>Cancelar</button><button class="btn btn-accent" type="submit">Crear lead</button></div>
    </form>`, f => {
    const lead = leadFromProspect(p, String(f.get('estado')), String(f.get('siguiente')).trim());
    const log = [
      logItem('prospecto', p.prospecto_id, 'Estado', (p.estado || 'Por investigar') + ' → Convertido en lead'),
      logItem('lead', lead.lead_id, 'Sistema', 'Lead creado desde prospección (' + (p.base || 'sin base') + ').' + (mainNote(p) ? '\nNotas de investigación: ' + mainNote(p) : ''))
    ];

    if($('#drawer').classList.contains('on')){ S.openType = 'lead'; S.openId = lead.lead_id; }

}

/* Prospecto → cliente directamente: crea su lead ya ganado y su ficha de cliente. */
function openProspectToClient(p){
  if(!p) return;
  const oferta = ((String(p.oferta || '').match(/OFERTA:\s*(.+)/i) || [])[1] || '').trim();
  openModal(`
    <h3>Convertir a ${esc(prospectName(p))} en cliente</h3>
    <p class="lead">Se crea su ficha en Clientes, en fase Onboarding, con una tarea de reunión de arranque. En Conversión queda registrado como ganado, para que tus cifras de conversión cuadren.</p>
    <form>
      <div class="field"><label>Servicio contratado</label><input class="input" name="servicio" value="${esc(oferta)}" placeholder="Ej.: Agenda online con recordatorios" required></div>
      <div class="field"><label>Tipo de proyecto</label>
        <select class="select" name="plan"><option>Primer arreglo</option><option>Sistema completo</option><option>Solo evolución mensual</option></select></div>
      <div class="grid-2">
        <div class="field"><label>Importe del proyecto (€)</label><input class="input" type="number" min="0" step="10" name="importe_proyecto" placeholder="0"></div>
        <div class="field"><label>Cuota mensual (€)</label><input class="input" type="number" min="0" step="5" name="cuota_mensual" placeholder="0"></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Inicio</label><input class="input" type="date" name="inicio" value="${todayStr()}"></div>
        <div class="field"><label>Primera revisión</label><input class="input" type="date" name="proximo_contacto" value="${addDays(7)}"></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" type="button" data-cancel>Cancelar</button><button class="btn btn-accent" type="submit">Crear cliente</button></div>
    </form>`, async f => {
    const lead = leadFromProspect(p, 'Cliente', 'Cliente desde prospección');
    const cid = uid('CLI');
    const cliente = {
      cliente_id:cid, lead_id:lead.lead_id, empresa:p.negocio || p.nombre || '', nombre:p.nombre || '', email:p.email || '', telefono:p.telefono || '',
      sector:p.sector || '', responsable:p.responsable || yo(), servicio:String(f.get('servicio')).trim(), plan:String(f.get('plan')),
      importe_proyecto:num(f.get('importe_proyecto')), cuota_mensual:num(f.get('cuota_mensual')),
      fase:'Onboarding', fase_desde:nowIso(), inicio:String(f.get('inicio') || ''), proximo_contacto:String(f.get('proximo_contacto') || ''),
      salud:'Bien', notas:p.notas_inv || '', creado_iso:nowIso()
    };
    const importe = (cliente.importe_proyecto ? ' · ' + eur(cliente.importe_proyecto) : '') + (cliente.cuota_mensual ? ' + ' + eur(cliente.cuota_mensual) + '/mes' : '');
    await commit('convertProspect', { prospecto_id:p.prospecto_id, lead, log:[
      logItem('prospecto', p.prospecto_id, 'Estado', (p.estado || 'Por investigar') + ' → Convertido en cliente'),
      logItem('lead', lead.lead_id, 'Sistema', 'Cliente directo desde prospección (' + (p.base || 'sin base') + ').')
    ] });
    await commit('convertToClient', { lead_id:lead.lead_id, cliente, log:[
      logItem('cliente', cid, 'Sistema', 'Cliente creado desde prospección. ' + cliente.servicio + importe)
    ] }, '¡Nuevo cliente! ' + (cliente.empresa || cliente.nombre));
    commit('addTask', { item:{ task_id:uid('TSK'), entidad:'cliente', entidad_id:cid, titulo:'Reunión de arranque con ' + (cliente.empresa || cliente.nombre), vence:addDays(2), hecha:false, creada_iso:nowIso(), completada_iso:'' } });
    if($('#drawer').classList.contains('on')){ S.openType = 'cliente'; S.openId = cid; renderAll(); }
  });
}

/* ---------- Importación desde Excel o CSV ---------- */
const HEADER_MAP = [
  [/^(nombreprofesional|nombre|nombreycompletos?|profesional)$/, 'nombre'],
  [/(negocio|marca|empresa|centro|consulta)/, 'negocio'],
  [/^tipo$/, 'tipo'], [/(ciudad|localidad|municipio|provincia)/, 'ciudad'],
  [/(tienewebpropia)/, 's_web'], [/(tieneformulario)/, 's_formulario'], [/(tienewhatsapp)/, 's_whatsapp'],
  [/(tienereservaonline)/, 's_reserva'], [/(variasmodalidades)/, 's_modalidades'], [/(otrosprofesionales)/, 's_otros_prof'],
  [/(newsletter)/, 's_newsletter'], [/(publicaregularmente)/, 's_publica'], [/(variosservicios)/, 's_servicios'],
  [/(gestionmanual)/, 's_manual'], [/(cursos|membresia)/, 's_cursos'], [/(equipovisible)/, 's_equipo'],
  [/^(web|webs|sitioweb|paginaweb|url|dominio)$/, 'web'], [/(email|correo|mail)/, 'email'], [/(telefono|movil|tlf|phone)/, 'telefono'],
  [/linkedin/, 'linkedin'], [/instagram/, 'instagram'], [/^(fuente|origen)$/, 'fuente'], [/(notas|problema|observaciones)/, 'notas']
];
const IGNORED_HEADERS = /^(fechaanadido|fecha|prioridad|puntuacion)$/;
function normHeader(h){ return String(h || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,''); }
function mapHeaders(headers){
  const map = {}, unknown = [];
  headers.forEach(h => {
    const n = normHeader(h);
    if(!n || IGNORED_HEADERS.test(n)) return;
    const hit = HEADER_MAP.find(([re, key]) => re.test(n) && !Object.values(map).includes(key));
    if(hit) map[h] = hit[1]; else unknown.push(h);
  });
  return { map, unknown };
}
function normYN(v){
  const t = String(v === null || v === undefined ? '' : v).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(['si','s','yes','y','x','1','true','verdadero'].includes(t)) return 'Sí';
  if(['no','n','0','false','falso'].includes(t)) return 'No';
  return '';
}

function loadSheetJS(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = () => window.XLSX ? res(window.XLSX) : rej(new Error('No se pudo cargar el lector de Excel'));
    sc.onerror = () => rej(new Error('No se pudo cargar el lector de Excel. Revisa tu conexión.'));
    document.head.appendChild(sc);
  });
}

async function parseProspectFile(file){
  const XLSX = await loadSheetJS();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type:'array' });
  const name = wb.SheetNames.find(n => /prospect/i.test(n)) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], { defval:'', raw:false });
  const headers = rows.length ? Object.keys(rows[0]) : [];
  return { rows, ...mapHeaders(headers), sheet:name };
}

function buildProspects(parsed, src){
  const base = src ? src.nombre : '', sector = src ? src.sector : '';
  const existing = new Set();
  S.prospectos.forEach(p => dedupeKeys(p).forEach(k => existing.add(k)));
  const out = [], dup = [], invalid = [];
  parsed.rows.forEach(r => {
    const p = { prospecto_id:uid('PRO'), source_id:src ? src.id : '', base, sector, notas_inv:'', oferta:'', responsable:'', fecha_iso:nowIso(), estado:'Por investigar', estado_desde:nowIso(), canal:'', lead_id:'', analizado_iso:'', analisis:'' };
    ['nombre','negocio','tipo','ciudad','web','email','telefono','linkedin','instagram','fuente','notas'].forEach(k => p[k] = '');
    SIGNALS.forEach(sg => p[sg.k] = '');
    Object.entries(parsed.map).forEach(([h, key]) => {
      const v = r[h];
      p[key] = key.startsWith('s_') ? normYN(v) : String(v === null || v === undefined ? '' : v).trim();
    });
    if(!p.nombre && !p.negocio && !p.web && !p.email && !p.instagram){ invalid.push(r); return; }
    const keys = dedupeKeys(p);
    if(keys.some(k => existing.has(k))){ dup.push(p); return; }
    keys.forEach(k => existing.add(k));
    if(SIGNALS.some(sg => p[sg.k])){ p.estado = 'Investigado'; }
    p.puntuacion = prospectScore(p); p.prioridad = prospectPrio(p.puntuacion);
    out.push(p);
  });
  return { out, dup, invalid };
}

async function runImport(res, src){
  if(!res.out.length){ toast('No hay prospectos nuevos que importar.'); return; }
  const base = src.nombre;
  applyLocal('importProspects', { rows:res.out });
  S.base = base; renderAll();
  setSync('busy', 'Importando…');
  try{
    for(let i = 0; i < res.out.length; i += 100) await Api.call('importProspects', { source_id:src.id, rows:res.out.slice(i, i + 100) });
    setSync('ok', CFG.demo ? 'Datos de ejemplo' : 'Importado');
    toast(res.out.length + ' prospectos importados en "' + base + '"' + (res.dup.length ? ' · ' + res.dup.length + ' duplicados saltados' : ''));
    if(!CFG.demo) await load(true);
  }catch(err){
    setSync('err', 'Error al importar');
    toast('La importación no se completó: ' + err.message, true);
    await load(true);
  }
}

async function trashItems(tipo, ids){
  const src = { lead:S.leads, cliente:S.clientes, prospecto:S.prospectos }[tipo] || [];
  const items = ids.map(id => src.find(x => (x.lead_id || x.cliente_id || x.prospecto_id) === id)).filter(Boolean);
  if(!items.length) return;
  const qué = items.length === 1 ? '“' + trashName(tipo, items[0]) + '”' : items.length + ' registros';
  if(!confirm('¿Enviar ' + qué + ' a la papelera?\n\nDejará de aparecer y de contar en el Panel. Podrás recuperarlo desde Ajustes › Papelera.')) return;
  if(S.openId && ids.includes(S.openId)) closeDrawer();
  items.forEach(x => applyLocal('trashItem', { tipo, id:(x.lead_id || x.cliente_id || x.prospecto_id) }));
  S.sel.lead.clear(); S.sel.prospecto.clear();
  renderAll();
  try{
    for(const x of items) await Api.call('trashItem', { tipo, id:(x.lead_id || x.cliente_id || x.prospecto_id) });
    if(!CFG.demo){
      await load(true);                        // comprobamos contra la hoja que se guardó de verdad
      const sigue = ids.filter(id => (S.leads.concat(S.clientes, S.prospectos)).some(y => (y.lead_id || y.cliente_id || y.prospecto_id) === id));
      if(sigue.length){ toast('El puente dijo que sí, pero en tu hoja no se ha marcado. Revisa Ajustes y que la implementación esté publicada.', true); return; }
    }
    toast(items.length === 1 ? 'Enviado a la papelera' : items.length + ' enviados a la papelera');
  }catch(err){ toast('No se pudo eliminar: ' + err.message, true); await load(true); }
}
async function restoreItem(tipo, id){
  applyLocal('restoreItem', { tipo, id }); renderAll();
  try{ await Api.call('restoreItem', { tipo, id }); toast('Restaurado'); }
  catch(err){ toast('No se pudo restaurar: ' + err.message, true); await load(true); }
}
async function purgeItem(tipo, id){
  const x = S.papelera[tipo].find(y => (y.lead_id || y.cliente_id || y.prospecto_id) === id);
  if(!x) return;
  if(!confirm('¿Eliminar definitivamente “' + trashName(tipo, x) + '”?\n\nSe borrará también su historial y sus tareas. Esto no se puede deshacer.')) return;
  applyLocal('purgeItem', { tipo, id }); renderAll();
  try{ await Api.call('purgeItem', { tipo, id }); toast('Eliminado definitivamente'); }
  catch(err){ toast('No se pudo eliminar: ' + err.message, true); await load(true); }
}

  const tr = e.target.closest('[data-trash]');
  if(tr){ trashItems(tr.dataset.trash, [tr.dataset.id]); return; }
  const t = e.target.closest('[data-open],[data-go],[data-close],[data-toggle-task],[data-copy],[data-expand],[data-card]');
  if(!t) return;
  if(t.hasAttribute('data-card')){ openDrawer(t.dataset.card, t.dataset.id); return; }
  if(t.hasAttribute('data-open')){ openDrawer(t.dataset.open, t.dataset.id); return; }
  if(t.hasAttribute('data-go')){ setView(t.dataset.go); return; }
  if(t.hasAttribute('data-close')){ closeDrawer(); return; }
  if(t.hasAttribute('data-toggle-task')){ toggleTask(t.dataset.toggleTask); return; }
  if(t.hasAttribute('data-expand')){ const txt = t.previousElementSibling; if(txt) txt.classList.remove('long'); t.remove(); return; }
  if(t.hasAttribute('data-copy')){
    const v = t.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => toast('Enlace copiado. Pégalo en tu email o WhatsApp.'), () => { window.prompt('Copia el enlace:', v); });
  }
});
document.addEventListener('change', e => {
  const f = e.target.closest('[data-filter]');
  if(!f) return;
  S[f.dataset.filter] = f.value;
  renderAll();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('.js-msg');
  if(f){ e.preventDefault(); enviarMensaje(f); }
});
document.addEventListener('keydown', e => {
  if(e.key === 'Enter' && (e.metaKey || e.ctrlKey)){
    const f = e.target.closest && e.target.closest('.js-msg');
    if(f){ e.preventDefault(); enviarMensaje(f); return; }
  }
  if(e.key === 'Escape'){
    if(!$('#modalBg').hidden) closeModal();
    else if(S.openId) closeDrawer();
  }
});
$('#drawerBg').addEventListener('click', closeDrawer);
$('#modalBg').addEventListener('click', e => { if(e.target.id === 'modalBg') closeModal(); });
$$('.nav-item').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
$('#newLeadBtn').addEventListener('click', () => S.view === 'prospeccion' ? openNewProspect() : openNewLead());
$('#refreshBtn').addEventListener('click', () => load(false));
/* Si estás escribiendo en una ficha o hay una ventana abierta, el refresco espera. */
document.addEventListener('input', e => { if(e.target.closest('#drawer form, #modal')){ S.dirty = true; S.dirtyAt = Date.now(); } });
function busyEditing(){
  if(!$('#modalBg').hidden) return true;                       // hay una ventana abierta
  const a = document.activeElement;
  // Solo cuenta si la ficha está abierta: al cerrarla, el cursor puede quedarse
  // dentro de un campo oculto y bloquearía el refresco para siempre.
  if(a && a.closest && a.closest('#drawer') && $('#drawer').classList.contains('on') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  // Si dejaste algo a medias pero ya no estás en ello, se espera como mucho 3 minutos.
  if(S.dirty && Date.now() - (S.dirtyAt || 0) < 180000) return true;
  if(S.dirty) S.dirty = false;
  return false;
}
async function autoRefresh(force){
  if(CFG.demo || $('#app').hidden || document.visibilityState !== 'visible') return;
  if(analyzing || offering || busyEditing()) return;
  if(loading) return;                                   // ya hay una carga en marcha
  if(Date.now() - S.lastLoad < (force ? 1500 : 6000)) return;
  await load(true);
}
setInterval(() => autoRefresh(false), 15000);
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible') autoRefresh(true); });
window.addEventListener('focus', () => autoRefresh(true));

let qTimer;
$('#q').addEventListener('input', e => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.q = e.target.value.trim(); renderAll(); }, 160); });

/* =====================================================================
   CARGA Y ARRANQUE
   ===================================================================== */
let loading = false;
async function load(silent){
  if(loading) return;
  loading = true;
  const seq = S.writeSeq || 0;
  setSync('busy', 'Cargando…');
  try{
    const d = await Api.all();
    // Si mientras llegaban los datos hemos guardado algo, esta respuesta ya es vieja:
    // la descartamos para no pisar lo que acabas de crear.
    if((S.writeSeq || 0) !== seq){ S.lastLoad = Date.now(); return; }
    const vivo = x => !String(x.eliminado_iso || '').trim();
    const all = { lead:(d.leads || []).filter(l => l.lead_id), cliente:(d.clientes || []).filter(c => c.cliente_id), prospecto:(d.prospectos || []).filter(p => p.prospecto_id) };
    S.papelera = { lead:all.lead.filter(x => !vivo(x)), cliente:all.cliente.filter(x => !vivo(x)), prospecto:all.prospecto.filter(x => !vivo(x)) };
    S.leads = all.lead.filter(vivo);
    S.clientes = all.cliente.filter(vivo);
    S.actividad = d.actividad || [];
    S.tareas = (d.tareas || []).filter(t => t.task_id);
    S.prospectos = all.prospecto.filter(vivo);
    S.fuentes = d.fuentes || [];
    S.usuarios = d.usuarios || [];
    S.mensajes = d.mensajes || [];
    S.claves = d.claves || [];
    S.tiempos = d.tiempos || [];
    S.servicios = d.servicios || [];
    S.catalogo = d.catalogo || [];
    S.chat = d.chat || null;
    S.version = d.version || '';
    S.me = d.me || S.me || {};
    S.ia = !!d.ia;
    S.lastLoad = Date.now();
    setSync('ok', CFG.demo ? 'Datos de ejemplo' : 'Al día · ' + new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
    renderAll();
    if(!silent && !CFG.demo) toast('Datos actualizados');
  }catch(err){
    setSync('err', 'Sin conexión');
    toast('No se pudieron cargar los datos: ' + err.message, true);
  }finally{
    loading = false;
  }
}

function showLogin(){
  $('#app').hidden = true; $('#login').hidden = false;
  $('#apiUrl').value = CFG.url || '';
  $('#apiKey').value = '';
  $('#loginErr').textContent = '';
}
function showApp(){
  $('#login').hidden = true; $('#app').hidden = false;
  if(CFG.demo) S.me = { nombre:'Miriam', rol:'Administradora' };
  $('#demoFlag').hidden = !CFG.demo;
  setView(LS.get('view', 'hoy'));
  load(true);
}

$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const url = $('#apiUrl').value.trim(), key = $('#apiKey').value;
  const err = $('#loginErr');
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){
    err.textContent = 'La dirección debe ser la de tu implementación de Apps Script y terminar en /exec.'; return;
  }
  err.textContent = 'Comprobando…';
  try{
    await Api.ping(url, key);
    LS.set('url', url); LS.set('key', key); LS.set('demo', false);
    showApp();
  }catch(ex){
    err.textContent = /Failed to fetch|NetworkError|JSON/i.test(ex.message)
      ? 'No se puede conectar. Revisa que la implementación permita el acceso a “Cualquier usuario”.'
      : ex.message;
  }
});
$('#demoBtn').addEventListener('click', () => { LS.set('demo', true); showApp(); });

if(CFG.demo || (CFG.url && CFG.key)) showApp(); else showLogin();

})();
</script>
</body>
