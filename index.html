function editarClave(bov, item, datos){
  const d = datos || {};
  openModal(`
    <h3>${item ? 'Editar cuenta' : 'Añadir cuenta'}</h3>
    <p class="lead">Se guarda cifrado con la contraseña maestra de «${esc(VAULTS[bov])}».</p>
    <form>
      <div class="grid-2">
        <div class="field"><label>Servicio</label><input class="input" name="servicio" value="${esc(item ? item.servicio : '')}" placeholder="Ej.: Make" required></div>
        <div class="field"><label>Dirección</label><input class="input" name="url" value="${esc(item ? item.url : '')}" placeholder="https://…"></div>
      </div>
      <div class="field"><label>Usuario o email</label><input class="input" name="usuario" value="${esc(d.usuario || '')}"></div>
      <div class="field"><label>Contraseña</label>
        <div style="display:flex;gap:8px"><input class="input" name="secreto" value="${esc(d.secreto || '')}" required>
        <button class="btn" type="button" id="genPass">Generar</button></div></div>
      <div class="field"><label>Notas</label><textarea class="textarea" name="notas" placeholder="Doble factor, quién la usa, en qué proyecto…">${esc(d.notas || '')}</textarea></div>
      ${isAdmin() ? `<div class="field"><label>Bóveda</label><select class="select" name="boveda">${Object.keys(VAULTS).map(k => `<option value="${k}" ${k === bov ? 'selected' : ''}>${esc(VAULTS[k])}</option>`).join('')}</select></div>` : ''}
      <div class="modal-foot"><button class="btn btn-ghost" type="button" data-cancel>Cancelar</button><button class="btn btn-primary" type="submit">Guardar</button></div>
    </form>`, async f => {
    const destino = String(f.get('boveda') || bov);
    if(destino !== bov && !VAULT_KEYS[destino]){ toast('Abre antes la bóveda «' + VAULTS[destino] + '» para guardar ahí.', true); return false; }
    const payload = { usuario:String(f.get('usuario') || ''), secreto:String(f.get('secreto') || ''), notas:String(f.get('notas') || '') };
    const cifrado = await cifrar(VAULT_KEYS[destino], payload);
    const nuevo = { clave_id: item ? item.clave_id : uid('KEY'), boveda:destino,
      servicio:String(f.get('servicio')).trim(), url:String(f.get('url')).trim(), datos:cifrado, autor:(item && item.autor) || yo() };
    const i = S.claves.findIndex(c => c.clave_id === nuevo.clave_id);
    if(i > -1) S.claves[i] = Object.assign({}, S.claves[i], nuevo); else S.claves.push(nuevo);
    renderAll();
    if(CFG.demo){ Demo.save(); return; }
    try{ await Api.call('saveSecret', { item:nuevo }); toast('Guardado'); }
    catch(err){ toast('No se pudo guardar: ' + err.message, true); await load(true); }
  });
  const g = $('#genPass');
  if(g) g.addEventListener('click', () => { const inp = $('#modal input[name=secreto]'); inp.value = generarClave(20); inp.type = 'text'; });
}

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
function esc(v){
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeUrl(u){
  const s = String(u || '').trim();
  return /^https?:\/\//i.test(s) ? s : '';
}
const num = v => { const n = Number(String(v === undefined || v === null ? '' : v).replace(/[^\d.,-]/g,'').replace(',', '.')); return isFinite(n) ? n : 0; };
const eur = n => { const v = Math.round(num(n)); try{ return v.toLocaleString('es-ES', { useGrouping:'always' }) + ' €'; }catch(e){ return v.toLocaleString('es-ES') + ' €'; } };
const nowIso = () => new Date().toISOString();
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const addDays = (n) => { const d = new Date(); d.setDate(d.getDate()+n); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
function uid(prefix){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return prefix + '-' + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + Math.random().toString(36).slice(2,7).toUpperCase();
}
function parseDate(v){
  if(!v) return null;
  if(v instanceof Date) return isNaN(v) ? null : v;
  const s = String(v).trim();
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0));
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}
function daysSince(v){
  const d = parseDate(v);
  if(!d) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function hoursSince(v){
  const d = parseDate(v);
  if(!d) return null;
  return (Date.now() - d.getTime()) / 3600000;
}
function fmtDate(v, withTime){
  const d = parseDate(v);
  if(!d) return '';
  const o = { day:'numeric', month:'short' };
  if(d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  if(withTime){ o.hour = '2-digit'; o.minute = '2-digit'; }
  return d.toLocaleDateString('es-ES', o);
}
function ago(v){
  const h = hoursSince(v);
  if(h === null) return '';
  if(h < 1) return 'hace un momento';
  if(h < 24) return 'hace ' + Math.floor(h) + ' h';
  const d = Math.floor(h / 24);
  return d === 1 ? 'ayer' : 'hace ' + d + ' días';
}
function segOf(lead){
  const s = String(lead.segmento || '').trim().charAt(0).toUpperCase();
  if(['A','B','C'].includes(s)) return s;
  const n = num(lead.score);
  if(lead.score === '' || lead.score === undefined) return '';
  return n >= 70 ? 'A' : n >= 45 ? 'B' : 'C';
}
function plural(n, one, many){ return n + ' ' + (n === 1 ? one : many); }
function leadName(l){ return l.nombre || l.email || 'Sin nombre'; }
function stageSince(l){ return l.estado_desde || l.fecha_iso || l.fecha; }
function callDate(l){
  const m = String(l.siguiente_accion || '').match(/(\d{1,2}\/\d{1,2}\/\d{4}(?:\s+\d{1,2}:\d{2})?)/);
  return m ? parseDate(m[1]) : null;
}
function lastTouch(type, id){
  const acts = S.actividad.filter(a => a.entidad === type && a.entidad_id === id);
  let best = null;
  acts.forEach(a => { const d = parseDate(a.fecha_iso); if(d && (!best || d > best)) best = d; });
  return best;
}
function matchQ(...fields){
  if(!S.q) return true;
  const q = S.q.toLowerCase();
  return fields.some(f => String(f || '').toLowerCase().includes(q));
}
function parseJSON(s){ try{ const o = JSON.parse(s); return (o && typeof o === 'object') ? o : null; }catch(e){ return null; } }
function prettyKey(k){ return String(k).replace(/^sub_/, 'Índice · ').replace(/_/g,' ').replace(/^\w/, c => c.toUpperCase()); }

/* =====================================================================
   API — puente con la hoja (Apps Script)
   ===================================================================== */
const Api = {
  async all(){
    if(CFG.demo) return Demo.load();
    const r = await fetch(CFG.url + '?action=all&key=' + encodeURIComponent(CFG.key), { method:'GET' });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'Respuesta no válida');
    return j.data;
  },
  async ping(url, key){
    const r = await fetch(url + '?action=ping&key=' + encodeURIComponent(key), { method:'GET' });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error === 'unauthorized' ? 'La clave no es correcta.' : (j.error || 'No responde'));
    return true;
  },
  async call(action, payload){
    S.writeSeq = (S.writeSeq || 0) + 1;      // marca que ha habido un cambio nuestro
    if(CFG.demo){ Demo.save(); return { ok:true }; }
    const r = await fetch(CFG.url, { method:'POST', body: JSON.stringify(Object.assign({ key:CFG.key, action }, payload)) });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || 'No se pudo guardar');
    return j.data;
  }
};

/* Aplica un cambio en local al momento (la interfaz no espera a la red)
   y lo envía a la hoja. Si falla, avisa y recarga desde la hoja. */
async function commit(action, payload, okMsg){
  S.dirty = false;
  applyLocal(action, payload);
  renderAll();
  setSync('busy', 'Guardando…');
  try{
    await Api.call(action, payload);
    setSync('ok', CFG.demo ? 'Datos de ejemplo' : 'Guardado ' + new Date().toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}));
    if(okMsg) toast(okMsg);
  }catch(err){
    setSync('err', 'Error al guardar');
    toast('No se ha guardado: ' + err.message + '. Recargando datos de la hoja.', true);
    await load(true);
  }
}

function applyLocal(action, p){
  const pushLog = (logs) => (logs || []).forEach(a => S.actividad.push(a));
  if(action === 'updateLead'){
    const l = S.leads.find(x => x.lead_id === p.lead_id);
    if(l){
      if(p.fields.estado && p.fields.estado !== l.estado) l.estado_desde = nowIso();
      Object.assign(l, p.fields, { actualizado_iso: nowIso() });
    }
    pushLog(p.log);
  }
  else if(action === 'addLead'){ S.leads.push(p.lead); pushLog(p.log); }
  else if(action === 'addActivity'){ S.actividad.push(p.item); }
  else if(action === 'addTask'){ S.tareas.push(p.item); }
  else if(action === 'updateTask'){
    const t = S.tareas.find(x => x.task_id === p.task_id);
    if(t) Object.assign(t, p.fields);
  }
  else if(action === 'convertToClient'){
    S.clientes.push(p.cliente);
    const l = S.leads.find(x => x.lead_id === p.lead_id);
    if(l){ l.estado = 'Cliente'; l.estado_desde = nowIso(); l.actualizado_iso = nowIso(); }
    pushLog(p.log);
  }
  else if(action === 'importProspects'){ p.rows.forEach(r => S.prospectos.push(r)); }
  else if(action === 'updateProspect'){
    const x = S.prospectos.find(q => q.prospecto_id === p.prospecto_id);
    if(x){
      if(p.fields.estado && p.fields.estado !== x.estado) x.estado_desde = nowIso();
      Object.assign(x, p.fields);
      x.puntuacion = prospectScore(x); x.prioridad = prospectPrio(x.puntuacion);
    }
    pushLog(p.log);
  }
  else if(action === 'convertProspect'){
    S.leads.push(p.lead);
    const x = S.prospectos.find(q => q.prospecto_id === p.prospecto_id);
    if(x){ x.estado = 'Convertido'; x.estado_desde = nowIso(); x.lead_id = p.lead.lead_id; }
    pushLog(p.log);
  }
  else if(action === 'trashItem'){
    const key = { lead:'leads', cliente:'clientes', prospecto:'prospectos' }[p.tipo];
    const i = S[key].findIndex(x => (x.lead_id || x.cliente_id || x.prospecto_id) === p.id && (p.tipo !== 'lead' || x.lead_id === p.id));
    if(i > -1){ const it = S[key][i]; it.eliminado_iso = nowIso(); S[key].splice(i, 1); S.papelera[p.tipo].push(it); }
    pushLog(p.log);
  }
  else if(action === 'restoreItem'){
    const key = { lead:'leads', cliente:'clientes', prospecto:'prospectos' }[p.tipo];
    const i = S.papelera[p.tipo].findIndex(x => (x.lead_id || x.cliente_id || x.prospecto_id) === p.id);
    if(i > -1){ const it = S.papelera[p.tipo][i]; it.eliminado_iso = ''; S.papelera[p.tipo].splice(i, 1); S[key].push(it); }
  }
  else if(action === 'purgeItem'){
    S.papelera[p.tipo] = S.papelera[p.tipo].filter(x => (x.lead_id || x.cliente_id || x.prospecto_id) !== p.id);
    S.actividad = S.actividad.filter(a => !(a.entidad === p.tipo && a.entidad_id === p.id));
    S.tareas = S.tareas.filter(t => !(t.entidad === p.tipo && t.entidad_id === p.id));
  }
  else if(action === 'updateClient'){
    const c = S.clientes.find(x => x.cliente_id === p.cliente_id);
    if(c){
      if(p.fields.fase && p.fields.fase !== c.fase) c.fase_desde = nowIso();
      Object.assign(c, p.fields);
    }
    pushLog(p.log);
  }
}

/* =====================================================================
   ALERTAS — lo que el CRM detecta solo
   ===================================================================== */
function computeAlerts(){
  const out = [];
  const add = (level, title, detail, type, id, sortKey) => out.push({ level, title, detail, type, id, sortKey });

  S.leads.forEach(l => {
    const seg = segOf(l), since = daysSince(stageSince(l)), hrs = hoursSince(l.fecha_iso || l.fecha);
    if(l.estado === 'Nuevo' && seg === 'A' && hrs !== null && hrs >= 24)
      add('alta', leadName(l) + ' lleva ' + plural(Math.max(1, Math.floor(hrs/24)), 'día', 'días') + ' sin contactar', 'Prioridad alta · ' + (l.metrica_clave || l.empresa || ''), 'lead', l.lead_id, 1);
    else if(l.estado === 'Nuevo' && hrs !== null && hrs >= 72)
      add('media', leadName(l) + ' sigue sin contactar', 'Entró ' + ago(l.fecha_iso || l.fecha), 'lead', l.lead_id, 3);
    else if(l.estado === 'Nuevo' && seg === 'A')
      add('media', 'Nuevo lead de prioridad alta: ' + leadName(l), l.metrica_clave || '', 'lead', l.lead_id, 2);

    if(l.estado === 'Contactado' && since !== null && since >= 5)
      add('media', 'Seguimiento pendiente con ' + leadName(l), 'Contactado ' + ago(stageSince(l)) + ' sin avanzar', 'lead', l.lead_id, 4);

    if(l.estado === 'Llamada agendada'){
      const cd = callDate(l);
      if(cd && cd.getTime() < Date.now() - 3*3600000)
        add('alta', '¿Cómo fue la llamada con ' + leadName(l) + '?', 'Era el ' + fmtDate(cd, true) + '. Actualiza el estado y añade las notas.', 'lead', l.lead_id, 1);
      else if(cd && cd.toDateString() === new Date().toDateString())
        add('info', 'Hoy tienes llamada con ' + leadName(l), fmtDate(cd, true), 'lead', l.lead_id, 0);
    }
    if(l.estado === 'Propuesta enviada' && since !== null && since >= 7)
      add('alta', 'Propuesta sin respuesta: ' + leadName(l), 'Enviada ' + ago(stageSince(l)), 'lead', l.lead_id, 2);
  });

  S.clientes.forEach(c => {
    if(!ACTIVE_CLIENT.includes(c.fase)) return;
    const pc = parseDate(c.proximo_contacto);
    if(pc){
      const d = Math.floor((new Date(new Date().toDateString()) - new Date(pc.toDateString())) / 86400000);
      if(d > 0) add('alta', 'Contacto atrasado con ' + (c.empresa || c.nombre), 'Tocaba hace ' + plural(d, 'día', 'días'), 'cliente', c.cliente_id, 1);
      else if(d === 0) add('media', 'Hoy toca contactar con ' + (c.empresa || c.nombre), c.servicio || '', 'cliente', c.cliente_id, 2);
    }
    const deuda = porCobrar(c), dFase = daysSince(c.fase_desde);
    if(deuda > 0 && dFase !== null && dFase >= 7)
      add('alta', 'Cobro pendiente: ' + (c.empresa || c.nombre), eur(deuda) + ' · ' + (c.fase || '') + ' desde hace ' + plural(dFase, 'día', 'días'), 'cliente', c.cliente_id, 1);
    else if(deuda > 0)
      add('media', 'Falta cobrar ' + eur(deuda) + ' de ' + (c.empresa || c.nombre), (c.fase || '') + ' · registra el cobro cuando entre', 'cliente', c.cliente_id, 3);
    if(c.salud === 'En riesgo') add('alta', (c.empresa || c.nombre) + ' está en riesgo', c.notas || 'Revisa la relación con este cliente', 'cliente', c.cliente_id, 1);
    const lt = lastTouch('cliente', c.cliente_id);
    const since = lt ? (Date.now() - lt.getTime())/86400000 : daysSince(c.creado_iso);
    if(since !== null && since >= 30) add('media', 'Llevas ' + Math.floor(since) + ' días sin hablar con ' + (c.empresa || c.nombre), 'Una revisión breve evita sustos', 'cliente', c.cliente_id, 5);
  });

  S.tareas.forEach(t => {
    if(t.hecha === true || t.hecha === 'TRUE' || t.hecha === 'true') return;
    const d = parseDate(t.vence);
    if(d && new Date(d.toDateString()) < new Date(new Date().toDateString()))
      add('alta', 'Tarea vencida: ' + t.titulo, entityLabel(t.entidad, t.entidad_id) + ' · vencía ' + fmtDate(d), t.entidad, t.entidad_id, 2);
  });

  S.mensajes.filter(m => noLeido(m) && meMenciona(m)).forEach(m => {
    add('alta', String(m.autor) + ' te ha mencionado', String(m.texto).slice(0, 90) + (String(m.texto).length > 90 ? '…' : ''), 'view', 'mensajes', 0);
  });
  S.prospectos.forEach(p => {
    const since = daysSince(p.estado_desde || p.fecha_iso);
    if(p.estado === 'Contactado' && since !== null && since >= 7)
      add('media', 'Segundo contacto con ' + prospectName(p), 'Contactado ' + ago(p.estado_desde) + (p.canal ? ' por ' + p.canal : '') + ' sin respuesta', 'prospecto', p.prospecto_id, 4);
  });
  const ready = S.prospectos.filter(p => p.estado === 'Investigado' && prospectPrio(prospectScore(p)) === 'MUY ALTA').length;
  if(ready) add('info', ready === 1 ? 'Un prospecto de prioridad muy alta listo para contactar' : ready + ' prospectos de prioridad muy alta listos para contactar', 'En Prospección › Investigado', 'view', 'prospeccion', 6);
  const sinOferta = S.prospectos.filter(p => p.estado === 'Investigado' && String(p.notas_inv || '').trim() && !String(p.oferta || '').trim()).length;
  if(sinOferta) add('info', sinOferta === 1 ? 'Un prospecto con notas de investigación sin oferta' : sinOferta + ' prospectos con notas de investigación sin oferta', 'Genera la oferta con IA desde Prospección', 'view', 'prospeccion', 6);
  const pend = S.prospectos.filter(p => p.estado === 'Por investigar' && p.web && !p.analizado_iso).length;
  if(pend >= 5) add('info', pend + ' prospectos esperando análisis de su web', 'Se rellenan solos con “Analizar webs”', 'view', 'prospeccion', 7);

  const rank = { alta:0, media:1, info:2 };
  return out.sort((a,b) => (rank[a.level]-rank[b.level]) || (a.sortKey-b.sortKey));
}

function entityLabel(type, id){
  if(type === 'lead'){ const l = S.leads.find(x => x.lead_id === id); return l ? leadName(l) : 'Lead'; }
  if(type === 'cliente'){ const c = S.clientes.find(x => x.cliente_id === id); return c ? (c.empresa || c.nombre) : 'Cliente'; }
  if(type === 'prospecto'){ const p = S.prospectos.find(x => x.prospecto_id === id); return p ? prospectName(p) : 'Prospecto'; }
  return 'General';
}
function isDone(t){ return t.hecha === true || t.hecha === 'TRUE' || t.hecha === 'true'; }

/* Arrastrar y soltar entre columnas */
let dragId = null, dragType = null;
function bindBoard(kind){
  $$('[data-card="' + kind + '"]').forEach(card => {
    card.addEventListener('dragstart', e => {
      dragId = card.dataset.id; dragType = kind;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      try{ e.dataTransfer.setData('text/plain', dragId); }catch(_){}
    });
    card.addEventListener('dragend', () => { card.classList.remove('dragging'); $$('.col').forEach(c => c.classList.remove('drop-on')); });
  });
  $$('[data-drop="' + kind + '"]').forEach(col => {
    col.addEventListener('dragover', e => { if(dragType === kind){ e.preventDefault(); col.classList.add('drop-on'); } });
    col.addEventListener('dragleave', e => { if(!col.contains(e.relatedTarget)) col.classList.remove('drop-on'); });
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('drop-on');
      if(dragType !== kind || !dragId) return;
      const stage = col.dataset.stage, id = dragId;
      dragId = null;
      if(kind === 'lead') moveLead(id, stage); else if(kind === 'prospecto') moveProspect(id, stage); else moveClient(id, stage);
    });
  });
}

function moveLead(id, stage){
  const l = S.leads.find(x => x.lead_id === id);
  if(!l || l.estado === stage) return;
  if(stage === 'Cliente'){
    if(S.clientes.some(c => c.lead_id === id)){ toast('Este lead ya tiene ficha de cliente.'); return; }
    return openConvert(l);
  }
  if(stage === 'Descartado') return openDiscard(l);
  const from = l.estado || 'Nuevo';
  commit('updateLead', { lead_id:id, fields:{ estado:stage }, log:[logItem('lead', id, 'Estado', from + ' → ' + stage)] }, leadName(l) + ' pasa a ' + stage);
}

function moveClient(id, stage){
  const c = S.clientes.find(x => x.cliente_id === id);
  if(!c || c.fase === stage) return;
  const from = c.fase || 'Onboarding';
  commit('updateClient', { cliente_id:id, fields:{ fase:stage }, log:[logItem('cliente', id, 'Estado', from + ' → ' + stage)] }, (c.empresa || c.nombre) + ' pasa a ' + stage);
}

  if(S.prio && prospectPrio(prospectScore(p)) !== S.prio) return false;

function prospectCard(p, stageIdx){

  const since = daysSince(p.estado_desde || p.fecha_iso);
  const stale = p.estado === 'Contactado' && since >= 7;
  const railIdx = PROSPECT_STAGES[stageIdx].lost ? -1 : Math.min(stageIdx, 4);
  const rail = [0,1,2,3,4].map(i => `<span style="background:${i <= railIdx ? PROSPECT_STAGES[i].color : ''}"></span>`).join('');

        <span class="prio ${prioCss(prio)}" title="Puntuación ${score} de 16">${score}</span>
      </div>
      ${(() => { const t = mainNote(p); return t ? `<div class="card-metric">${esc(t.slice(0, 110))}${t.length > 110 ? '…' : ''}</div>` : ''; })()}
      <div class="card-foot">
        <span class="tag">${esc(prio.charAt(0) + prio.slice(1).toLowerCase())}</span>
        ${p.canal ? `<span class="tag">${esc(p.canal)}</span>` : ''}
        ${p.responsable ? `<span class="tag">${esc(p.responsable)}</span>` : ''}
        ${String(p.oferta || '').trim() ? '<span class="tag" style="background:rgba(124,92,252,0.13);color:#5B3FD0">Oferta lista</span>' : ''}
        ${!p.analizado_iso && p.estado === 'Por investigar' && p.web ? '<span class="tag">Sin analizar</span>' : ''}
        <span class="age ${stale ? 'stale' : ''}">${since === null ? '' : since === 0 ? 'hoy' : since + ' d'}</span>
      </div>
    </button>`;
}

function moveProspect(id, stage){
  const p = S.prospectos.find(x => x.prospecto_id === id);
  if(!p || p.estado === stage) return;
  if(stage === 'Convertido'){
    if(p.lead_id){ toast('Este prospecto ya es un lead.'); return; }
    return openConvertProspect(p);
  }
  if(stage === 'En conversación') return openConversationChoice(p);
  const from = p.estado || 'Por investigar';
  commit('updateProspect', { prospecto_id:id, fields:{ estado:stage }, log:[logItem('prospecto', id, 'Estado', from + ' → ' + stage)] }, prospectName(p) + ' pasa a ' + stage);
}

/* ---------------- TAREAS ---------------- */
function taskRow(t){
  const d = parseDate(t.vence);
  const today = new Date(new Date().toDateString());
  let cls = '', txt = d ? fmtDate(d) : 'Sin fecha';
  if(d && !isDone(t)){
    const dd = new Date(d.toDateString());
    if(dd < today){ cls = 'late'; txt = 'Vencida · ' + fmtDate(d); }
    else if(dd.getTime() === today.getTime()){ cls = 'today'; txt = 'Hoy'; }
  }
  const link = t.entidad === 'general' ? '<span style="font-size:12.5px;color:var(--muted)">General</span>'
    : `<button data-open="${esc(t.entidad)}" data-id="${esc(t.entidad_id)}">${esc(entityLabel(t.entidad, t.entidad_id))}</button>`;
  return `<div class="task ${isDone(t) ? 'done' : ''}">
      <button class="check ${isDone(t) ? 'on' : ''}" data-toggle-task="${esc(t.task_id)}" aria-label="${isDone(t) ? 'Marcar como pendiente' : 'Marcar como hecha'}"></button>
      <div class="task-txt"><b>${esc(t.titulo)}</b>${link}</div>
      <span class="due ${cls}">${esc(txt)}</span>
    </div>`;
}

function renderTareas(){
  const q = t => matchQ(t.titulo, entityLabel(t.entidad, t.entidad_id));
  const today = new Date(new Date().toDateString());
  const pend = S.tareas.filter(t => !isDone(t) && q(t));
  const dOf = t => { const d = parseDate(t.vence); return d ? new Date(d.toDateString()) : null; };
  const late = pend.filter(t => dOf(t) && dOf(t) < today);
  const hoy = pend.filter(t => dOf(t) && dOf(t).getTime() === today.getTime());
  const next = pend.filter(t => !dOf(t) || dOf(t) > today).sort((a,b) => String(a.vence||'9').localeCompare(String(b.vence||'9')));
  const done = S.tareas.filter(t => isDone(t) && q(t)).sort((a,b) => String(b.completada_iso).localeCompare(String(a.completada_iso))).slice(0, 15);
  const group = (title, list, emptyTxt, extra) => `<div class="panel">
      <div class="panel-head"><h3>${title}</h3><small>${list.length}</small></div>
      <div class="panel-body">${list.length ? list.map(taskRow).join('') : `<div class="empty">${emptyTxt}</div>`}</div>${extra || ''}
    </div>`;
  const addForm = `<form class="add-task" id="addGeneralTask">
      <input class="input" name="titulo" placeholder="Nueva tarea general (sin lead asociado)" required>
      <input class="input" name="vence" type="date" value="${todayStr()}">
      <button class="btn btn-primary" type="submit">Añadir</button>
    </form>`;
  $('#view-tareas').innerHTML = `<div class="task-groups">
      ${late.length ? group('Vencidas', late, '') : ''}
      ${group('Hoy', hoy, 'Nada para hoy.', addForm)}
      ${group('Próximas', next, 'No hay tareas programadas.')}
      ${group('Hechas recientemente', done, 'Aún no has completado ninguna.')}
    </div>`;
  $('#addGeneralTask').addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const item = { task_id:uid('TSK'), entidad:'general', entidad_id:'', titulo:String(f.get('titulo')).trim(), vence:f.get('vence') || '', hecha:false, creada_iso:nowIso(), completada_iso:'' };
    if(!item.titulo) return;
    commit('addTask', { item }, 'Tarea añadida');
  });
}

function toggleTask(id){
  const t = S.tareas.find(x => x.task_id === id);
  if(!t) return;
  const now = !isDone(t);
  commit('updateTask', { task_id:id, fields:{ hecha:now, completada_iso: now ? nowIso() : '' } }, now ? 'Tarea hecha' : 'Tarea reabierta');
}


/* Qué columnas de tu hoja reconoce el CRM (para detectar por qué algo no aparece). */
const FIELD_LABEL = { nombre:'Nombre', negocio:'Negocio', tipo:'Tipo', ciudad:'Ciudad', web:'Web', email:'Email', telefono:'Teléfono', linkedin:'LinkedIn', instagram:'Instagram',
  fuente:'Fuente', fecha_alta:'Fecha añadido', notas:'Problema detectado', notas_inv:'Notas de investigación', oferta:'Oferta propuesta', oferta_iso:'Oferta generada',
  estado:'Etapa', estado_desde:'Estado desde', canal:'Canal', analisis:'Análisis web', analizado_iso:'Analizado', prospecto_id:'ID CRM', lead_id:'Lead CRM',
  prioridad_hoja:'Prioridad (tu fórmula)', puntuacion_hoja:'Puntuación (tu fórmula)' };
SIGNALS.forEach(sg => { FIELD_LABEL[sg.k] = sg.label; });
function sourceDiag(x){
  const d = x.diag;
  if(!d) return CFG.demo ? '' : '<p style="font-size:12.5px;margin:0 0 10px">No se pudo leer esta hoja. Comprueba que sigue existiendo y que tienes permiso de edición.</p>';
  const find = k => d.columnas.filter(c => c.campo === k);
  const ni = find('notas_inv'), pr = find('notas');
  const unk = d.columnas.filter(c => !c.campo);
  const known = d.columnas.filter(c => c.campo);
  const line = (label, cols) => cols.length ? `<b>${label}</b>: columna ${cols.map(c => esc(c.col) + ' (“' + esc(c.titulo) + '”)').join(' y ')}` : `<b>${label}</b>: <span style="color:var(--red)">no encontrada</span>`;
  return `<details style="margin:-4px 0 12px;font-size:13px">
      <summary style="cursor:pointer;color:var(--violet);font-weight:600">Ver qué columnas reconoce</summary>
      <div style="padding:10px 0 0;display:flex;flex-direction:column;gap:6px">
        <div>${line('Notas de investigación', ni)}</div>
        <div>${line('Problema detectado', pr)}</div>
        ${d.duplicadas.length ? `<div style="color:var(--gold-d)">Hay varias columnas para el mismo dato: ${d.duplicadas.map(x => esc(FIELD_LABEL[x.campo] || x.campo) + ' (' + x.cols.join(', ') + ')').join('; ')}. El CRM lee la que tenga contenido y escribe en todas.</div>` : ''}
        <div style="color:var(--muted)">Reconocidas (${known.length}): ${known.map(c => esc(c.col) + ' ' + esc(FIELD_LABEL[c.campo] || c.campo)).join(' · ')}</div>
        ${unk.length ? `<div style="color:var(--muted)">No usadas (${unk.length}): ${unk.map(c => esc(c.col) + ' “' + esc(c.titulo) + '”').join(' · ')}</div>` : ''}
      </div>
    </details>`;
}

/* =====================================================================

   ===================================================================== */
const COL_LIMIT = 20, PAGE_SIZE = 50;
S.views  = Object.assign({ prospecto:'tablero', lead:'tablero' }, LS.get('views', {}));
S.compact = LS.get('compact', false);
S.folded = LS.get('folded', { 'prospecto|Convertido':true, 'prospecto|Descartado':true, 'lead|Descartado':true });
S.more = {};
S.sortBy = { prospecto:{ k:'score', d:-1 }, lead:{ k:'score', d:-1 } };
S.sel = { prospecto:new Set(), lead:new Set() };
S.page = { prospecto:0, lead:0 };
S.stageP = 'abiertas'; S.stageL = 'abiertas';
S.qMode = 'contactar'; S.qSkip = new Set();

const ICON = {
  tablero:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg>',
  lista:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
  cola:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h12M12 6l6 6-6 6"/><path d="M20 5v14"/></svg>'
};
const idOf = (kind, x) => kind === 'prospecto' ? x.prospecto_id : x.lead_id;
const stageOf = (kind, x) => x.estado || (kind === 'prospecto' ? 'Por investigar' : 'Nuevo');

function viewSwitch(kind, modes){
  const cur = S.views[kind];
  const labels = { tablero:'Tablero', lista:'Lista', cola:'Cola' };
  return `<div class="seg" role="tablist" aria-label="Vista">${modes.map(v =>
    `<button type="button" role="tab" aria-selected="${cur === v}" class="${cur === v ? 'on' : ''}" data-vk="${kind}" data-vm="${v}">${ICON[v]}${labels[v]}</button>`).join('')}</div>`;
}

/* ---------- Tablero con columnas limitadas y plegables ---------- */
function kanbanHtml(kind, stages, items, cardFn, metaFn){
  return `<div class="board ${S.compact ? 'compact' : ''}">` + stages.map((st, idx) => {
    const list = items.filter(x => stageOf(kind, x) === st.id);
    const key = kind + '|' + st.id;
    if(S.folded[key]) return `<div class="col folded" data-drop="${kind}" data-stage="${esc(st.id)}">
        <button class="fold-btn" data-fold="${esc(key)}" title="Mostrar la columna ${esc(st.id)}"><i style="background:${st.color}"></i><span>${esc(st.id)}</span><b>${list.length}</b></button></div>`;
    const lim = COL_LIMIT + (S.more[key] || 0), rest = list.length - lim;
    return `<div class="col ${st.lost ? 'muted' : ''}" data-drop="${kind}" data-stage="${esc(st.id)}">
        <div class="col-head"><i style="background:${st.color}"></i><h3>${esc(st.id)}</h3><span class="n">${list.length}</span>
          <button class="fold-x" data-fold="${esc(key)}" title="Plegar columna" aria-label="Plegar ${esc(st.id)}">‹</button></div>
        <div class="col-meta">${metaFn(list) || '&nbsp;'}</div>
        <div class="col-body">${list.slice(0, lim).map(x => cardFn(x, idx)).join('')}
          ${rest > 0 ? `<button class="more-btn" data-more="${esc(key)}">Ver ${Math.min(40, rest)} más · quedan ${rest}</button>` : ''}</div>
      </div>`;
  }).join('') + '</div>';
}

/* ---------- Lista ordenable con selección ---------- */
function sortRows(kind, rows, cols){
  cols = cols.filter(c => !c.admin || isAdmin());
  const sb = S.sortBy[kind], col = cols.find(c => c.k === sb.k && c.val);
  if(!col) return rows;
  return rows.slice().sort((a, b) => {
    const va = col.val(a), vb = col.val(b);
    const r = (typeof va === 'number' && typeof vb === 'number') ? va - vb : String(va).localeCompare(String(vb), 'es', { numeric:true });
    return r * sb.d;
  });
}

function tableHtml(kind, rows, cols){
  cols = cols.filter(c => !c.admin || isAdmin());
  const sel = S.sel[kind], sb = S.sortBy[kind];
  const pages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
  if(S.page[kind] >= pages) S.page[kind] = pages - 1;
  const start = S.page[kind] * PAGE_SIZE, pageRows = rows.slice(start, start + PAGE_SIZE);
  const allOn = pageRows.length > 0 && pageRows.every(r => sel.has(idOf(kind, r)));
  if(!rows.length) return `<div class="panel"><div class="empty"><b>Nada que mostrar</b>Prueba a cambiar los filtros o la etapa.</div></div>`;
  return `<div class="table-wrap"><table class="grid">
      <thead><tr><th style="width:36px"><input type="checkbox" data-selall="${kind}" ${allOn ? 'checked' : ''} aria-label="Seleccionar todos los de esta página"></th>

      <tbody>${pageRows.map(r => { const id = idOf(kind, r); return `<tr data-row="${kind}" data-id="${esc(id)}" class="${sel.has(id) ? 'on' : ''}">
          <td><input type="checkbox" data-selrow="${kind}" data-id="${esc(id)}" ${sel.has(id) ? 'checked' : ''} aria-label="Seleccionar"></td>
          ${cols.map(c => `<td class="${c.cls || ''}">${c.cell(r)}</td>`).join('')}</tr>`; }).join('')}</tbody>
    </table></div>
    ${pages > 1 ? `<div class="pager">${start + 1}–${Math.min(start + PAGE_SIZE, rows.length)} de ${rows.length}
        <button class="btn" data-page="${kind}|-1" ${S.page[kind] === 0 ? 'disabled' : ''}>Anterior</button>
        <button class="btn" data-page="${kind}|1" ${S.page[kind] >= pages - 1 ? 'disabled' : ''}>Siguiente</button></div>` : ''}`;
}

function stageSelectMini(kind, x, stages){
  const cur = stageOf(kind, x);
  return `<select class="select mini" data-rowstage="${kind}" data-id="${esc(idOf(kind, x))}" aria-label="Etapa">${stages.map(s => `<option ${s.id === cur ? 'selected' : ''}>${esc(s.id)}</option>`).join('')}</select>`;
}

function bulkBar(kind, stages){
  const n = S.sel[kind].size;
  if(!n) return '';
  const opts = stages.filter(s => !s.won).map(s => `<option>${esc(s.id)}</option>`).join('');
  return `<div class="bulk" role="region" aria-label="Acciones en bloque">
      <b>${n} seleccionado${n === 1 ? '' : 's'}</b>
      <select class="select" data-bulkstage="${kind}" aria-label="Cambiar etapa"><option value="">Cambiar etapa…</option>${opts}</select>
      ${kind === 'prospecto' ? '<button class="btn" data-bulk="analyze">Analizar webs</button><button class="btn" data-bulk="offers">Generar ofertas</button>' : ''}
      <button class="btn" data-bulk="trash" data-kind="${kind}">Eliminar</button>
      <button class="btn" data-bulk="clear">Quitar selección</button>
    </div>`;
}

function stageFilterSel(kind, stages){
  const cur = kind === 'prospecto' ? S.stageP : S.stageL, key = kind === 'prospecto' ? 'stageP' : 'stageL';
  return `<select class="select" data-filter="${key}" aria-label="Etapa">
      <option value="abiertas" ${cur === 'abiertas' ? 'selected' : ''}>Etapas abiertas</option>
      <option value="" ${cur === '' ? 'selected' : ''}>Todas las etapas</option>
      ${stages.map(s => `<option ${cur === s.id ? 'selected' : ''}>${esc(s.id)}</option>`).join('')}</select>`;
}
function passStage(kind, x){
  const f = kind === 'prospecto' ? S.stageP : S.stageL;
  if(f === 'abiertas') return (kind === 'prospecto' ? OPEN_PROSPECT : OPEN_STAGES).includes(stageOf(kind, x));
  return !f || stageOf(kind, x) === f;
}

async function bulkMove(kind, ids, stage){
  const src = kind === 'prospecto' ? S.prospectos : S.leads;
  const items = ids.map(id => src.find(x => idOf(kind, x) === id)).filter(x => x && stageOf(kind, x) !== stage);
  if(!items.length){ toast('Ya estaban en ' + stage + '.'); return; }
  if(!confirm('¿Pasar ' + items.length + (items.length === 1 ? ' registro' : ' registros') + ' a "' + stage + '"?')) return;
  const action = kind === 'prospecto' ? 'updateProspect' : 'updateLead';
  const payloads = items.map(x => {
    const id = idOf(kind, x), fields = { estado:stage };
    if(kind === 'lead' && stage === 'Descartado') fields.siguiente_accion = 'Descartado en bloque';
    const log = [logItem(kind, id, 'Estado', stageOf(kind, x) + ' → ' + stage + ' (en bloque)')];
    return kind === 'prospecto' ? { prospecto_id:id, fields, log } : { lead_id:id, fields, log };
  });
  payloads.forEach(p => applyLocal(action, p));
  S.sel[kind].clear();
  renderAll();
  try{
    for(let i = 0; i < payloads.length; i++){
      setSync('busy', 'Guardando ' + (i + 1) + ' de ' + payloads.length);
      await Api.call(action, payloads[i]);
    }
    setSync('ok', CFG.demo ? 'Datos de ejemplo' : 'Guardado');
    toast(payloads.length + ' pasados a ' + stage);
  }catch(err){
    setSync('err', 'Error al guardar');
    toast('Se paró a medias: ' + err.message + '. Recargando.', true);
    await load(true);
  }
}

/* ---------- Cola de trabajo: de uno en uno ---------- */
function firstMessage(p){ return (String(p.oferta || '').split(/PRIMER MENSAJE:\s*/i)[1] || '').trim(); }
function queueList(vis){
  if(S.qMode === 'seguimiento')
    return vis.filter(p => p.estado === 'Contactado').sort((a,b) => String(a.estado_desde || '').localeCompare(String(b.estado_desde || '')));
  return vis.filter(p => p.estado === 'Investigado').sort((a,b) =>
    prospectScore(b) - prospectScore(a) || (String(b.oferta || '').trim() ? 1 : 0) - (String(a.oferta || '').trim() ? 1 : 0));
}
function prospectQueue(vis){
  const all = queueList(vis), list = all.filter(p => !S.qSkip.has(p.prospecto_id));
  const modes = `<div class="seg" role="tablist" aria-label="Qué trabajar">
      <button type="button" class="${S.qMode === 'contactar' ? 'on' : ''}" data-qmode="contactar">Por contactar</button>
      <button type="button" class="${S.qMode === 'seguimiento' ? 'on' : ''}" data-qmode="seguimiento">Seguimiento</button></div>`;
  if(!list.length){
    const txt = S.qMode === 'seguimiento' ? 'No hay prospectos contactados esperando respuesta.' : 'No hay prospectos investigados pendientes de contactar. Analiza webs o revisa los de “Por investigar”.';
    return `<div class="queue"><div class="q-top">${modes}</div><div class="panel"><div class="empty"><b>${all.length ? 'Has pasado por todos' : 'Cola vacía'}</b>${all.length ? 'Los que has saltado vuelven a aparecer si reinicias la cola.' : esc(txt)}
      ${all.length ? '<div style="margin-top:14px"><button class="btn btn-primary" data-qreset>Volver a empezar</button></div>' : ''}</div></div></div>`;
  }
  const p = list[0], score = prospectScore(p), prio = prospectPrio(score);
  const msg = firstMessage(p), sigs = SIGNALS.filter(sg => isYes(p[sg.k]));
  const web = safeUrl(extUrl(p.web)), li = safeUrl(extUrl(p.linkedin)), ig = safeUrl(extUrl(p.instagram, 'https://instagram.com/'));
  const tel = String(p.telefono || '').replace(/[^\d+]/g,'');
  const since = daysSince(p.estado_desde);
  const chan = p.canal || (li ? 'LinkedIn' : ig ? 'Instagram' : tel ? 'Teléfono' : 'LinkedIn');
  const actions = S.qMode === 'seguimiento'
    ? `<select class="select" id="qChan" aria-label="Canal">${CHANNELS.map(c => `<option ${c === chan ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
       <button class="btn btn-primary" data-qact="second">Registrar segundo contacto</button>
       <button class="btn" data-qact="talk">Ha respondido</button>`
    : `<select class="select" id="qChan" aria-label="Canal">${CHANNELS.map(c => `<option ${c === chan ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select>
       <button class="btn btn-primary" data-qact="contacted">Marcar como contactado</button>`;
  return `<div class="queue">
    <div class="q-top">${modes}<span class="count">1 de ${list.length}${S.qSkip.size ? ' · ' + S.qSkip.size + ' saltado' + (S.qSkip.size === 1 ? '' : 's') : ''}</span></div>
    <div class="panel q-card">
      <div class="q-head">
        <div><h2>${esc(prospectName(p))}</h2><div class="sub">${esc([p.negocio && p.nombre !== p.negocio ? p.nombre : '', p.ciudad, p.base].filter(Boolean).join(' · '))}</div></div>
        <span class="prio ${prioCss(prio)}">${score} · ${esc(prio)}</span>
      </div>
      <div class="q-links">
        ${web ? `<a class="btn" href="${esc(web)}" target="_blank" rel="noopener">Web</a>` : ''}
        ${li ? `<a class="btn" href="${esc(li)}" target="_blank" rel="noopener">LinkedIn</a>` : ''}
        ${ig ? `<a class="btn" href="${esc(ig)}" target="_blank" rel="noopener">Instagram</a>` : ''}
        ${tel ? `<a class="btn" href="tel:${esc(tel)}">Llamar</a>` : ''}
        ${S.qMode === 'seguimiento' ? `<span class="tag" style="align-self:center">Contactado ${since === null ? '' : since === 0 ? 'hoy' : 'hace ' + since + ' d'}${p.canal ? ' por ' + esc(p.canal) : ''}</span>` : ''}
      </div>
      <div class="q-grid">
        <div>
          <h4>Tus notas de investigación</h4><p style="white-space:pre-wrap">${esc(p.notas_inv || '—')}</p>
          <h4>Problema detectado</h4><p>${isYes(p.notas) ? 'Sí' : String(p.notas || '').trim() === 'No' ? 'No' : esc(probText(p) || '—')}</p>
          <h4>Señales</h4><div class="q-chips">${sigs.length ? sigs.map(sg => `<span class="tag">${esc(sg.label)}</span>`).join('') : '<span style="color:var(--muted);font-size:13.5px">Ninguna marcada</span>'}</div>
        </div>
        <div>
          <h4>Primer mensaje</h4>
          ${msg ? `<div class="q-msg">${esc(msg)}</div><button class="btn" data-qact="copy">Copiar mensaje</button>`
                : `<p style="color:var(--muted)">Todavía no hay oferta para este prospecto.</p><button class="btn btn-accent" data-qact="offer">Generar oferta con IA</button>`}
          ${String(p.oferta || '').trim() ? `<details><summary>Ver la oferta completa</summary><pre>${esc(p.oferta)}</pre></details>` : ''}
        </div>
      </div>
      <div class="q-actions">
        ${actions}
        <button class="btn" data-qact="skip">Saltar</button>
        <button class="btn btn-ghost btn-danger" data-qact="discard">Descartar</button>
        <button class="btn btn-ghost push" data-open="prospecto" data-id="${esc(p.prospecto_id)}">Abrir ficha completa</button>
      </div>
    </div>
    ${list.length > 1 ? `<div class="q-next">Después: ${list.slice(1, 6).map(x => `<button data-open="prospecto" data-id="${esc(x.prospecto_id)}">${esc(prospectName(x))} · ${prospectScore(x)}</button>`).join('')}${list.length > 6 ? ' y ' + (list.length - 6) + ' más' : ''}</div>` : ''}
  </div>`;
}
function bindQueue(){
  const root = $('#view-prospeccion');
  const vis = S.prospectos.filter(prospectVisible);
  const p = queueList(vis).filter(x => !S.qSkip.has(x.prospecto_id))[0];
  $$('[data-qmode]', root).forEach(b => b.addEventListener('click', () => { S.qMode = b.dataset.qmode; renderAll(); }));
  const rs = $('[data-qreset]', root); if(rs) rs.addEventListener('click', () => { S.qSkip.clear(); renderAll(); });
  if(!p) return;
  const id = p.prospecto_id, chan = () => ($('#qChan', root) || {}).value || '';
  $$('[data-qact]', root).forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.qact;
    if(a === 'copy'){ const m = firstMessage(p); (navigator.clipboard ? navigator.clipboard.writeText(m) : Promise.reject()).then(() => toast('Mensaje copiado'), () => window.prompt('Copia el mensaje:', m)); }
    if(a === 'offer') offerIds([id], true);
    if(a === 'skip'){ S.qSkip.add(id); renderAll(); }
    if(a === 'discard') commit('updateProspect', { prospecto_id:id, fields:{ estado:'Descartado' }, log:[logItem('prospecto', id, 'Estado', stageOf('prospecto', p) + ' → Descartado (desde la cola)')] }, prospectName(p) + ' descartado');
    if(a === 'contacted') commit('updateProspect', { prospecto_id:id, fields:{ estado:'Contactado', canal:chan() }, log:[logItem('prospecto', id, 'Mensaje', 'Primer contacto por ' + chan())] }, 'Contactado. Siguiente.');
    if(a === 'second') commit('updateProspect', { prospecto_id:id, fields:{ estado_desde:nowIso(), canal:chan() }, log:[logItem('prospecto', id, 'Mensaje', 'Segundo contacto por ' + chan())] }, 'Segundo contacto registrado. Siguiente.');
    if(a === 'talk') openConversationChoice(p);
  }));
}

/* =====================================================================
   PANEL — cómo va el negocio de un vistazo
   ===================================================================== */
/* Probabilidad de cierre por etapa (para la previsión realista). */
const STAGE_PROB = { 'Nuevo':0.10, 'Contactado':0.20, 'Llamada agendada':0.40, 'Propuesta enviada':0.60 };
/* Referencia por sector cuando aún no hay ticket medio real. */
const SECTOR_TICKET = { 'psicologos-coaches':450, 'inmobiliarias':1200, 'general':800, 'manual':600 };
const C = { gold:'#F5A623', coral:'#EC5C8D', violet:'#7C5CFC', teal:'#14B8A6', grey:'#C4C3CC', ink:'#15151F', line:'#E4E2DA', muted:'#6B6B78' };
const PERIOD_LABEL = { mes:'este mes', trimestre:'últimos 3 meses', 'año':'este año', todo:'desde el inicio' };
S.period = LS.get('period', 'mes');

function avgTicket(){
  const v = S.clientes.map(c => num(c.importe_proyecto)).filter(x => x > 0);
  return v.length ? v.reduce((a,b) => a + b, 0) / v.length : 0;
}
/* "Automation System (1.000-3.000€)" → 2000 · "Primer arreglo (desde 250€)" → 250 */
function rangeMid(t){
  const s = String(t || '').replace(/(\d)\.(\d{3})/g, '$1$2');
  const m = s.match(/(\d+)\s*[-–]\s*(\d+)/); if(m) return (+m[1] + +m[2]) / 2;
  const d = s.match(/desde\s*(\d+)/i); if(d) return +d[1];
  return 0;
}
function leadValue(l){
  const v = num(l.valor_estimado); if(v > 0) return { v, src:'manual' };
  const r = rangeMid(l.tier_recomendado); if(r) return { v:r, src:'propuesta' };
  const a = avgTicket(); if(a) return { v:a, src:'media' };
  return { v: SECTOR_TICKET[l.sector] || 600, src:'sector' };
}
function wonDate(c){ return parseDate(c.creado_iso) || parseDate(c.inicio); }

/* Cuánto del importe se da por ganado según la fase del proyecto. */
const PHASE_PCT = { 'Onboarding':0, 'En implementación':0.5, 'Entregado':1, 'Evolución mensual':1, 'Pausado / finalizado':1 };
/* Primera fecha en la que el cliente entró en alguna de esas fases (según el historial). */
function phaseDate(c, phases){
  const logs = S.actividad.filter(a => a.entidad === 'cliente' && a.entidad_id === c.cliente_id && a.tipo === 'Estado')
    .sort((a,b) => String(a.fecha_iso).localeCompare(String(b.fecha_iso)));
  for(let i = 0; i < logs.length; i++){
    const to = String(logs[i].texto).split('→').pop().trim();
    if(phases.includes(to)) return parseDate(logs[i].fecha_iso);
  }
  return null;
}
/* Los cobros reconocidos y en qué fecha: 50 % al entrar en implementación y 50 % al entregar. */
function recognitions(c){
  const tot = num(c.importe_proyecto);
  const pct = PHASE_PCT[c.fase];
  if(!tot || !pct) return [];
  const impDate = phaseDate(c, ['En implementación'])
    || (c.fase === 'En implementación' ? parseDate(c.fase_desde) : null) || parseDate(c.inicio) || wonDate(c);
  const ev = [{ date: impDate, amount: tot * 0.5 }];
  if(pct === 1){
    const entDate = phaseDate(c, ['Entregado','Evolución mensual','Pausado / finalizado']) || parseDate(c.fase_desde) || impDate;
    ev.push({ date: entDate, amount: tot * 0.5 });
  }
  return ev.filter(e => e.date);
}
function recognized(c){ return recognitions(c).reduce((s,e) => s + e.amount, 0); }

/* Cobros: 50 % al entrar en implementación y 50 % al entregar. */
const PAY_DUE_1 = ['En implementación','Entregado','Evolución mensual','Pausado / finalizado'];
const PAY_DUE_2 = ['Entregado','Evolución mensual','Pausado / finalizado'];
function payPlan(c){
  const tot = num(c.importe_proyecto), p1 = Math.round(tot / 2), p2 = tot - p1;
  return [
    { n:1, label:'Primer pago (50 %)', amount:p1, due:PAY_DUE_1.includes(c.fase), paid:isYes(c.pago_1), fecha:c.pago_1_iso, hito:'al pasar a En implementación' },
    { n:2, label:'Pago final (50 %)',  amount:p2, due:PAY_DUE_2.includes(c.fase), paid:isYes(c.pago_2), fecha:c.pago_2_iso, hito:'al pasar a Entregado' }
  ];
}
function cobrado(c){ return payPlan(c).reduce((s, p) => s + (p.paid ? p.amount : 0), 0); }
function porCobrar(c){ return payPlan(c).reduce((s, p) => s + (p.due && !p.paid ? p.amount : 0), 0); }
function pendingRevenue(c){ return Math.max(0, num(c.importe_proyecto) - recognized(c)); }
function periodRange(p, back){
  const now = new Date(); let start, end = new Date(now);
  if(p === 'mes'){ start = new Date(now.getFullYear(), now.getMonth(), 1); }
  else if(p === 'trimestre'){ start = new Date(now.getFullYear(), now.getMonth() - 2, 1); }
  else if(p === 'año'){ start = new Date(now.getFullYear(), 0, 1); }
  else return { start:null, end:null };
  if(back){ // periodo anterior de la misma duración
    const len = end - start;
    end = new Date(start.getTime() - 1); start = new Date(start.getTime() - len);
  }
  return { start, end };
}
function inRange(d, r){ return d && (!r.start || (d >= r.start && d <= r.end)); }
function lastMonths(n){
  const out = [], now = new Date();
  for(let i = n - 1; i >= 0; i--){
    const s = new Date(now.getFullYear(), now.getMonth() - i, 1), e = new Date(now.getFullYear(), now.getMonth() - i + 1, 0, 23, 59, 59);
    out.push({ s, e, label: s.toLocaleDateString('es-ES', { month:'short' }).replace('.', '') });
  }
  return out;
}
function kEur(n){ n = Math.round(n); return Math.abs(n) >= 10000 ? (n / 1000).toLocaleString('es-ES', { maximumFractionDigits:1 }) + ' mil €' : eur(n); }
function leadOrigin(l){
  const o = String(l.origen_pagina || '');
  if(/prospecci/i.test(o)) return 'Prospección';
  if(o === 'CRM') return 'Manual';
  return 'Diagnóstico web';
}

/* ---------- Gráficos (SVG propio) ---------- */
function niceMax(v){ if(v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }

/* Barras (proyectos del mes) + línea (ingreso recurrente) */
function chartRevenue(months, bars, line){
  const W = 620, H = 230, L = 52, R = 14, T = 14, B = 30, iw = W - L - R, ih = H - T - B;
  const max = niceMax(Math.max(1, ...bars, ...line));
  const x = i => L + iw * (i + 0.5) / months.length, y = v => T + ih - ih * v / max, bw = Math.min(44, iw / months.length * 0.55);
  let g = '';
  for(let k = 0; k <= 4; k++){ const v = max * k / 4, yy = y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${C.line}" stroke-dasharray="${k ? '3 4' : ''}"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${C.muted}">${esc(kEur(v))}</text>`; }
  const barsSvg = bars.map((v, i) => `<rect class="grow" style="animation-delay:${i * 60}ms" x="${x(i) - bw / 2}" y="${y(v)}" width="${bw}" height="${Math.max(0, T + ih - y(v))}" rx="6" fill="${C.violet}"><title>${esc(months[i].label)}: ${esc(eur(v))} reconocidos de proyectos</title></rect>`).join('');
  const pts = line.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const dots = line.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#fff" stroke="${C.teal}" stroke-width="2.5"><title>${esc(months[i].label)}: ${esc(eur(v))}/mes de ingreso recurrente</title></circle>`).join('');
  const labels = months.map((m, i) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${C.muted}">${esc(m.label)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos por mes">${g}${barsSvg}<polyline class="draw" points="${pts}" fill="none" stroke="${C.teal}" stroke-width="2.5" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}

/* Barras apiladas por mes */
function chartStacked(months, series){
  const W = 420, H = 200, L = 28, R = 8, T = 10, B = 28, iw = W - L - R, ih = H - T - B;
  const totals = months.map((_, i) => series.reduce((s, se) => s + se.values[i], 0));
  const max = niceMax(Math.max(1, ...totals));
  const bw = Math.min(34, iw / months.length * 0.58), x = i => L + iw * (i + 0.5) / months.length;
  let g = '';
  for(let k = 0; k <= 2; k++){ const v = max * k / 2, yy = T + ih - ih * v / max;
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${C.line}" stroke-dasharray="${k ? '3 4' : ''}"/><text x="${L - 6}" y="${yy + 4}" text-anchor="end" font-size="11" fill="${C.muted}">${Math.round(v)}</text>`; }
  let bars = '';
  months.forEach((m, i) => {
    let acc = 0;
    series.forEach((se, si) => {
      const v = se.values[i]; if(!v) return;
      const h = ih * v / max, yy = T + ih - ih * (acc + v) / max;
      bars += `<rect class="grow" style="animation-delay:${i * 60}ms" x="${x(i) - bw / 2}" y="${yy}" width="${bw}" height="${h}" rx="${si === series.length - 1 || acc + v === totals[i] ? 5 : 0}" fill="${se.color}"><title>${esc(m.label)} · ${esc(se.name)}: ${v}</title></rect>`;
      acc += v;
    });
    if(totals[i]) bars += `<text x="${x(i)}" y="${T + ih - ih * totals[i] / max - 6}" text-anchor="middle" font-size="11.5" font-weight="600" fill="${C.ink}">${totals[i]}</text>`;
    bars += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="${C.muted}">${esc(m.label)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Leads nuevos por mes">${g}${bars}</svg>`;
}

function donut(segs, center, sub){
  const total = segs.reduce((s, x) => s + x.value, 0), r = 52, cx = 66, cy = 66, circ = 2 * Math.PI * r;
  let off = 0, arcs = '';
  if(!total) arcs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C.line}" stroke-width="16"/>`;
  segs.forEach(sg => {
    if(!sg.value) return;
    const len = circ * sg.value / total;
    arcs += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${sg.color}" stroke-width="16" stroke-dasharray="${len} ${circ - len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"><title>${esc(sg.label)}: ${sg.value}</title></circle>`;
    off += len;
  });
  return `<svg viewBox="0 0 132 132" role="img" aria-label="${esc(sub || '')}">${arcs}
      <text x="${cx}" y="${cy + 2}" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="24" fill="${C.ink}">${esc(center)}</text>
      <text x="${cx}" y="${cy + 20}" text-anchor="middle" font-size="10.5" fill="${C.muted}">${esc(sub || '')}</text></svg>`;
}

/* ---------- Render ---------- */
function renderHoy(){
  const alerts = computeAlerts();
  const urgent = alerts.filter(a => a.level === 'alta').length;
  const today = new Date(new Date().toDateString());
  const R = periodRange(S.period), Rprev = periodRange(S.period, true);

  // Ganado
  const evOf = (r) => S.clientes.flatMap(c => recognitions(c).filter(e => inRange(e.date, r)).map(e => ({ c, ...e })));
  const evPeriod = evOf(R), evPrev = S.period === 'todo' ? [] : evOf(Rprev);
  const won = Array.from(new Set(evPeriod.map(e => e.c.cliente_id)));
  const wonEur = evPeriod.reduce((s, e) => s + e.amount, 0);
  const wonPrevEur = evPrev.reduce((s, e) => s + e.amount, 0);
  const totalEur = S.clientes.reduce((s, c) => s + recognized(c), 0);
  const pendEur = S.clientes.reduce((s, c) => s + (ACTIVE_CLIENT.includes(c.fase) ? pendingRevenue(c) : 0), 0);
  const cobradoEur = S.clientes.reduce((s, c) => s + cobrado(c), 0);
  const porCobrarEur = S.clientes.reduce((s, c) => s + porCobrar(c), 0);
  const cobrosPend = S.clientes.filter(c => porCobrar(c) > 0);
  let delta = '';
  if(S.period !== 'todo'){
    if(!wonPrevEur && !wonEur) delta = '<span class="delta eq">igual</span>';
    else if(!wonPrevEur) delta = '<span class="delta up">nuevo</span>';
    else { const pct = Math.round((wonEur - wonPrevEur) / wonPrevEur * 100);
      delta = `<span class="delta ${pct > 0 ? 'up' : pct < 0 ? 'down' : 'eq'}">${pct > 0 ? '+' : ''}${pct} %</span>`; }
  }
  // Recurrente
  const act = S.clientes.filter(c => ACTIVE_CLIENT.includes(c.fase));
  const mrr = act.reduce((s, c) => s + num(c.cuota_mensual), 0);
  // Pipeline
  const open = S.leads.filter(l => OPEN_STAGES.includes(l.estado || 'Nuevo'));
  const vals = open.map(l => ({ l, ...leadValue(l), p: STAGE_PROB[l.estado || 'Nuevo'] || 0 }));
  const pipe = vals.reduce((s, x) => s + x.v, 0), forecast = vals.reduce((s, x) => s + x.v * x.p, 0);
  const estimated = vals.filter(x => x.src !== 'manual').length;
  // Conversión y ciclo
  const wonL = S.leads.filter(l => l.estado === 'Cliente'), lostL = S.leads.filter(l => l.estado === 'Descartado');
  const winRate = wonL.length + lostL.length ? Math.round(wonL.length / (wonL.length + lostL.length) * 100) : 0;
  const cycles = wonL.map(l => { const a = parseDate(l.fecha_iso), b = parseDate(l.estado_desde); return a && b ? (b - a) / 86400000 : null; }).filter(x => x !== null && x >= 0);
  const cycle = cycles.length ? Math.round(cycles.reduce((a,b) => a + b, 0) / cycles.length) : null;
  const newLeads = S.leads.filter(l => inRange(parseDate(l.fecha_iso || l.fecha), R)).length;

  // Pendientes
  const tasksDue = S.tareas.filter(t => !isDone(t) && parseDate(t.vence) && new Date(parseDate(t.vence).toDateString()) <= today);
  const lateTasks = tasksDue.filter(t => new Date(parseDate(t.vence).toDateString()) < today).length;
  const hotNew = S.leads.filter(l => l.estado === 'Nuevo' && segOf(l) === 'A');
  const week = new Date(today.getTime() + 8 * 86400000);
  const calls = S.leads.filter(l => l.estado === 'Llamada agendada' && (() => { const d = callDate(l); return d && d >= today && d < week; })());
  const proposals = S.leads.filter(l => l.estado === 'Propuesta enviada');
  const propEur = proposals.reduce((s, l) => s + leadValue(l).v, 0);
  const readyP = S.prospectos.filter(p => p.estado === 'Investigado' && ['MUY ALTA','ALTA'].includes(prospectPrio(prospectScore(p))));
  const cliDue = act.filter(c => { const d = parseDate(c.proximo_contacto); return d && new Date(d.toDateString()) <= today; });

  // Frase
  const date = new Date().toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
  let line;
  if(!S.leads.length && !S.clientes.length && !S.prospectos.length) line = 'Aquí verás cómo va el negocio en cuanto entren los primeros leads.';
  else if(urgent) line = (urgent === 1 ? 'Una cosa no debería esperar' : urgent + ' cosas no deberían esperar') + (isAdmin() && forecast ? ', y hay ' + kEur(forecast) + ' en previsión.' : '.');
  else if(calls.length) line = 'Todo al día. Tienes ' + calls.length + (calls.length === 1 ? ' llamada' : ' llamadas') + ' esta semana.';
  else line = 'Todo al día. Buen momento para mover la prospección.';

  // Series mensuales
  const months = lastMonths(6);
  const revBars = months.map(m => S.clientes.reduce((s, c) => s + recognitions(c).filter(e => e.date >= m.s && e.date <= m.e).reduce((t, e) => t + e.amount, 0), 0));
  const revLine = months.map(m => S.clientes.filter(c => {
    const d = wonDate(c); if(!d || d > m.e) return false;
    if(!ACTIVE_CLIENT.includes(c.fase)){ const f = parseDate(c.fase_desde); if(f && f <= m.e) return false; }
    return true; }).reduce((s, c) => s + num(c.cuota_mensual), 0));
  const origins = [['Diagnóstico web', C.violet], ['Prospección', C.gold], ['Manual', C.grey]];
  const stacked = origins.map(([name, color]) => ({ name, color, values: months.map(m => S.leads.filter(l => leadOrigin(l) === name && (() => { const d = parseDate(l.fecha_iso || l.fecha); return d && d >= m.s && d <= m.e; })()).length) }));

  // Embudo con valor
  const funnelStages = LEAD_STAGES.filter(s => !s.lost);
  const counts = funnelStages.map(st => S.leads.filter(l => (l.estado || 'Nuevo') === st.id).length);
  const reached = counts.map((_, i) => counts.slice(i).reduce((a,b) => a + b, 0));   // han llegado al menos a esa etapa
  const fMax = Math.max(1, ...reached);
  const fRows = funnelStages.map((st, i) => {
    const list = S.leads.filter(l => (l.estado || 'Nuevo') === st.id);
    const v = st.won ? list.reduce((s, l) => { const c = S.clientes.find(x => x.lead_id === l.lead_id); return s + (c ? recognized(c) : leadValue(l).v); }, 0) : list.reduce((s, l) => s + leadValue(l).v, 0);
    const conv = i > 0 && reached[i - 1] ? Math.round(reached[i] / reached[i - 1] * 100) : null;
    return (conv !== null ? `<div class="fn-conv">↓ ${conv} % llegan a esta etapa</div>` : '') +
      `<div class="fn-row"><span>${esc(st.id)}</span><span class="fn-bar"><i style="width:${Math.max(3, reached[i] / fMax * 100)}%;background:${st.color};animation-delay:${i * 80}ms"></i><b>${reached[i]}</b></span>
        <span class="val">${isAdmin() ? (v ? kEur(v) : '—') : ''}<small>${counts[i]} ahora</small></span></div>`;
  }).join('');

  // Sector
  const secColors = { 'psicologos-coaches':C.teal, 'inmobiliarias':C.gold, 'general':C.violet, 'manual':C.grey };
  const secSegs = Object.keys(SECTORS).map(k => ({ label:SECTORS[k], value:S.leads.filter(l => (l.sector || 'general') === k).length, color:secColors[k] })).filter(x => x.value);

        <div class="v">${open.length}</div>

    <div class="d-grid">
      ${!isAdmin() ? '' : `<div class="card-d span-7">

      </div>`}
      <div class="card-d ${isAdmin() ? 'span-5' : 'span-12'}">
        <div class="h"><h3>Embudo de conversión</h3><small>valor por etapa</small></div>
        <div class="b"><div class="fn">${fRows}</div></div>

    <div class="d-grid">
      <div class="card-d span-7">

          <tr data-open="lead" data-id="${esc(x.l.lead_id)}">

            <td class="money">${eur(x.v * x.p)}<small>${Math.round(x.p * 100)} % prob.</small></td>`
            : `<td class="muted">${esc(x.l.responsable || 'Sin asignar')}</td><td class="money">${Math.round(x.p * 100)} %<small>probabilidad</small></td>`}

      </div>
      <div class="card-d span-5">
        <div class="h"><h3>Requiere tu atención</h3><small>${alerts.length} aviso${alerts.length === 1 ? '' : 's'}</small></div>
        <div class="b flush scroll-list">${alertHtml}</div>
      </div>
    </div>

    <div class="d-grid">
      <div class="card-d span-5">
        <div class="h"><h3>Leads nuevos por mes</h3><small>${newLeads} ${esc(PERIOD_LABEL[S.period])}</small></div>
        <div class="b">${stacked.some(s => s.values.some(v => v)) ? chartStacked(months, stacked) : '<div class="chart-empty">Aún no han entrado leads.</div>'}
          <div class="legend">${stacked.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>
        </div>
      </div>
      <div class="card-d span-3">
        <div class="h"><h3>Leads por sector</h3></div>
        <div class="b"><div class="donut-wrap">${donut(secSegs, String(S.leads.length), 'leads')}
          <div class="donut-legend">${secSegs.length ? secSegs.map(s => `<div><i style="background:${s.color}"></i><span>${esc(s.label)}</span><b>${s.value}</b></div>`).join('') : '<span style="color:var(--soft)">Sin datos</span>'}</div></div></div>
      </div>
      <div class="card-d span-4">
        <div class="h"><h3>Prospección</h3><small><button class="linklike" data-go="prospeccion">Abrir</button></small></div>
        <div class="b"><div class="donut-wrap">${donut(prioSegs, String(pOpen.length), 'en curso')}
          <div class="donut-legend">${prioSegs.map(s => `<div><i style="background:${s.color}"></i><span>${esc(s.label)}</span><b>${s.value}</b></div>`).join('')}</div></div>
          <div class="mini-stats">
            <div><b>${pContact}</b><span>contactados</span></div>
            <div><b>${pContact ? Math.round(pConv / pContact * 100) : 0} %</b><span>pasan a lead</span></div>
            <div><b>${pOffers}</b><span>ofertas listas</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-grid">
      <div class="card-d span-7">
        <div class="h"><h3>Cartera de clientes</h3><small>${isAdmin() ? eur(mrr) + '/mes · ' : ''}${act.length} activos</small></div>
        <div class="b flush">${clients.length ? `<div class="scroll-list">${clients.map(c => { const h = HEALTH.find(x => x.id === c.salud) || HEALTH[0]; const pc = parseDate(c.proximo_contacto);
            return `<div class="cli-row" data-open="cliente" data-id="${esc(c.cliente_id)}"><span class="health ${h.css}" title="${esc(h.id)}"></span>
              <div><b>${esc(c.empresa || c.nombre)}</b><small>${esc(c.fase || '')}${pc ? ' · contacto ' + esc(fmtDate(pc)) : ''}${porCobrar(c) ? ' · <b style="color:#B23431">' + eur(porCobrar(c)) + ' por cobrar</b>' : ''}</small></div>
              <span class="money">${isAdmin() ? (num(c.cuota_mensual) ? eur(c.cuota_mensual) + '/mes' : '—') : esc(c.responsable || '')}</span>
              <span class="money" style="color:var(--muted);font-weight:500" title="Reconocido de lo contratado">${isAdmin() && num(c.importe_proyecto) ? eur(recognized(c)) + ' <span style="color:var(--soft);font-weight:400">de ' + eur(c.importe_proyecto) + '</span>' : ''}</span></div>`; }).join('')}</div>` : '<div class="empty">Todavía no hay clientes activos.</div>'}</div>
        ${act.length ? `<div class="foot">Relación: ${health.map(h => h.value + ' ' + h.label.toLowerCase()).join(' · ')}${isAdmin() && pendEur ? ' · Pendiente de entregar: ' + eur(pendEur) : ''}</div>` : ''}
      </div>
      <div class="card-d span-5">
        <div class="h"><h3>Tareas de hoy</h3><small><button class="linklike" data-go="tareas">Ver todas</button></small></div>
        <div class="b flush scroll-list">${todayTasks.length ? todayTasks.map(taskRow).join('') : '<div class="empty">Nada pendiente para hoy.</div>'}</div>
      </div>
    </div>`;
}

document.addEventListener('click', e => {
  const p = e.target.closest('[data-period]');
  if(p){ S.period = p.dataset.period; LS.set('period', S.period); renderAll(); return; }
  const q = e.target.closest('[data-queue]');
  if(q){ S.views.prospecto = 'cola'; S.qMode = 'contactar'; LS.set('views', S.views); }
}, true);

/* =====================================================================
   FICHAS (panel lateral)
   ===================================================================== */
function openDrawer(type, id){
  S.openType = type; S.openId = id;
  marcarLeidos(canalId(type, id));
  renderDrawer();
  $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false');
  $('#drawerBg').classList.add('on');
  setTimeout(() => { const x = $('#drawer .x'); if(x) x.focus(); }, 60);
}
function closeDrawer(){
  S.openType = null; S.openId = null; S.dirty = false;
  try{ if(document.activeElement && document.activeElement.blur) document.activeElement.blur(); }catch(e){}
  $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true');
  $('#drawerBg').classList.remove('on');
  if(typeof autoRefresh === 'function') autoRefresh(true);   // al cerrar, traemos lo que haya cambiado
}

function timelineHtml(type, id){
  const items = S.actividad.filter(a => a.entidad === type && a.entidad_id === id)
    .sort((a,b) => String(b.fecha_iso).localeCompare(String(a.fecha_iso)));
  if(!items.length) return '<p style="color:var(--muted);font-size:13.5px;margin:14px 0 0">Todavía no hay actividad. Anota cada llamada, email o reunión para no depender de la memoria.</p>';
  return '<ul class="timeline">' + items.map(a => {
    const long = String(a.texto || '').length > 360;
    return `<li style="--t:${ACT_COLORS[a.tipo] || 'var(--soft)'}">
        <div class="tl-meta"><b>${esc(a.tipo)}</b> ${esc(fmtDate(a.fecha_iso, true))}</div>
        <div class="tl-text ${long ? 'long' : ''}">${esc(a.texto)}</div>
        ${long ? '<button class="tl-more" data-expand>Ver completo</button>' : ''}
      </li>`;
  }).join('') + '</ul>';
}

function activityForm(){
  return `<form class="js-act">
      <textarea class="textarea" name="texto" placeholder="¿Qué ha pasado? Pega aquí también el resumen de la transcripción." required></textarea>
      <div class="form-row">
        <select class="select" name="tipo" aria-label="Tipo">${ACT_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
        <button class="btn btn-primary" type="submit" style="margin-left:auto">Guardar en el historial</button>
      </div>
    </form>`;
}

function tasksSec(type, id){
  const list = S.tareas.filter(t => t.entidad === type && t.entidad_id === id)
    .sort((a,b) => (isDone(a) - isDone(b)) || String(a.vence||'9').localeCompare(String(b.vence||'9')));
  return `<div class="sec" style="padding:16px 0 0">
      <h4 style="padding:0 18px">Tareas y recordatorios</h4>
      ${list.length ? list.map(taskRow).join('') : '<p style="color:var(--muted);font-size:13.5px;margin:0;padding:0 18px 12px">Sin tareas. Programa el siguiente seguimiento para que el CRM te lo recuerde.</p>'}
      <form class="add-task js-task">
        <input class="input" name="titulo" placeholder="Ej.: Llamar para cerrar la propuesta" required>
        <input class="input" name="vence" type="date" value="${addDays(2)}" required>
        <button class="btn btn-primary" type="submit">Añadir</button>
      </form>
    </div>`;
}

function renderDrawer(){
  const d = $('#drawer');
  if(S.openType === 'lead'){
    const l = S.leads.find(x => x.lead_id === S.openId);
    if(!l){ closeDrawer(); return; }
    d.innerHTML = leadDrawer(l);
    bindDrawer('lead', l.lead_id);
  } else if(S.openType === 'prospecto'){
    const p = S.prospectos.find(x => x.prospecto_id === S.openId);
    if(!p){ closeDrawer(); return; }
    d.innerHTML = prospectDrawer(p);
    bindDrawer('prospecto', p.prospecto_id);
  } else if(S.openType === 'cliente'){
    const c = S.clientes.find(x => x.cliente_id === S.openId);
    if(!c){ closeDrawer(); return; }
    d.innerHTML = clientDrawer(c);
    bindDrawer('cliente', c.cliente_id);
  }
}

function bindDrawer(type, id){
  const d = $('#drawer');
  const act = $('.js-act', d);
  if(act) act.addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(act);
    const texto = String(f.get('texto')).trim();
    if(!texto) return;
    commit('addActivity', { item: logItem(type, id, String(f.get('tipo')), texto) }, 'Guardado en el historial');
  });
  const tf = $('.js-task', d);
  if(tf) tf.addEventListener('submit', e => {
    e.preventDefault();
    const f = new FormData(tf);
    const titulo = String(f.get('titulo')).trim();
    if(!titulo) return;
    commit('addTask', { item:{ task_id:uid('TSK'), entidad:type, entidad_id:id, titulo, vence:String(f.get('vence')||''), hecha:false, creada_iso:nowIso(), completada_iso:'' } }, 'Recordatorio programado');
  });

  if(type === 'prospecto'){
    const sel = $('#stageSel', d);
    if(sel) sel.addEventListener('change', () => moveProspect(id, sel.value));
    const cb = $('#convertBtn', d);
    if(cb) cb.addEventListener('click', () => openConvertProspect(S.prospectos.find(x => x.prospecto_id === id)));
    const an = $('#analyzeOne', d);
    if(an) an.addEventListener('click', () => analyzeIds([id], true));
    $$('[data-sig]', d).forEach(b => b.addEventListener('click', () => {
      const p = S.prospectos.find(x => x.prospecto_id === id);
      const k = b.dataset.sig, v = b.dataset.val;
      const nv = (isYes(p[k]) && v === 'Sí') || (String(p[k]).trim() === 'No' && v === 'No') ? '' : v;
      commit('updateProspect', { prospecto_id:id, fields:{ [k]:nv } });
    }));
    const of = $('.js-offer', d);
    if(of){
      of.addEventListener('submit', e => {
        e.preventDefault();
        const f = new FormData(of);
        commit('updateProspect', { prospecto_id:id, fields:{ notas_inv:String(f.get('notas_inv')).trim(), oferta:String(f.get('oferta')).trim() } }, 'Guardado en tu hoja');
      });
      const gb = $('#genOffer', d);
      if(gb) gb.addEventListener('click', async () => {
        const p = S.prospectos.find(x => x.prospecto_id === id);
        const notas = String($('textarea[name=notas_inv]', of).value).trim();
        const oferta = String($('textarea[name=oferta]', of).value).trim();
        if(oferta && oferta !== String(p.oferta || '').trim() && !confirm('Has editado la oferta. Si la regeneras, se sustituye. ¿Seguir?')) return;
        if(!notas && !probText(p) && !SIGNALS.some(sg => isYes(p[sg.k]))){ toast('Añade antes alguna nota de investigación o marca señales: la IA necesita algo en lo que basarse.', true); return; }
        if(notas !== String(p.notas_inv || '').trim()) await commit('updateProspect', { prospecto_id:id, fields:{ notas_inv:notas } });
        offerIds([id], true);
      });
      const cm = $('#copyMsg', d);
      if(cm) cm.addEventListener('click', () => {
        const t = String($('textarea[name=oferta]', of).value);
        const msg = (t.split(/PRIMER MENSAJE:\s*/i)[1] || '').trim();
        if(!msg) return;
        (navigator.clipboard ? navigator.clipboard.writeText(msg) : Promise.reject()).then(() => toast('Mensaje copiado'), () => window.prompt('Copia el mensaje:', msg));
      });
    }
    const pf = $('.js-prospect', d);
    if(pf) pf.addEventListener('submit', e => {
      e.preventDefault();
      const f = new FormData(pf), fields = {};
      ['nombre','negocio','tipo','ciudad','web','email','telefono','linkedin','instagram','canal','notas','responsable'].forEach(k => fields[k] = String(f.get(k) ?? '').trim());
      commit('updateProspect', { prospecto_id:id, fields }, 'Cambios guardados');
    });
    return;
  }
  if(type === 'lead'){
    const sel = $('#stageSel', d);
    if(sel) sel.addEventListener('change', () => moveLead(id, sel.value));
    const cb = $('#convertBtn', d);
    if(cb) cb.addEventListener('click', () => openConvert(S.leads.find(x => x.lead_id === id)));
    const info = $('.js-leadinfo', d);
    if(info) info.addEventListener('submit', e => {
      e.preventDefault();
      const f = new FormData(info);
      commit('updateLead', { lead_id:id, fields:{ telefono:String(f.get('telefono')).trim(), empresa:String(f.get('empresa')).trim(), siguiente_accion:String(f.get('siguiente_accion')).trim(), responsable:String(f.get('responsable') || ''), valor_estimado:String(f.get('valor_estimado') || '').trim() } }, 'Cambios guardados');
    });
  } else {
    $$('[data-pay]', d).forEach(b => b.addEventListener('click', () => {
      const c = S.clientes.find(x => x.cliente_id === id), n = b.dataset.pay, p = payPlan(c).find(x => String(x.n) === n);
      const fields = p.paid ? { ['pago_' + n]:'No', ['pago_' + n + '_iso']:'' } : { ['pago_' + n]:'Sí', ['pago_' + n + '_iso']:nowIso() };
      const log = [logItem('cliente', id, 'Sistema', (p.paid ? 'Marcado como NO cobrado' : 'Cobrado') + ': ' + p.label + ' · ' + eur(p.amount))];
      commit('updateClient', { cliente_id:id, fields, log }, p.paid ? 'Marcado como pendiente' : 'Cobro registrado: ' + eur(p.amount));
    }));
    const cf = $('.js-client', d);
    if(cf) cf.addEventListener('submit', e => {
      e.preventDefault();
      const f = new FormData(cf);
      const c = S.clientes.find(x => x.cliente_id === id);
      const fields = {};
      ['fase','salud','proximo_contacto','inicio','servicio','telefono','notas','responsable'].forEach(k => fields[k] = String(f.get(k) ?? '').trim());
      if(isAdmin()) ['importe_proyecto','cuota_mensual'].forEach(k => fields[k] = String(f.get(k) ?? '').trim());
      const log = [];
      if(c && fields.fase !== c.fase) log.push(logItem('cliente', id, 'Estado', (c.fase||'Onboarding') + ' → ' + fields.fase));
      if(c && fields.salud !== c.salud) log.push(logItem('cliente', id, 'Sistema', 'Relación: ' + (c.salud||'Bien') + ' → ' + fields.salud));
      commit('updateClient', { cliente_id:id, fields, log }, 'Cambios guardados');
    });
  }
}

function openModal(html, onSubmit){
  $('#modal').innerHTML = html;
  $('#modalBg').hidden = false;
  const form = $('#modal form');
  const first = $('#modal input, #modal select, #modal textarea');
  if(first) setTimeout(() => first.focus(), 30);
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const btn = form.querySelector('button[type=submit]');
    if(btn) btn.disabled = true;                                  // evita doble envío
    let r;
    try{ r = await onSubmit(new FormData(form)); }
    finally{ if(btn) btn.disabled = false; }
    if(r !== false) closeModal();                                 // devolver false deja la ventana abierta
  });
  $$('[data-cancel]', $('#modal')).forEach(b => b.addEventListener('click', closeModal));
}
function closeModal(){ $('#modalBg').hidden = true; $('#modal').innerHTML = ''; S.dirty = false; renderAll(); if(typeof autoRefresh === 'function') autoRefresh(true); }

/* =====================================================================
   PROSPECCIÓN: ficha, conversión, importación y análisis de webs
   ===================================================================== */
function extUrl(v, base){
  const t = String(v || '').trim();
  if(!t) return '';
  if(/^https?:\/\//i.test(t)) return t;
  if(base && /^@?[\w.\-]+$/.test(t)) return base + t.replace(/^@/,'');
  return 'https://' + t.replace(/^\/+/,'');
}

function prospectDrawer(p){
  const score = prospectScore(p), prio = prospectPrio(score);
  const tel = String(p.telefono || '').replace(/[^\d+]/g,'');
  const web = safeUrl(extUrl(p.web)), li = safeUrl(extUrl(p.linkedin)), ig = safeUrl(extUrl(p.instagram, 'https://instagram.com/'));
  const sigs = SIGNALS.map(sg => {
    const v = String(p[sg.k] || '').trim(), si = isYes(v), no = v === 'No';
