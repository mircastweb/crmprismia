  .msg-vacio span{font-size:13.5px;max-width:34ch;}
  .abajo{position:absolute;right:18px;bottom:96px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line-2);background:#fff;box-shadow:0 6px 18px rgba(21,21,31,0.14);font-size:15px;color:var(--muted);z-index:3;}

  .msg-form{border-top:1px solid var(--line);padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;background:#FDFCFA;}
  .msg-form .campo{position:relative;}
  .msg-form textarea{min-height:42px;max-height:160px;resize:none;border-radius:var(--r-md);font-size:14px;line-height:1.5;}
  .msg-form-pie{display:flex;align-items:center;gap:10px;}
  .msg-form-pie .pista{font-size:11.5px;color:var(--soft);}
  .msg-form-pie .btn{margin-left:auto;}
  .contexto{display:flex;align-items:center;gap:8px;background:#F4F1FF;border-left:3px solid var(--violet);border-radius:var(--r-sm);padding:7px 10px;font-size:12.5px;color:var(--muted);}
  .contexto.edit{background:rgba(245,166,35,0.12);border-color:var(--gold);}
  .contexto span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .contexto button{border:none;background:none;color:var(--muted);font-size:13px;}
  .men-pop{position:absolute;bottom:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:0 12px 30px rgba(21,21,31,0.16);padding:5px;min-width:220px;z-index:20;}
  .men-pop button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;padding:6px 8px;border-radius:var(--r-sm);font-size:13.5px;}
  .men-pop button:hover,.men-pop button.sel{background:#F4F1FF;}
  .msg-mini{display:flex;flex-direction:column;gap:10px;max-height:280px;overflow-y:auto;margin-bottom:12px;}
  .msg-mini .msg-acts{display:none !important;}

  @media (max-width:900px){
    .msg-wrap{grid-template-columns:1fr;}
    .msg-side{height:auto;max-height:calc(100dvh - 250px);}
    .msg-panel{display:none;height:calc(100dvh - 255px);}
    .msg-head{position:sticky;top:0;z-index:5;}
    .msg-wrap.en-chat .msg-side{display:none;}
    .msg-wrap.en-chat .msg-panel{display:flex;}
    .msg-head .volver{display:block;}
    .burbuja{max-width:100%;}
  }




  /* ---------- presupuesto y servicios ---------- */
  .pres{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;}
  .pres-l{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .pres-l:last-of-type{border-bottom:none;}
  .pres-l:hover{background:#FAF9F6;}
  .pres-l b{display:block;font-weight:600;}
  .pres-l small{display:block;color:var(--muted);font-size:12px;}
  .pres-l .imp{font-family:var(--display);font-weight:600;white-space:nowrap;}
  .pres-l .acc{display:flex;gap:2px;}
  .pres-l .acc button{border:none;background:none;color:var(--soft);font-size:13px;padding:3px 5px;border-radius:50%;}
  .pres-l .acc button:hover{background:var(--col);color:var(--ink);}
  .pres-l.rechazada{opacity:0.55;}
  .pres-l.rechazada b{text-decoration:line-through;}
  .chip-est{font-size:11px;border-radius:var(--pill);padding:1px 8px;white-space:nowrap;}
  .chip-est.prop{background:rgba(245,166,35,0.16);color:var(--gold-d);}
  .chip-est.acep{background:rgba(20,184,166,0.13);color:#0C7A6D;}
  .chip-est.rech{background:var(--col);color:var(--muted);}
  .pres-tot{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:#FAF9F6;padding:11px 12px;border-top:1px solid var(--line);font-size:13px;}
  .pres-tot b{font-family:var(--display);font-size:1.05rem;}
  .pres-tot .sep{color:var(--line-2);}
  .pres-acc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
  @media (max-width:560px){ .pres-l{grid-template-columns:1fr auto;} .pres-l .chip-est{display:none;} }

  /* ---------- menú «Más» del móvil ---------- */
  .nav-mas{display:none;}
  .hoja-bg{position:fixed;inset:0;background:rgba(21,21,31,0.45);z-index:45;}
  .hoja{position:fixed;left:0;right:0;bottom:0;z-index:46;background:var(--panel);border-radius:18px 18px 0 0;padding:10px 10px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -14px 40px rgba(21,21,31,0.22);}
  .hoja::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 12px;}
  .hoja-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .hoja-grid button{display:flex;flex-direction:column;align-items:center;gap:7px;background:#FAF9F6;border:1px solid var(--line);border-radius:var(--r-md);padding:14px 6px;font-size:12.5px;font-weight:600;color:var(--ink);position:relative;}
  .hoja-grid button:hover{border-color:var(--ink);}
  .hoja-grid svg{width:22px;height:22px;stroke:var(--violet);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;}
  .hoja-grid .nav-count{position:absolute;top:8px;right:12px;}

  /* ---------- registro de tiempo ---------- */
  .tm-bar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px;display:grid;grid-template-columns:1fr auto auto auto auto;gap:10px;align-items:center;margin-bottom:18px;}
  .tm-bar input.desc{border:none;background:transparent;font-size:15px;padding:8px 6px;width:100%;}
  .tm-bar input.desc:focus{outline:none;}
  .tm-bar .select{width:auto;max-width:230px;}
  .tm-fact{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;}
  .tm-reloj{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:0.02em;min-width:92px;text-align:right;font-variant-numeric:tabular-nums;}
  .tm-go{border:none;border-radius:50%;width:46px;height:46px;background:var(--violet);color:#fff;font-size:17px;display:grid;place-items:center;}
  .tm-go.stop{background:#D8423F;}
  .tm-bar.corriendo{border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,252,0.12);}
  @media (max-width:820px){ .tm-bar{grid-template-columns:1fr auto;} .tm-bar .select{grid-column:1 / -1;max-width:none;} }

  .tm-tabs{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .tm-tabs .sum{margin-left:auto;font-size:13.5px;color:var(--muted);}
  .tm-dia{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:12px;overflow:hidden;}
  .tm-dia-cab{display:flex;align-items:center;gap:10px;padding:11px 16px;background:#FAF9F6;border-bottom:1px solid var(--line);font-size:13px;}
  .tm-dia-cab b{font-family:var(--display);text-transform:capitalize;}
  .tm-dia-cab .tot{margin-left:auto;font-family:var(--display);font-weight:700;}
  .tm-fila{display:grid;grid-template-columns:1fr auto auto auto auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .tm-fila:last-child{border-bottom:none;}
  .tm-fila:hover{background:#FAF9F6;}
  .tm-fila .txt b{display:block;font-weight:600;}
  .tm-fila .txt small{color:var(--muted);font-size:12px;}
  .tm-fila .horas{color:var(--muted);font-size:12.5px;white-space:nowrap;}
  .tm-fila .dur{font-family:var(--display);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .tm-fila .acc{display:flex;gap:4px;}
  .tm-fila .acc button{border:none;background:none;color:var(--soft);font-size:14px;padding:4px 6px;border-radius:50%;}
  .tm-fila .acc button:hover{background:var(--col);color:var(--ink);}
  .tm-fila.viva{background:rgba(124,92,252,0.06);}
  .chip-fact{font-size:11px;border-radius:var(--pill);padding:1px 8px;background:rgba(20,184,166,0.13);color:#0C7A6D;}
  .chip-nofact{font-size:11px;border-radius:var(--pill);padding:1px 8px;background:var(--col);color:var(--muted);}
  @media (max-width:760px){ .tm-fila{grid-template-columns:1fr auto;} .tm-fila .horas{display:none;} }

  .tm-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  @media (max-width:900px){ .tm-kpis{grid-template-columns:repeat(2,1fr);} }
  .tm-kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;}
  .tm-kpi span{font-size:12.5px;color:var(--muted);font-weight:600;}
  .tm-kpi b{display:block;font-family:var(--display);font-size:1.7rem;margin-top:6px;}
  .tm-kpi small{color:var(--muted);font-size:12px;}
  .tm-tabla{width:100%;border-collapse:collapse;font-size:13.5px;}
  .tm-tabla th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 16px;border-bottom:1px solid var(--line);}
  .tm-tabla td{padding:10px 16px;border-bottom:1px solid var(--line);}
  .tm-tabla tr:last-child td{border-bottom:none;}
  .tm-tabla .num{text-align:right;font-family:var(--display);font-weight:600;white-space:nowrap;}
  .barra{height:8px;border-radius:4px;background:var(--col);overflow:hidden;min-width:90px;}
  .barra i{display:block;height:100%;background:var(--violet);border-radius:4px;}

  /* ---------- bóveda de claves ---------- */
  .vault{max-width:920px;}
  .vault-lock{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;max-width:460px;}
  .vault-lock h3{font-size:1.15rem;margin-bottom:6px;}
  .vault-lock p{color:var(--muted);font-size:13.5px;margin:0 0 18px;}
  .vault-lock form{display:flex;flex-direction:column;gap:12px;}
  .key-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;margin-bottom:10px;}
  .key-row b{display:block;font-family:var(--display);font-size:1rem;}
  .key-row small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;}
  .key-row .acts{display:flex;gap:6px;flex-wrap:wrap;}
  .key-row .btn{padding:6px 12px;font-size:12.5px;}
  .key-secret{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--col);border-radius:var(--r-sm);padding:6px 10px;margin-top:8px;font-size:13px;word-break:break-all;}
  .vault-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
  .vault-head .btn{margin-left:auto;}
  .vault-avisos{font-size:12.5px;color:var(--muted);margin-top:14px;line-height:1.5;}

  /* ---------- panel lateral ---------- */
  .drawer-bg{position:fixed;inset:0;background:rgba(21,21,31,0.38);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;}
  .drawer-bg.on{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:31;transform:translateX(100%);
          transition:transform .26s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(21,21,31,0.18);}
  .drawer.on{transform:none;}
  .dr-head{background:var(--panel);padding:20px 22px 16px;border-bottom:1px solid var(--line);}
  .dr-row{display:flex;align-items:flex-start;gap:12px;}
  .dr-head h2{font-size:1.3rem;line-height:1.25;}
  .dr-head .sub{color:var(--muted);font-size:13.5px;margin-top:2px;}
  .x{margin-left:auto;background:none;border:1px solid var(--line-2);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;flex-shrink:0;}
  .x:hover{border-color:var(--ink);}
  .dr-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;}
  .dr-stage{display:flex;gap:8px;align-items:center;margin-top:14px;}
  .dr-stage .select{width:auto;flex:1;}
  .dr-body{padding:18px 22px 40px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px;}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;}
  .sec > h4{font-size:0.95rem;margin-bottom:12px;}
  .facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:12px;}
  .facts div{background:var(--panel);padding:11px 12px;}
  .facts b{display:block;font-family:var(--display);font-size:1.15rem;}
  .facts span{font-size:12px;color:var(--muted);}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13.5px;}
  .kv dt{color:var(--muted);}
  .kv dd{margin:0;overflow-wrap:anywhere;}
  .quote{font-size:13.5px;color:#3A3A48;background:var(--col);border-radius:var(--r-sm);padding:10px 12px;margin-top:10px;}
  .form-row{display:flex;gap:8px;margin-top:10px;}
  .form-row .select{width:150px;flex-shrink:0;}
  .timeline{list-style:none;margin:14px 0 0;padding:0;}
  .timeline li{position:relative;padding:0 0 14px 20px;}
  .timeline li::before{content:"";position:absolute;left:4px;top:7px;bottom:-7px;width:1px;background:var(--line-2);}
  .timeline li:last-child::before{display:none;}
  .timeline li::after{content:"";position:absolute;left:0;top:5px;width:9px;height:9px;border-radius:50%;background:var(--t,var(--soft));}
  .tl-meta{font-size:12px;color:var(--muted);}
  .tl-meta b{color:var(--ink);font-weight:600;}
  .tl-text{white-space:pre-wrap;font-size:13.5px;margin-top:2px;}
  .tl-text.long{max-height:120px;overflow:hidden;position:relative;}
  .tl-text.long::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,var(--panel));}
  .tl-more{background:none;border:none;padding:0;color:var(--violet);font-size:12.5px;font-weight:600;margin-top:3px;}

  /* ---------- modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(21,21,31,0.45);display:grid;place-items:center;padding:18px;z-index:40;}
  .modal{background:var(--panel);border-radius:var(--r-lg);width:min(520px,100%);max-height:90vh;overflow:auto;padding:24px;}
  .modal h3{font-size:1.2rem;margin-bottom:4px;}
  .modal p.lead{color:var(--muted);margin:0 0 18px;font-size:13.5px;}
  .modal form{display:flex;flex-direction:column;gap:12px;}
  .modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px;}

  /* ---------- ajustes ---------- */
  .settings{display:grid;gap:20px;max-width:780px;}
  .settings .sec p{margin:0 0 12px;color:var(--muted);font-size:13.5px;}
  pre.code{background:var(--side);color:#E7E5F3;border-radius:var(--r-sm);padding:14px;font-size:12.5px;overflow-x:auto;margin:10px 0 0;white-space:pre-wrap;}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--pill);
         font-size:13.5px;opacity:0;pointer-events:none;transition:all .22s;z-index:60;max-width:90vw;}
  .toast.on{opacity:1;transform:translate(-50%,0);}
  .toast.err{background:var(--red);}
  @media (max-width:900px){ .toast{bottom:84px;} }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }
</style>
</head>
<body>

<!-- ============ ACCESO ============ -->
<section class="login" id="login" hidden>
  <div class="login-card">
    <img class="logo" src="logo-prismia.png" alt="PrismIA">
    <h1>Entra en tu CRM</h1>
    <p class="lead">Conecta con tu hoja de leads. Los datos se quedan en tu Google Drive.</p>
    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="apiUrl">Dirección del puente (Apps Script)</label>
        <input class="input" id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" required>
      </div>
      <div class="field">
        <label for="apiKey">Clave de acceso</label>
        <input class="input" id="apiKey" type="password" required>
      </div>
      <div class="login-err" id="loginErr" role="alert"></div>
      <button class="btn btn-primary" type="submit" style="justify-content:center;padding:11px;">Conectar</button>
    </form>
    <div class="login-alt">
      ¿Aún no has instalado el puente? <button class="linklike" id="demoBtn" type="button">Probar con datos de ejemplo</button>
    </div>
  </div>
</section>

<!-- ============ APLICACIÓN ============ -->
<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><img src="logo-prismia.png" alt="PrismIA"><span>CRM</span></div>
    <nav class="nav" aria-label="Secciones">
      <button class="nav-item active" data-view="hoy">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Panel <span class="nav-count" id="nc-hoy" hidden></span>
      </button>
      <button class="nav-item" data-view="prospeccion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3M11 8v6M8 11h6"/></svg>
        Prospección <span class="nav-count" id="nc-pro" hidden></span>
      </button>
      <button class="nav-item" data-view="conversion">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h18l-7 8v6l-4 2v-8z"/></svg>
        Conversión <span class="nav-count" id="nc-conv" hidden></span>
      </button>
      <button class="nav-item" data-view="clientes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.7.8 2.7 2.5 3 5.2"/></svg>
        Clientes <span class="nav-count" id="nc-cli" hidden></span>
      </button>
      <button class="nav-item" data-view="mensajes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3z"/></svg>
        Mensajes <span class="nav-count" id="nc-msg" hidden></span>
      </button>
      <button class="nav-item" data-view="tiempos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>
        Tiempos <span class="nav-count" id="nc-tiempo" hidden></span>
      </button>
      <button class="nav-item" data-view="claves">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v4M15 12v3"/></svg>
        Claves
      </button>
      <button class="nav-item" data-view="tareas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
        Tareas <span class="nav-count" id="nc-tar" hidden></span>
      </button>
      <button class="nav-item" data-view="ajustes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        Ajustes
      </button>
      <button class="nav-item nav-mas" id="navMas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>
        Más <span class="nav-count" id="nc-mas" hidden></span>
      </button>
    </nav>
    <div class="hoja-bg" id="masBg" hidden></div>
    <div class="hoja" id="masHoja" hidden aria-label="Más apartados"></div>
    <div class="side-foot">
      <span id="quienSoy" style="font-weight:600;color:#EDEBF7"></span>
      <span class="sync" id="sync"><i></i><span id="syncTxt">Sin conectar</span></span>
      <span class="demo-flag" id="demoFlag" hidden>Modo ejemplo</span>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <h1 id="viewTitle">Panel</h1>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input class="input" id="q" type="search" placeholder="Buscar nombre, empresa o email" aria-label="Buscar">
      </label>
      <button class="btn" id="refreshBtn" title="Volver a cargar los datos de la hoja">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>Actualizar
      </button>
      <button class="btn btn-primary" id="newLeadBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="newLbl">Nuevo lead</span>
      </button>
    </header>

    <section class="view" id="view-hoy"></section>
    <section class="view" id="view-prospeccion" hidden></section>
    <section class="view" id="view-conversion" hidden></section>
    <section class="view" id="view-clientes" hidden></section>
    <section class="view" id="view-mensajes" hidden></section>
    <section class="view" id="view-tiempos" hidden></section>
    <section class="view" id="view-claves" hidden></section>
    <section class="view" id="view-tareas" hidden></section>
    <section class="view" id="view-ajustes" hidden></section>
  </main>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-label="Ficha"></aside>
<div class="modal-bg" id="modalBg" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';

/* =====================================================================
   CONFIGURACIÓN
   ===================================================================== */
const CRM_VERSION = '2026.10.01';
const CAL_DEFAULT = 'https://cal.com/miriam-terol-castello-1osn4w/llamada-de-diagnostico-30-min';

const LEAD_STAGES = [
  { id:'Nuevo',             color:'#9A9AA6' },
  { id:'Contactado',        color:'#F5A623' },
  { id:'Llamada agendada',  color:'#EC5C8D' },
  { id:'Propuesta enviada', color:'#7C5CFC' },
  { id:'Cliente',           color:'#14B8A6', won:true },
  { id:'Descartado',        color:'#C4C3CC', lost:true }
];
const OPEN_STAGES = ['Nuevo','Contactado','Llamada agendada','Propuesta enviada'];

const CLIENT_STAGES = [
  { id:'Onboarding',           color:'#F5A623' },
  { id:'En implementación',    color:'#EC5C8D' },
  { id:'Entregado',            color:'#7C5CFC' },
  { id:'Evolución mensual',    color:'#14B8A6' },
  { id:'Pausado / finalizado', color:'#C4C3CC', lost:true }
];
const ACTIVE_CLIENT = ['Onboarding','En implementación','Entregado','Evolución mensual'];

const ACT_TYPES = ['Nota','Llamada','Email','WhatsApp','Mensaje','Reunión','Transcripción'];
const ACT_COLORS = { 'Nota':'#9A9AA6','Llamada':'#EC5C8D','Email':'#F5A623','WhatsApp':'#14B8A6','Mensaje':'#F5A623','Reunión':'#7C5CFC','Transcripción':'#7C5CFC','Estado':'#15151F','Sistema':'#C4C3CC' };
const SECTORS = { 'general':'General','inmobiliarias':'Inmobiliarias','psicologos-coaches':'Psicólogos y coaches','manual':'Manual' };
const LOST_REASONS = ['Precio','No es el momento','No responde','No encaja con lo que hacemos','Eligió otra opción','Otro'];
const HEALTH = [{id:'Bien',css:'bien'},{id:'Atención',css:'atencion'},{id:'En riesgo',css:'riesgo'}];

/* ---------- Prospección ---------- */
const PROSPECT_STAGES = [
  { id:'Por investigar',  color:'#9A9AA6' },
  { id:'Investigado',     color:'#F5A623' },
  { id:'Contactado',      color:'#EC5C8D' },
  { id:'En conversación', color:'#7C5CFC' },
  { id:'Convertido',      color:'#14B8A6', won:true },
  { id:'Descartado',      color:'#C4C3CC', lost:true }
];
const OPEN_PROSPECT = ['Por investigar','Investigado','Contactado','En conversación'];
/* Mismos pesos que la hoja Base_Prospeccion_PrismIA (máximo 16 puntos). */
const SIGNALS = [
  { k:'s_web',        label:'Tiene web propia',                pts:1, hint:'No cuenta Instagram, Linktree ni Doctoralia' },
  { k:'s_formulario', label:'Tiene formulario',                pts:1, hint:'' },
  { k:'s_whatsapp',   label:'Tiene WhatsApp',                  pts:1, hint:'' },
  { k:'s_reserva',    label:'Tiene reserva online',            pts:1, hint:'Calendly, Doctoralia, Cal.com…' },
  { k:'s_modalidades',label:'Ofrece varias modalidades',       pts:1, hint:'Online y presencial' },
  { k:'s_otros_prof', label:'Trabaja con otros profesionales', pts:2, hint:'Más coordinación' },
  { k:'s_newsletter', label:'Tiene newsletter',                pts:1, hint:'' },
  { k:'s_publica',    label:'Publica regularmente',            pts:1, hint:'Blog o redes activas' },
  { k:'s_servicios',  label:'Tiene varios servicios',          pts:1, hint:'' },
  { k:'s_manual',     label:'Se detecta gestión manual',       pts:3, hint:'Señal directa de fricción' },
  { k:'s_cursos',     label:'Tiene cursos o membresía',        pts:1, hint:'' },
  { k:'s_equipo',     label:'Tiene equipo visible',            pts:2, hint:'Procesos internos probables' }
];
const CHANNELS = ['LinkedIn','Instagram','Teléfono','Email (con consentimiento)','Presencial / evento','Referido'];
function isYes(v){ return /^s[ií]$/i.test(String(v || '').trim()); }
/* "Notas / problema detectado" puede ser un Sí/No o un texto: solo es texto útil si no es Sí/No. */
function isYN(v){ return /^(s[ií]|no)$/i.test(String(v || '').trim()); }
function probText(p){ const t = String(p.notas || '').trim(); return isYN(t) ? '' : t; }
/* Texto principal de un prospecto: tus notas de investigación y, si no hay, el problema escrito. */
function mainNote(p){ return String(p.notas_inv || '').trim() || probText(p); }
function prospectScore(p){ return SIGNALS.reduce((t, s) => t + (isYes(p[s.k]) ? s.pts : 0), 0); }
function prospectPrio(score){ return score >= 10 ? 'MUY ALTA' : score >= 7 ? 'ALTA' : score >= 4 ? 'MEDIA' : 'BAJA'; }
function prioCss(p){ return { 'MUY ALTA':'muy', 'ALTA':'alta', 'MEDIA':'media' }[p] || ''; }
function prospectName(p){ return p.negocio || p.nombre || p.web || 'Sin nombre'; }
/* Claves para detectar duplicados: dominio de la web, email e Instagram. */
const SOCIAL_HOSTS = /(^|\.)(instagram\.com|facebook\.com|linktr\.ee|linkedin\.com|doctoralia\.es|topdoctors\.es|tiktok\.com|youtube\.com|google\.com|goo\.gl|wa\.me)$/i;
function dedupeKeys(p){
  const keys = [];
  const w = String(p.web || '').trim().toLowerCase();
  if(w){
    const clean = w.replace(/^https?:\/\//,'').replace(/^www\./,'').replace(/[?#].*$/,'').replace(/\/+$/,'');
    const host = clean.split('/')[0];
    keys.push('w:' + (SOCIAL_HOSTS.test(host) ? clean : host));
  }
  const e = String(p.email || '').trim().toLowerCase();
  if(e) keys.push('e:' + e);
  const ig = String(p.instagram || '').trim().toLowerCase().replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/^@/,'').replace(/[/?#].*$/,'');
  if(ig) keys.push('i:' + ig);
  return keys;
}

const TRASH_LABEL = { lead:'Lead', cliente:'Cliente', prospecto:'Prospecto' };
function trashName(tipo, x){ return tipo === 'cliente' ? (x.empresa || x.nombre || '') : tipo === 'lead' ? leadName(x) : prospectName(x); }
/* Quién soy y qué puedo hacer. */
function isAdmin(){ return S.me.rol !== 'Comercial'; }        // por defecto, administradora
function yo(){ return S.me.nombre || ''; }
function usuariosActivos(){
  const l = (S.usuarios || []).filter(u => String(u.activo || 'Sí').trim().toLowerCase() !== 'no').map(u => u.nombre).filter(Boolean);
  if(yo() && l.indexOf(yo()) === -1) l.unshift(yo());
  return l;
}

/* =====================================================================
   MENSAJERÍA
   ===================================================================== */
const EMOJIS = ['👍','🎉','🔥','✅','👀','😂','❤️','🙏'];
const MSG = { filtro:'todos', q:'', replyTo:null, editando:null, movil:'lista', canal:'general' };

function leidoPor(m){ return String(m.leido_por || '').split('|').map(x => x.trim()).filter(Boolean); }
function noLeido(m){ return String(m.autor || '') !== yo() && leidoPor(m).indexOf(yo()) === -1; }
function meMenciona(m){ return String(m.menciones || '').split('|').map(x => x.trim()).indexOf(yo()) !== -1; }
function canalId(entidad, id){ return entidad === 'general' ? 'general' : entidad + ':' + id; }
function canalDM(otro){ return 'dm:' + [yo(), otro].sort().join('||'); }
function otroDM(id){ return String(id).split('||').map(x => x.trim()).filter(n => n !== yo())[0] || ''; }
function canalPartes(c){ const i = String(c).indexOf(':'); return i === -1 ? { entidad:'general', id:'' } : { entidad:String(c).slice(0, i), id:String(c).slice(i + 1) }; }
function canalNombre(c){
  const p = canalPartes(c);
  if(p.entidad === 'general') return 'Equipo';
  if(p.entidad === 'dm') return otroDM(p.id) || 'Privado';
  return entityLabel(p.entidad, p.id);
}
function canalTipo(c){ const e = canalPartes(c).entidad; return e === 'general' ? 'general' : e === 'dm' ? 'dm' : 'ficha'; }
function mensajesDe(c){
  const p = canalPartes(c);
  return S.mensajes.filter(m => String(m.entidad || 'general') === p.entidad && String(m.entidad_id || '') === p.id)
    .sort((a,b) => String(a.fecha_iso).localeCompare(String(b.fecha_iso)));
}
function reaccionesDe(m){ try{ return JSON.parse(String(m.reacciones || '{}')) || {}; }catch(e){ return {}; } }

/* ---------- Personas: iniciales y color estable ---------- */
const AV_COLORS = ['#7C5CFC','#EC5C8D','#F5A623','#14B8A6','#5B8DEF','#C56BE0','#E8703A'];
function iniciales(n){
  const p = String(n || '?').trim().split(/\s+/);
  return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase();
}
function colorDe(n){
  let h = 0; String(n || '').split('').forEach(c => h = (h * 31 + c.charCodeAt(0)) % 9973);
  return AV_COLORS[h % AV_COLORS.length];
}
function avatar(n, size){
  return `<span class="av" style="background:${colorDe(n)};${size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size/2.6) + 'px' : ''}" title="${esc(n)}">${esc(iniciales(n))}</span>`;
}

/* ---------- Fechas ---------- */
function mismoDia(a, b){ return a && b && a.toDateString() === b.toDateString(); }
function etiquetaDia(d){
  const hoy = new Date(), ayer = new Date(Date.now() - 86400000);
  if(mismoDia(d, hoy)) return 'Hoy';
  if(mismoDia(d, ayer)) return 'Ayer';
  return d.toLocaleDateString('es-ES', { weekday:'long', day:'numeric', month:'long' });
}
function horaCorta(v){ const d = parseDate(v); return d ? d.toLocaleTimeString('es-ES', { hour:'2-digit', minute:'2-digit' }) : ''; }
function haceRato(v){
  const d = parseDate(v); if(!d) return '';
  const min = Math.floor((Date.now() - d.getTime()) / 60000);
  if(min < 1) return 'ahora';
  if(min < 60) return 'hace ' + min + ' min';
  const hoy = new Date();
  if(mismoDia(d, hoy)) return horaCorta(v);
  if(mismoDia(d, new Date(Date.now() - 86400000))) return 'ayer';
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short' });
}

/* ---------- Texto: menciones y enlaces ---------- */
function textoMsg(m){
  let t = esc(m.texto);
  t = t.replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.length > 48 ? u.slice(0, 45) + '…' : u}</a>`);
  usuariosActivos().concat([yo()]).filter(Boolean).forEach(n => {
    t = t.split('@' + esc(n)).join('<span class="men">@' + esc(n) + '</span>');
  });
  return t.replace(/^&gt; ?(.*)$/gm, '<span class="cita">$1</span>');
}

/* ---------- Borradores ---------- */
function draft(c, v){
  const d = LS.get('drafts', {});
  if(v === undefined) return d[c] || '';
  if(v) d[c] = v; else delete d[c];
  LS.set('drafts', d);
}

/* ---------- Canales ---------- */
function canales(){
  const mapa = {};
  S.mensajes.forEach(m => {
    const c = canalId(String(m.entidad || 'general'), String(m.entidad_id || ''));
    if(!mapa[c]) mapa[c] = { c, ultimo:m, sinLeer:0, mencion:false };
    if(String(m.fecha_iso) >= String(mapa[c].ultimo.fecha_iso)) mapa[c].ultimo = m;
    if(noLeido(m)){ mapa[c].sinLeer++; if(meMenciona(m)) mapa[c].mencion = true; }
  });
  if(!mapa['general']) mapa['general'] = { c:'general', ultimo:null, sinLeer:0, mencion:false };
  usuariosActivos().filter(n => n !== yo()).forEach(n => { const c = canalDM(n); if(!mapa[c]) mapa[c] = { c, ultimo:null, sinLeer:0, mencion:false }; });
  const orden = { general:0, dm:1, ficha:2 };
  return Object.values(mapa).sort((a,b) =>
    (b.sinLeer > 0) - (a.sinLeer > 0) ||
    (orden[canalTipo(a.c)] - orden[canalTipo(b.c)]) ||
    String((b.ultimo||{}).fecha_iso || '').localeCompare(String((a.ultimo||{}).fecha_iso || '')));
}

function renderMensajes(){
  const lista = canales();
  if(!lista.some(x => x.c === MSG.canal)) MSG.canal = 'general';
  const q = MSG.q.toLowerCase();
  const visibles = lista.filter(x => {
    if(MSG.filtro === 'nolei' && !x.sinLeer) return false;
    if(!q) return true;
    return canalNombre(x.c).toLowerCase().includes(q) || String((x.ultimo||{}).texto || '').toLowerCase().includes(q);
  });
  const totalSinLeer = lista.reduce((n,x) => n + x.sinLeer, 0);

  const grupos = { general:'Equipo', dm:'Privados', ficha:'Fichas' };
  let ultimo = '';
  const filas = visibles.map(x => {
    const g = canalTipo(x.c);
    const cab = g !== ultimo ? `<div class="msg-sep">${grupos[ultimo = g]}</div>` : '';
    const u = x.ultimo;
    const quien = u ? (String(u.autor) === yo() ? 'Tú' : String(u.autor).split(' ')[0]) : '';
    return cab + `<button class="msg-ch ${x.c === MSG.canal ? 'on' : ''} ${x.sinLeer ? 'nuevo' : ''}" data-canal="${esc(x.c)}">
        ${g === 'dm' ? avatar(canalNombre(x.c), 34) : `<span class="av ico ${g}">${g === 'general' ? '#' : '◆'}</span>`}
        <span class="ch-txt"><b>${esc(canalNombre(x.c))}</b>
          <small>${u ? esc(quien + ': ' + u.texto) : (g === 'dm' ? 'Empieza una conversación privada' : 'Sin mensajes todavía')}</small></span>
        <span class="ch-meta">${u ? `<i>${esc(haceRato(u.fecha_iso))}</i>` : ''}
          ${x.sinLeer ? `<span class="msg-badge ${x.mencion ? 'men' : ''}">${x.sinLeer}</span>` : ''}</span>
      </button>`;
  }).join('') || '<div class="empty" style="padding:26px 16px">Nada que mostrar.</div>';

  $('#view-mensajes').innerHTML = `<div class="msg-wrap ${MSG.movil === 'chat' ? 'en-chat' : ''}">
      <div class="msg-side">
        <div class="msg-search">
          <input class="input" id="msgQ" type="search" placeholder="Buscar conversación" value="${esc(MSG.q)}" aria-label="Buscar conversación">
        </div>
        <div class="msg-filtros">
          <button class="${MSG.filtro === 'todos' ? 'on' : ''}" data-msgf="todos">Todos</button>
          <button class="${MSG.filtro === 'nolei' ? 'on' : ''}" data-msgf="nolei">Sin leer${totalSinLeer ? ' (' + totalSinLeer + ')' : ''}</button>
          ${totalSinLeer ? '<button id="leerTodo" title="Marcar todo como leído">Marcar leído</button>' : ''}
        </div>
        <div class="msg-list">${filas}</div>
      </div>
      ${panelChat()}
    </div>`;
  bindMensajes();
}

function panelChat(){
  const c = MSG.canal, p = canalPartes(c), tipo = canalTipo(c);
  const ms = mensajesDe(c);
  const primerNoLeido = ms.find(noLeido);
  let dia = null, autorPrev = null, tsPrev = 0;
  const cuerpo = ms.map(m => {
    const d = parseDate(m.fecha_iso), mio = String(m.autor) === yo();
    let out = '';
    if(!mismoDia(d, dia)){ out += `<div class="dia"><span>${esc(etiquetaDia(d))}</span></div>`; dia = d; autorPrev = null; }
    if(primerNoLeido && m.mensaje_id === primerNoLeido.mensaje_id) out += '<div class="dia nuevos"><span>Mensajes nuevos</span></div>';
    const seguido = autorPrev === m.autor && d && (d.getTime() - tsPrev) < 5 * 60000;
    autorPrev = m.autor; tsPrev = d ? d.getTime() : 0;
    const reac = reaccionesDe(m);
    const chips = Object.keys(reac).map(e => `<button class="reac ${reac[e].indexOf(yo()) !== -1 ? 'mia' : ''}" data-reac="${esc(m.mensaje_id)}" data-emoji="${esc(e)}" title="${esc(reac[e].join(', '))}">${e} ${reac[e].length}</button>`).join('');
    return out + `<div class="msg ${mio ? 'mio' : ''} ${seguido ? 'seguido' : ''}" data-msg="${esc(m.mensaje_id)}">
        <span class="msg-av">${seguido ? '' : avatar(m.autor, 34)}</span>
        <div class="msg-cuerpo">
          ${seguido ? '' : `<div class="msg-cab"><b>${esc(mio ? 'Tú' : m.autor)}</b><i>${esc(horaCorta(m.fecha_iso))}</i>${m.editado_iso ? '<i class="ed">editado</i>' : ''}</div>`}
          <div class="burbuja ${meMenciona(m) ? 'men-mi' : ''}">${textoMsg(m)}</div>
          ${chips ? `<div class="reacs">${chips}</div>` : ''}
        </div>
        <div class="msg-acts">
          ${EMOJIS.slice(0, 3).map(e => `<button data-reac="${esc(m.mensaje_id)}" data-emoji="${e}" title="Reaccionar">${e}</button>`).join('')}
          <button data-mas="${esc(m.mensaje_id)}" title="Más reacciones">＋</button>
          <button data-resp="${esc(m.mensaje_id)}" title="Responder">↩</button>
          ${mio ? `<button data-edit-msg="${esc(m.mensaje_id)}" title="Editar">✎</button>` : ''}
          ${mio || isAdmin() ? `<button data-delmsg="${esc(m.mensaje_id)}" title="Borrar">✕</button>` : ''}
        </div>
      </div>`;
  }).join('');

  const sub = tipo === 'general' ? 'Lo ve todo el equipo'
    : tipo === 'dm' ? '🔒 Privado: solo vosotros dos'
    : 'Conversación guardada en esta ficha';
  return `<div class="msg-panel">
      <div class="msg-head">
        <button class="volver" data-volver title="Volver">‹</button>
        ${tipo === 'dm' ? avatar(canalNombre(c), 34) : `<span class="av ico ${tipo}">${tipo === 'general' ? '#' : '◆'}</span>`}
        <span class="head-txt"><b>${esc(canalNombre(c))}</b><small>${sub}</small></span>
        ${tipo === 'ficha' ? `<button class="btn" data-open="${esc(p.entidad)}" data-id="${esc(p.id)}">Abrir ficha</button>` : ''}
      </div>
      <div class="msg-body" id="msgBody">${ms.length ? cuerpo : `<div class="msg-vacio">
          ${tipo === 'dm' ? avatar(canalNombre(c), 56) : ''}
          <b>${tipo === 'dm' ? 'Aún no habéis hablado' : 'Sin mensajes todavía'}</b>
          <span>${tipo === 'dm' ? 'Lo que escribáis aquí no lo ve nadie más.' : tipo === 'ficha' ? 'Lo que escribas queda guardado junto al historial de esta ficha.' : 'Escribe el primero: lo verá todo el equipo.'}</span>
        </div>`}</div>
      <button class="abajo" id="irAbajo" hidden title="Ir al final">↓</button>
      ${composer(c)}
    </div>`;
}

function composer(c){
  const tipo = canalTipo(c);
  const resp = MSG.replyTo ? S.mensajes.find(m => m.mensaje_id === MSG.replyTo) : null;
  const ed = MSG.editando ? S.mensajes.find(m => m.mensaje_id === MSG.editando) : null;
  const texto = ed ? ed.texto : draft(c);
  return `<form class="msg-form js-msg" data-canal="${esc(c)}">
      ${resp ? `<div class="contexto"><span>Respondiendo a <b>${esc(resp.autor)}</b>: ${esc(String(resp.texto).slice(0, 80))}</span><button type="button" data-cancel-ctx>✕</button></div>` : ''}
      ${ed ? `<div class="contexto edit"><span>Editando tu mensaje</span><button type="button" data-cancel-ctx>✕</button></div>` : ''}
      <div class="campo">
        <textarea class="textarea" name="texto" id="msgTexto" rows="1" placeholder="${tipo === 'dm' ? 'Mensaje privado para ' + esc(otroDM(canalPartes(c).id)) : 'Escribe un mensaje…'}">${esc(texto)}</textarea>
        <div class="men-pop" id="menPop" hidden></div>
      </div>
      <div class="msg-form-pie">
        <span class="pista">Intro envía · Mayús+Intro salto de línea${usuariosActivos().filter(n => n !== yo()).length && tipo !== 'dm' ? ' · @ menciona' : ''}</span>
        <button class="btn btn-primary" type="submit">${ed ? 'Guardar' : 'Enviar'}</button>
      </div>
    </form>`;
}

/* Versión compacta para la conversación dentro de una ficha. */
function miniMsg(m){
  const mio = String(m.autor) === yo();
  return `<div class="msg ${mio ? 'mio' : ''}">
      <span class="msg-av">${avatar(m.autor, 30)}</span>
      <div class="msg-cuerpo">
        <div class="msg-cab"><b>${esc(mio ? 'Tú' : m.autor)}</b><i>${esc(haceRato(m.fecha_iso))}</i></div>
        <div class="burbuja">${textoMsg(m)}</div>
      </div></div>`;
}

/* ---------- Acciones ---------- */
async function enviarMensaje(form){
  const c = form.dataset.canal, p = canalPartes(c);
  const ta = form.querySelector('textarea');
  let texto = String(ta.value || '').trim();
  if(!texto) return;
  if(MSG.editando){
    const m = S.mensajes.find(x => x.mensaje_id === MSG.editando);
    MSG.editando = null;
    if(m){ m.texto = texto; m.editado_iso = nowIso(); }
    renderAll();
    if(CFG.demo){ Demo.save(); return; }
    try{ await Api.call('editMessage', { mensaje_id:m.mensaje_id, texto }); }
    catch(err){ toast(err.message, true); await load(true); }
    return;
  }
  if(MSG.replyTo){
    const r = S.mensajes.find(m => m.mensaje_id === MSG.replyTo);
    if(r) texto = '> ' + String(r.autor) + ': ' + String(r.texto).replace(/\n/g,' ').slice(0, 120) + '\n' + texto;
    MSG.replyTo = null;
  }
  const menciones = usuariosActivos().filter(n => texto.indexOf('@' + n) !== -1);
  const item = { mensaje_id:uid('MSG'), entidad:p.entidad, entidad_id:p.id, texto, autor:yo(),
                 menciones:menciones.join(' | '), fecha_iso:nowIso(), leido_por:yo(), reacciones:'', editado_iso:'' };
  S.mensajes.push(item);
  ta.value = ''; draft(c, ''); S.dirty = false;
  renderAll();
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('postMessage', item); }
  catch(err){ toast('No se pudo enviar: ' + err.message, true); await load(true); }
}
async function reaccionar(id, emoji){
  const m = S.mensajes.find(x => x.mensaje_id === id); if(!m) return;
  const mapa = reaccionesDe(m), lista = mapa[emoji] || [], i = lista.indexOf(yo());
  if(i === -1) lista.push(yo()); else lista.splice(i, 1);
  if(lista.length) mapa[emoji] = lista; else delete mapa[emoji];
  m.reacciones = JSON.stringify(mapa);
  renderAll();
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('reactMessage', { mensaje_id:id, emoji }); }
  catch(err){ toast(err.message, true); await load(true); }
}
async function marcarLeidos(c){
  const ids = mensajesDe(c).filter(noLeido).map(m => m.mensaje_id);
  if(!ids.length) return;
  ids.forEach(id => { const m = S.mensajes.find(x => x.mensaje_id === id); if(m) m.leido_por = (m.leido_por ? m.leido_por + ' | ' : '') + yo(); });
  renderNavCounts();
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('markRead', { ids }); }catch(e){}
}
async function marcarTodoLeido(){
  const ids = S.mensajes.filter(noLeido).map(m => m.mensaje_id);
  if(!ids.length) return;
  ids.forEach(id => { const m = S.mensajes.find(x => x.mensaje_id === id); if(m) m.leido_por = (m.leido_por ? m.leido_por + ' | ' : '') + yo(); });
  renderAll();
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('markRead', { ids }); toast('Todo marcado como leído'); }catch(e){}
}
async function borrarMensaje(id){
  if(!confirm('¿Borrar este mensaje?')) return;
  S.mensajes = S.mensajes.filter(m => m.mensaje_id !== id);
  renderAll();
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('deleteMessage', { mensaje_id:id }); }
  catch(err){ toast(err.message, true); await load(true); }
}

/* ---------- Enganches de la vista ---------- */
let msgScroll = { c:null, abajo:true, top:0 };
function bindMensajes(){
  const root = $('#view-mensajes'), body = $('#msgBody'), ta = $('#msgTexto');
  // En móvil, al entrar en una conversación la pantalla sube: así se ve la cabecera y el botón de volver.
  if(MSG.movil === 'chat' && window.innerWidth <= 900) window.scrollTo({ top:0 });

  if(body){
    if(msgScroll.c === MSG.canal && !msgScroll.abajo) body.scrollTop = msgScroll.top;
    else body.scrollTop = body.scrollHeight;
    body.addEventListener('scroll', () => {
      const abajo = body.scrollHeight - body.scrollTop - body.clientHeight < 60;
      msgScroll = { c:MSG.canal, abajo, top:body.scrollTop };
      const b = $('#irAbajo'); if(b) b.hidden = abajo;
    });
  }
  const ab = $('#irAbajo');
  if(ab) ab.addEventListener('click', () => { body.scrollTop = body.scrollHeight; ab.hidden = true; });

  const q = $('#msgQ');
  if(q) q.addEventListener('input', () => { MSG.q = q.value; const pos = q.selectionStart; renderMensajes(); const n = $('#msgQ'); if(n){ n.focus(); n.setSelectionRange(pos, pos); } });
  $$('[data-msgf]', root).forEach(b => b.addEventListener('click', () => { MSG.filtro = b.dataset.msgf; renderMensajes(); }));
  const lt = $('#leerTodo'); if(lt) lt.addEventListener('click', marcarTodoLeido);
  const vol = $('[data-volver]', root); if(vol) vol.addEventListener('click', () => { MSG.movil = 'lista'; renderMensajes(); });

  $$('[data-resp]', root).forEach(b => b.addEventListener('click', () => { MSG.replyTo = b.dataset.resp; MSG.editando = null; renderMensajes(); $('#msgTexto').focus(); }));
  $$('[data-edit-msg]', root).forEach(b => b.addEventListener('click', () => { MSG.editando = b.dataset.editMsg; MSG.replyTo = null; renderMensajes(); const t = $('#msgTexto'); t.focus(); t.setSelectionRange(t.value.length, t.value.length); }));
  $$('[data-cancel-ctx]', root).forEach(b => b.addEventListener('click', () => { MSG.replyTo = null; MSG.editando = null; renderMensajes(); }));
  $$('[data-reac]', root).forEach(b => b.addEventListener('click', () => reaccionar(b.dataset.reac, b.dataset.emoji)));
  $$('[data-mas]', root).forEach(b => b.addEventListener('click', e => {
    const id = b.dataset.mas;
    const menu = document.createElement('div');
    menu.className = 'emoji-pop';
    menu.innerHTML = EMOJIS.map(x => `<button data-reac="${esc(id)}" data-emoji="${x}">${x}</button>`).join('');
    document.body.appendChild(menu);
    const r = b.getBoundingClientRect();
    menu.style.left = Math.max(8, Math.min(r.left - 90, window.innerWidth - 240)) + 'px';
    menu.style.top = (r.top - 46) + 'px';
    $$('[data-reac]', menu).forEach(x => x.addEventListener('click', () => { reaccionar(x.dataset.reac, x.dataset.emoji); menu.remove(); }));
    setTimeout(() => document.addEventListener('click', function cerrar(){ menu.remove(); document.removeEventListener('click', cerrar); }, { once:true }), 0);
  }));

  if(ta){
    const autoAlto = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; };
    autoAlto();
    ta.addEventListener('input', () => { autoAlto(); if(!MSG.editando) draft(MSG.canal, ta.value); menciones(ta); });
    ta.addEventListener('keydown', e => {
      const pop = $('#menPop');
      if(pop && !pop.hidden){
        const items = $$('button', pop);
        let i = items.findIndex(x => x.classList.contains('sel'));
        if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
          e.preventDefault();
          if(i > -1) items[i].classList.remove('sel');
          i = e.key === 'ArrowDown' ? (i + 1) % items.length : (i <= 0 ? items.length - 1 : i - 1);
          items[i].classList.add('sel'); return;
        }
        if(e.key === 'Enter' || e.key === 'Tab'){ e.preventDefault(); (items[i > -1 ? i : 0] || {}).click && items[i > -1 ? i : 0].click(); return; }
        if(e.key === 'Escape'){ pop.hidden = true; return; }
      }
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); enviarMensaje(ta.closest('form')); }
      if(e.key === 'Escape' && (MSG.replyTo || MSG.editando)){ MSG.replyTo = null; MSG.editando = null; renderMensajes(); }
    });
    if(MSG.replyTo || MSG.editando || draft(MSG.canal)) ta.focus();
  }
  marcarLeidos(MSG.canal);
}

/* Autocompletado de menciones al escribir @ */
function menciones(ta){
  const pop = $('#menPop'); if(!pop) return;
  const hasta = ta.value.slice(0, ta.selectionStart);
  const m = hasta.match(/@([\wÁÉÍÓÚáéíóúñÑ ]{0,20})$/);
  const otros = usuariosActivos().filter(n => n !== yo());
  if(!m || canalTipo(MSG.canal) === 'dm' || !otros.length){ pop.hidden = true; return; }
  const busca = m[1].toLowerCase().trim();
  const hits = otros.filter(n => n.toLowerCase().includes(busca)).slice(0, 5);
  if(!hits.length){ pop.hidden = true; return; }
  pop.innerHTML = hits.map((n, i) => `<button type="button" class="${i === 0 ? 'sel' : ''}" data-men="${esc(n)}">${avatar(n, 24)}<span>${esc(n)}</span></button>`).join('');
  pop.hidden = false;
  $$('button', pop).forEach(b => b.addEventListener('click', () => {
    const antes = ta.value.slice(0, ta.selectionStart).replace(/@[\wÁÉÍÓÚáéíóúñÑ ]{0,20}$/, '');
    const despues = ta.value.slice(ta.selectionStart);
    ta.value = antes + '@' + b.dataset.men + ' ' + despues;

  }));
}

/* =====================================================================
   RENTABILIDAD POR CLIENTE
   Cruza las horas registradas con lo facturado. Solo para la administradora.
   ===================================================================== */
function costeHora(persona){
  const u = (S.usuarios || []).find(x => String(x.nombre) === String(persona));
  return u ? num(u.coste_hora) : 0;
}
function mesesActivo(c){
  const ini = parseDate(c.inicio) || parseDate(c.creado_iso);
  if(!ini) return 0;
  const fin = ACTIVE_CLIENT.includes(c.fase) ? new Date() : (parseDate(c.fase_desde) || new Date());
  return Math.max(0, Math.round((fin - ini) / (30.44 * 86400000)));
}
/* Las horas de un cliente incluyen las que se dedicaron a su lead antes de ganarlo. */
function tiemposCliente(c){
  const ids = ['cliente:' + c.cliente_id];
  if(c.lead_id) ids.push('lead:' + c.lead_id);
  return S.tiempos.filter(t => ids.includes(String(t.entidad) + ':' + String(t.entidad_id)));
}
function rentabilidad(c){
  const ts = tiemposCliente(c);
  const min = ts.reduce((a,t) => a + minutosDe(t), 0);
  const minFact = ts.filter(t => t.facturable !== 'No').reduce((a,t) => a + minutosDe(t), 0);
  const coste = ts.reduce((a,t) => a + (minutosDe(t) / 60) * costeHora(t.usuario), 0);
  const recurrente = num(c.cuota_mensual) * mesesActivo(c);
  const ingresos = num(c.importe_proyecto) + recurrente;
  const horas = min / 60;
  return {
    horas, horasFact: minFact / 60, entradas: ts.length,
    ingresos, proyecto: num(c.importe_proyecto), recurrente, meses: mesesActivo(c),
    porHora: horas > 0 ? ingresos / horas : null,
    coste, conCoste: coste > 0,
    margen: ingresos - coste,
    margenPct: ingresos > 0 && coste > 0 ? Math.round((ingresos - coste) / ingresos * 100) : null
  };
}

/* Bloque para la ficha del cliente. */
function bloqueRentabilidad(c){
  if(!isAdmin()) return '';
  const r = rentabilidad(c);
  if(!r.entradas) return `<div class="sec"><h4>Rentabilidad</h4>
      <p style="margin:0;font-size:13.5px;color:var(--muted)">Todavía nadie ha registrado tiempo en este cliente. En cuanto lo hagáis, aquí verás cuánto te renta cada hora dedicada.</p></div>`;
  return `<div class="sec"><h4>Rentabilidad</h4>
      <div class="mini-stats" style="margin-top:0">
        <div><b>${hhmm(r.horas * 60)}</b><span>dedicadas</span></div>
        <div><b>${r.porHora ? eur(r.porHora) : '—'}</b><span>por hora</span></div>
        <div><b>${r.conCoste ? eur(r.margen) : eur(r.ingresos)}</b><span>${r.conCoste ? 'margen' + (r.margenPct !== null ? ' (' + r.margenPct + ' %)' : '') : 'ingresos'}</span></div>
      </div>
      <p style="margin:10px 0 0;font-size:12.5px;color:var(--muted)">${eur(r.proyecto)} de proyecto${r.recurrente ? ' + ' + eur(r.recurrente) + ' de cuota (' + r.meses + ' ' + (r.meses === 1 ? 'mes' : 'meses') + ')' : ''}${r.conCoste ? ' · coste estimado ' + eur(r.coste) : ' · pon el coste por hora de cada persona en Ajustes para ver el margen'}.</p>
    </div>`;
}

/* Pestaña completa dentro de Tiempos. */

  const filas = S.clientes.map(c => ({ c, r:rentabilidad(c) }))

  return `<div class="tm-kpis">

      <div class="tm-kpi"><span>${conCoste ? 'Margen' : 'Coste'}</span><b>${conCoste ? eur(totIng - totCoste) : '—'}</b><small>${conCoste ? Math.round((totIng - totCoste) / totIng * 100) + ' % sobre ingresos' : 'pon el coste/hora en Ajustes'}</small></div>
    </div>
    <div class="card-d">
      <div class="h"><h3>Cliente a cliente</h3><small>de más a menos rentable</small></div>
      <div class="b flush"><table class="tm-tabla">
        <thead><tr><th>Cliente</th><th class="num">Horas</th><th class="num">Ingresos</th><th style="min-width:150px">€/hora</th>${conCoste ? '<th class="num">Margen</th>' : ''}</tr></thead>
        <tbody>${filas.map(({ c, r }) => {
          const flojo = r.porHora !== null && r.porHora < medio * 0.6;
          return `<tr data-open="cliente" data-id="${esc(c.cliente_id)}" style="cursor:pointer">
            <td><b>${esc(c.empresa || c.nombre)}</b><br><small style="color:var(--muted)">${esc(c.fase || '')}${r.meses ? ' · ' + r.meses + ' ' + (r.meses === 1 ? 'mes' : 'meses') : ''}</small></td>
            <td class="num">${r.horas ? hhmm(r.horas * 60) : '—'}</td>

            <td><div style="display:flex;align-items:center;gap:9px"><b class="num" style="${flojo ? 'color:#B23431' : ''};min-width:62px">${r.porHora ? eur(r.porHora) : '—'}</b>
              <span class="barra" style="flex:1"><i style="width:${Math.round((r.porHora || 0) / max * 100)}%;${flojo ? 'background:#D8423F' : ''}"></i></span></div></td>
            ${conCoste ? `<td class="num" style="${r.margen < 0 ? 'color:#B23431' : ''}">${r.coste ? eur(r.margen) + (r.margenPct !== null ? ' <span style="font-weight:400;color:var(--soft)">' + r.margenPct + ' %</span>' : '') : '—'}</td>` : ''}
          </tr>`;

      <div class="foot">Los ingresos son el importe del proyecto más la cuota acumulada desde que empezó. Las horas incluyen las dedicadas a su lead antes de ganarlo. En rojo, los que rinden menos del 60 % de tu media: ahí estás perdiendo dinero o el proyecto se alargó más de la cuenta.</div>

/* =====================================================================
   PRESUPUESTO Y SERVICIOS CONTRATADOS
   ===================================================================== */
function lineasDe(ent, id){
  return S.servicios.filter(l => String(l.entidad) === ent && String(l.entidad_id) === String(id))
    .sort((a,b) => String(a.creado_iso).localeCompare(String(b.creado_iso)));
}
function totalLinea(l){ return (num(l.cantidad) || 1) * num(l.precio); }
function totales(lineas){
  const vivas = lineas.filter(l => l.estado !== 'Rechazado');
  return {
    unico: vivas.filter(l => l.tipo !== 'Mensual').reduce((a,l) => a + totalLinea(l), 0),
    mensual: vivas.filter(l => l.tipo === 'Mensual').reduce((a,l) => a + totalLinea(l), 0),
    unicoAcep: vivas.filter(l => l.tipo !== 'Mensual' && l.estado === 'Aceptado').reduce((a,l) => a + totalLinea(l), 0),
    mensualAcep: vivas.filter(l => l.tipo === 'Mensual' && l.estado === 'Aceptado').reduce((a,l) => a + totalLinea(l), 0),
    pendientes: vivas.filter(l => l.estado === 'Propuesto').length
  };
}
const ESTADO_CSS = { 'Propuesto':'prop', 'Aceptado':'acep', 'Rechazado':'rech' };

/* Bloque reutilizable: presupuesto de un lead o servicios de un cliente. */
function bloqueServicios(ent, id, opciones){
  if(!isAdmin()) return '';
  const o = opciones || {};
  const lineas = lineasDe(ent, id), t = totales(lineas);
  const filas = lineas.map(l => `<div class="pres-l ${l.estado === 'Rechazado' ? 'rechazada' : ''}" data-linea="${esc(l.linea_id)}">
      <span><b>${esc(l.concepto)}</b><small>${esc(l.detalle || '')}${num(l.cantidad) > 1 ? (l.detalle ? ' · ' : '') + num(l.cantidad) + ' × ' + eur(l.precio) : ''}</small></span>
      <span class="chip-est ${ESTADO_CSS[l.estado] || 'prop'}">${esc(l.estado || 'Propuesto')}</span>
      <span class="imp">${eur(totalLinea(l))}${l.tipo === 'Mensual' ? '<span style="font-weight:400;color:var(--muted)">/mes</span>' : ''}</span>
      <span class="acc">
        ${l.estado !== 'Aceptado' ? `<button data-lacep="${esc(l.linea_id)}" title="Marcar aceptada">✓</button>` : ''}
        ${l.estado !== 'Rechazado' ? `<button data-lrech="${esc(l.linea_id)}" title="Marcar rechazada">⊘</button>` : ''}
        <button data-ledit="${esc(l.linea_id)}" title="Editar">✎</button>
        <button data-ldel="${esc(l.linea_id)}" title="Borrar">✕</button>
      </span>
    </div>`).join('');
  return `<div class="sec">
      <h4>${esc(o.titulo || 'Presupuesto')}</h4>
      ${lineas.length ? `<div class="pres">${filas}
        <div class="pres-tot">
          <span>Pago único <b>${eur(t.unico)}</b></span>
          ${t.mensual ? `<span class="sep">·</span><span>Cuota <b>${eur(t.mensual)}</b>/mes</span>` : ''}
          ${t.pendientes ? `<span class="sep">·</span><span style="color:var(--gold-d)">${t.pendientes} sin confirmar</span>` : ''}
          ${t.mensual ? `<span class="sep">·</span><span style="color:var(--muted)">primer año ${eur(t.unico + t.mensual * 12)}</span>` : ''}
        </div></div>`
        : `<p style="margin:0;font-size:13.5px;color:var(--muted)">Sin líneas todavía. Añade los servicios que le has presupuestado y sus precios: así no hay que recordarlos de memoria.</p>`}
      <div class="pres-acc">
        <button class="btn btn-primary" data-lnueva="${esc(ent)}:${esc(id)}">Añadir servicio</button>
        ${lineas.length ? `<button class="btn" data-lcopiar="${esc(ent)}:${esc(id)}">Copiar resumen</button>` : ''}
        ${o.aplicar && lineas.length ? `<button class="btn" data-laplicar="${esc(id)}">Aplicar al proyecto</button>` : ''}
      </div>
      ${o.aplicar && lineas.length ? `<p style="margin:10px 0 0;font-size:12px;color:var(--muted)">«Aplicar al proyecto» pone el importe (${eur(t.unicoAcep)}) y la cuota (${eur(t.mensualAcep)}/mes) de las líneas aceptadas en los datos del cliente, que es lo que usan los cobros y el Panel.</p>` : ''}
    </div>`;
}

function editarLinea(ent, id, linea){

    <form>
      <div class="field"><label>Concepto</label><input class="input" name="concepto" value="${esc(l.concepto || '')}" placeholder="Ej.: Agenda online con recordatorios" required></div>

    </form>`, async f => {

/* =====================================================================
   REGISTRO DE TIEMPO

const TM = { vista:'mis', periodo:'semana', usuario:'', desc:'', entidad:'', fact:true };
let tmTick = null;

function hhmm(min){
  min = Math.max(0, Math.round(num(min)));
  return String(Math.floor(min / 60)).padStart(2,'0') + ':' + String(min % 60).padStart(2,'0');
}
function hhmmss(ms){
  const t = Math.max(0, Math.floor(ms / 1000));
  return [Math.floor(t/3600), Math.floor((t%3600)/60), t%60].map(x => String(x).padStart(2,'0')).join(':');
}
function horas(min){ return (num(min) / 60).toFixed(2).replace('.', ',') + ' h'; }
function corriendo(){ return S.tiempos.find(t => String(t.usuario) === yo() && !String(t.fin_iso || '').trim()) || null; }
function minutosDe(t){
  if(String(t.fin_iso || '').trim()) return num(t.minutos) || Math.round((parseDate(t.fin_iso) - parseDate(t.inicio_iso)) / 60000);
  const d = parseDate(t.inicio_iso);
  return d ? Math.round((Date.now() - d.getTime()) / 60000) : 0;
}
function tmEtiqueta(t){
  if(!t.entidad || !t.entidad_id) return 'Sin asignar';
  return entityLabel(t.entidad, t.entidad_id) || 'Sin asignar';
}
function rangoTM(p){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  if(p === 'hoy') return { desde:hoy, hasta:new Date() };
  if(p === 'semana'){ const d = new Date(hoy); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return { desde:d, hasta:new Date() }; }
  if(p === 'mes') return { desde:new Date(hoy.getFullYear(), hoy.getMonth(), 1), hasta:new Date() };
  if(p === 'mespasado'){ const a = new Date(hoy.getFullYear(), hoy.getMonth() - 1, 1); return { desde:a, hasta:new Date(hoy.getFullYear(), hoy.getMonth(), 0, 23, 59, 59) }; }
  return { desde:null, hasta:null };
}
function enRango(t, r){
  const d = parseDate(t.inicio_iso); if(!d) return false;
  return (!r.desde || d >= r.desde) && (!r.hasta || d <= r.hasta);
}
function opcionesFicha(sel){
  const o = [['','Sin asignar']];
  S.clientes.forEach(c => o.push(['cliente:' + c.cliente_id, 'Cliente · ' + (c.empresa || c.nombre)]));
  S.leads.filter(l => OPEN_STAGES.includes(l.estado || 'Nuevo')).forEach(l => o.push(['lead:' + l.lead_id, 'Lead · ' + leadName(l)]));
  return o.map(([v,t]) => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(t)}</option>`).join('');
}

function renderTiempos(){
  const activo = corriendo();
  const barra = `<div class="tm-bar ${activo ? 'corriendo' : ''}">
      <input class="desc" id="tmDesc" placeholder="¿En qué estás trabajando?" value="${esc(activo ? activo.descripcion : TM.desc)}">
      <select class="select" id="tmFicha">${opcionesFicha(activo ? (activo.entidad ? activo.entidad + ':' + activo.entidad_id : '') : TM.entidad)}</select>
      <label class="tm-fact"><input type="checkbox" id="tmFact" ${(activo ? activo.facturable !== 'No' : TM.fact) ? 'checked' : ''}>Facturable</label>
      <span class="tm-reloj" id="tmReloj">${activo ? hhmmss(Date.now() - parseDate(activo.inicio_iso).getTime()) : '00:00:00'}</span>
      <button class="tm-go ${activo ? 'stop' : ''}" id="tmGo" title="${activo ? 'Parar' : 'Empezar'}">${activo ? '■' : '▶'}</button>
    </div>`;

  const tabs = `<div class="tm-tabs">
      <div class="seg">
        <button type="button" class="${TM.vista === 'mis' ? 'on' : ''}" data-tmv="mis">Mis tiempos</button>
        ${isAdmin() ? `<button type="button" class="${TM.vista === 'equipo' ? 'on' : ''}" data-tmv="equipo">Equipo</button>
        <button type="button" class="${TM.vista === 'renta' ? 'on' : ''}" data-tmv="renta">Rentabilidad</button>` : ''}
      </div>
      ${TM.vista === 'renta' ? '<span style="font-size:13px;color:var(--muted)">Desde el principio de cada cliente</span>' : ''}
      <select class="select" id="tmPeriodo" style="width:auto${TM.vista === 'renta' ? ';display:none' : ''}">
        ${[['hoy','Hoy'],['semana','Esta semana'],['mes','Este mes'],['mespasado','Mes pasado'],['todo','Todo']]
          .map(([v,t]) => `<option value="${v}" ${TM.periodo === v ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
      ${TM.vista === 'equipo' ? `<select class="select" id="tmUsuario" style="width:auto"><option value="">Todo el equipo</option>${
        usuariosActivos().map(n => `<option ${TM.usuario === n ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>` : ''}
      <button class="btn" id="tmManual">Añadir a mano</button>
    </div>`;

  const cuerpo = !isAdmin() ? tmMios()
    : TM.vista === 'equipo' ? tmEquipo()
    : TM.vista === 'renta' ? tmRentabilidad()
    : tmMios();
  $('#view-tiempos').innerHTML = barra + tabs + cuerpo;

function tmMios(){
  const r = rangoTM(TM.periodo);
  const mios = S.tiempos.filter(t => String(t.usuario) === yo() && enRango(t, r))
    .sort((a,b) => String(b.inicio_iso).localeCompare(String(a.inicio_iso)));
  if(!mios.length) return '<div class="panel"><div class="empty"><b>Sin tiempo registrado</b>Escribe en qué trabajas y pulsa ▶, o añade una entrada a mano.</div></div>';
  const dias = {};
  mios.forEach(t => { const d = parseDate(t.inicio_iso); const k = d ? d.toDateString() : 'x'; (dias[k] = dias[k] || []).push(t); });
  const total = mios.reduce((a,t) => a + minutosDe(t), 0);
  const fact = mios.filter(t => t.facturable !== 'No').reduce((a,t) => a + minutosDe(t), 0);
  return `<div class="tm-kpis">
      <div class="tm-kpi"><span>Total</span><b>${hhmm(total)}</b><small>${horas(total)}</small></div>
      <div class="tm-kpi"><span>Facturable</span><b>${hhmm(fact)}</b><small>${total ? Math.round(fact / total * 100) : 0} % del tiempo</small></div>
      <div class="tm-kpi"><span>Entradas</span><b>${mios.length}</b><small>media ${hhmm(mios.length ? total / mios.length : 0)}</small></div>
      <div class="tm-kpi"><span>Días con registro</span><b>${Object.keys(dias).length}</b><small>media ${hhmm(Object.keys(dias).length ? total / Object.keys(dias).length : 0)}/día</small></div>
    </div>` +
    Object.keys(dias).map(k => {
      const lista = dias[k], d = parseDate(lista[0].inicio_iso);
      const tot = lista.reduce((a,t) => a + minutosDe(t), 0);
      return `<div class="tm-dia">
        <div class="tm-dia-cab"><b>${esc(etiquetaDia(d))}</b><span style="color:var(--muted)">${esc(d.toLocaleDateString('es-ES'))}</span><span class="tot">${hhmm(tot)}</span></div>
        ${lista.map(t => tmFila(t)).join('')}
      </div>`;
    }).join('');
}

function tmFila(t, conUsuario){
  const viva = !String(t.fin_iso || '').trim();
  const ini = parseDate(t.inicio_iso), fin = parseDate(t.fin_iso);
  return `<div class="tm-fila ${viva ? 'viva' : ''}" data-tm="${esc(t.tiempo_id)}">
      <span class="txt"><b>${esc(t.descripcion || 'Sin descripción')}</b>
        <small>${esc(tmEtiqueta(t))}${conUsuario ? ' · ' + esc(t.usuario) : ''}</small></span>
      <span>${t.facturable !== 'No' ? '<span class="chip-fact">Facturable</span>' : '<span class="chip-nofact">No facturable</span>'}</span>
      <span class="horas">${ini ? esc(ini.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})) : '—'} – ${fin ? esc(fin.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})) : 'en marcha'}</span>
      <span class="dur">${viva ? hhmm(minutosDe(t)) : hhmm(t.minutos)}</span>
      <span class="acc">
        <button data-tmseguir="${esc(t.tiempo_id)}" title="Seguir con esta tarea">▶</button>
        <button data-tmedit="${esc(t.tiempo_id)}" title="Editar">✎</button>
        <button data-tmdel="${esc(t.tiempo_id)}" title="Borrar">✕</button>
      </span>
    </div>`;
}

/* ---------- Vista de equipo (solo administradora) ---------- */
function tmEquipo(){
  const r = rangoTM(TM.periodo);
  let lista = S.tiempos.filter(t => enRango(t, r));
  if(TM.usuario) lista = lista.filter(t => String(t.usuario) === TM.usuario);
  const total = lista.reduce((a,t) => a + minutosDe(t), 0);
  const fact = lista.filter(t => t.facturable !== 'No').reduce((a,t) => a + minutosDe(t), 0);
  const personas = {};
  lista.forEach(t => { const u = String(t.usuario || '—'); personas[u] = personas[u] || { min:0, fact:0, n:0, dias:{} };
    personas[u].min += minutosDe(t); personas[u].n++;
    if(t.facturable !== 'No') personas[u].fact += minutosDe(t);
    const d = parseDate(t.inicio_iso); if(d) personas[u].dias[d.toDateString()] = 1; });
  const fichas = {};
  lista.forEach(t => { const k = tmEtiqueta(t); fichas[k] = (fichas[k] || 0) + minutosDe(t); });
  const maxP = Math.max(1, ...Object.values(personas).map(p => p.min));
  const maxF = Math.max(1, ...Object.values(fichas));
  const ordenP = Object.keys(personas).sort((a,b) => personas[b].min - personas[a].min);
  const ordenF = Object.keys(fichas).sort((a,b) => fichas[b] - fichas[a]).slice(0, 12);
  if(!lista.length) return '<div class="panel"><div class="empty"><b>Sin tiempo registrado en este periodo</b>Prueba a cambiar el rango de fechas.</div></div>';
  return `<div class="tm-kpis">
      <div class="tm-kpi"><span>Total del equipo</span><b>${hhmm(total)}</b><small>${horas(total)}</small></div>
      <div class="tm-kpi"><span>Facturable</span><b>${hhmm(fact)}</b><small>${Math.round(fact / total * 100)} % del tiempo</small></div>
      <div class="tm-kpi"><span>Personas</span><b>${ordenP.length}</b><small>${lista.length} ${lista.length === 1 ? 'entrada' : 'entradas'}</small></div>
      <div class="tm-kpi"><span>Media por persona</span><b>${hhmm(total / Math.max(1, ordenP.length))}</b><small>en el periodo</small></div>
    </div>
    <div class="d-grid">
      <div class="card-d span-7">
        <div class="h"><h3>Por persona</h3></div>
        <div class="b flush"><table class="tm-tabla">
          <thead><tr><th>Persona</th><th>Reparto</th><th class="num">Facturable</th><th class="num">Total</th><th class="num">Días</th></tr></thead>
          <tbody>${ordenP.map(u => { const p = personas[u];
            return `<tr><td><b>${esc(u)}</b><br><small style="color:var(--muted)">${p.n} ${p.n === 1 ? 'entrada' : 'entradas'} · media ${hhmm(p.min / p.n)}</small></td>
              <td><span class="barra"><i style="width:${Math.round(p.min / maxP * 100)}%"></i></span></td>
              <td class="num">${hhmm(p.fact)}</td><td class="num">${hhmm(p.min)}</td><td class="num">${Object.keys(p.dias).length}</td></tr>`;
          }).join('')}</tbody></table></div>
        <div class="foot">Las horas salen de lo que cada persona registra con el cronómetro o añade a mano.</div>
      </div>
      <div class="card-d span-5">
        <div class="h"><h3>En qué se va el tiempo</h3></div>
        <div class="b flush"><table class="tm-tabla"><tbody>${ordenF.map(k =>
          `<tr><td>${esc(k)}</td><td><span class="barra"><i style="width:${Math.round(fichas[k] / maxF * 100)}%"></i></span></td><td class="num">${hhmm(fichas[k])}</td></tr>`).join('')}</tbody></table></div>
      </div>
    </div>
    <div class="card-d">
      <div class="h"><h3>Todas las entradas</h3><small>${lista.length}</small></div>
      <div class="b flush scroll-list">${lista.sort((a,b) => String(b.inicio_iso).localeCompare(String(a.inicio_iso))).map(t => tmFila(t, true)).join('')}</div>
    </div>`;
}

async function tmArrancar(){
  const desc = $('#tmDesc').value.trim();
  const ficha = $('#tmFicha').value, fact = $('#tmFact').checked;
  const [ent, eid] = ficha ? ficha.split(':') : ['',''];
  const item = { tiempo_id:uid('TMP'), usuario:yo(), entidad:ent, entidad_id:eid, descripcion:desc,
                 etiqueta:'', facturable:fact ? 'Sí' : 'No', inicio_iso:nowIso(), fin_iso:'', minutos:'', creado_iso:nowIso() };
  S.tiempos.filter(t => t.usuario === yo() && !t.fin_iso).forEach(t => { t.fin_iso = nowIso(); t.minutos = minutosDe(t); });
  S.tiempos.push(item);
  TM.desc = ''; TM.entidad = ficha; TM.fact = fact;
  renderAll();
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('startTimer', item); }catch(err){ toast(err.message, true); await load(true); }
}
async function tmParar(){
  const t = corriendo(); if(!t) return;
  t.fin_iso = nowIso(); t.minutos = minutosDe(t);
  renderAll();
  toast('Registrado ' + hhmm(t.minutos));
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('stopTimer', { tiempo_id:t.tiempo_id, fin_iso:t.fin_iso }); }catch(err){ toast(err.message, true); await load(true); }
}
async function tmGuardar(item){
  const i = S.tiempos.findIndex(t => t.tiempo_id === item.tiempo_id);
  if(i > -1) S.tiempos[i] = Object.assign({}, S.tiempos[i], item); else S.tiempos.push(item);
  renderAll();
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('saveTime', { item }); }catch(err){ toast(err.message, true); await load(true); }
}
async function tmBorrar(id){
  if(!confirm('¿Borrar esta entrada de tiempo?')) return;
  S.tiempos = S.tiempos.filter(t => t.tiempo_id !== id);
  renderAll();
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('deleteTime', { tiempo_id:id }); }catch(err){ toast(err.message, true); await load(true); }
}
function tmEditar(t){
  const hoy = new Date();
  const ini = parseDate(t ? t.inicio_iso : null) || new Date(hoy.getTime() - 3600000);
  const fin = parseDate(t ? t.fin_iso : null) || hoy;
  const iso = d => d.toISOString().slice(0,10);
  const hm = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  openModal(`
    <h3>${t ? 'Editar tiempo' : 'Añadir tiempo a mano'}</h3>
    <form>
      <div class="field"><label>¿Qué hiciste?</label><input class="input" name="descripcion" value="${esc(t ? t.descripcion : '')}" placeholder="Ej.: llamada de diagnóstico" required></div>
      <div class="grid-2">
        <div class="field"><label>Ficha</label><select class="select" name="ficha">${opcionesFicha(t && t.entidad ? t.entidad + ':' + t.entidad_id : '')}</select></div>
        <div class="field"><label>Facturable</label><select class="select" name="facturable"><option ${!t || t.facturable !== 'No' ? 'selected' : ''}>Sí</option><option ${t && t.facturable === 'No' ? 'selected' : ''}>No</option></select></div>
      </div>
      <div class="grid-2">
        <div class="field"><label>Día</label><input class="input" type="date" name="dia" value="${iso(ini)}" required></div>
        <div class="field"><label>Horas</label>
          <div style="display:flex;gap:8px;align-items:center"><input class="input" type="time" name="desde" value="${hm(ini)}" required><span>–</span><input class="input" type="time" name="hasta" value="${hm(fin)}" required></div></div>
      </div>
      <div class="modal-foot"><button class="btn btn-ghost" type="button" data-cancel>Cancelar</button><button class="btn btn-primary" type="submit">Guardar</button></div>
    </form>`, async f => {
    const dia = String(f.get('dia'));
    const a = new Date(dia + 'T' + String(f.get('desde')) + ':00');
    let b = new Date(dia + 'T' + String(f.get('hasta')) + ':00');
    if(b <= a) b = new Date(b.getTime() + 86400000);          // cruzó la medianoche
    const min = Math.round((b - a) / 60000);
    if(min > 16 * 60){ toast('Más de 16 horas seguidas: revisa las horas.', true); return false; }
    const ficha = String(f.get('ficha') || ''); const [ent, eid] = ficha ? ficha.split(':') : ['',''];
    await tmGuardar({ tiempo_id: t ? t.tiempo_id : uid('TMP'), usuario: t ? t.usuario : yo(), entidad:ent, entidad_id:eid,
      descripcion:String(f.get('descripcion')).trim(), etiqueta:'', facturable:String(f.get('facturable')),
      inicio_iso:a.toISOString(), fin_iso:b.toISOString(), minutos:min });
    toast('Guardado ' + hhmm(min));
  });
}

function bindTiempos(){
  const root = $('#view-tiempos');
  const activo = corriendo();
  clearInterval(tmTick);
  if(activo){
    const desde = parseDate(activo.inicio_iso).getTime();
    tmTick = setInterval(() => {
      const el = $('#tmReloj');
      if(!el){ clearInterval(tmTick); return; }
      el.textContent = hhmmss(Date.now() - desde);
    }, 1000);
  }
  $('#tmGo').addEventListener('click', () => activo ? tmParar() : tmArrancar());
  $('#tmDesc').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); if(!corriendo()) tmArrancar(); } });
  $('#tmDesc').addEventListener('input', e => { if(!corriendo()) TM.desc = e.target.value; });
  $('#tmManual').addEventListener('click', () => tmEditar(null));
  $('#tmPeriodo').addEventListener('change', e => { TM.periodo = e.target.value; renderTiempos(); });
  const su = $('#tmUsuario'); if(su) su.addEventListener('change', e => { TM.usuario = e.target.value; renderTiempos(); });
  $$('[data-tmv]', root).forEach(b => b.addEventListener('click', () => { TM.vista = b.dataset.tmv; renderTiempos(); }));
  $$('[data-tmedit]', root).forEach(b => b.addEventListener('click', () => tmEditar(S.tiempos.find(t => t.tiempo_id === b.dataset.tmedit))));
  $$('[data-tmdel]', root).forEach(b => b.addEventListener('click', () => tmBorrar(b.dataset.tmdel)));
  $$('[data-tmseguir]', root).forEach(b => b.addEventListener('click', () => {
    const t = S.tiempos.find(x => x.tiempo_id === b.dataset.tmseguir); if(!t) return;
    $('#tmDesc').value = t.descripcion; $('#tmFicha').value = t.entidad ? t.entidad + ':' + t.entidad_id : '';
    $('#tmFact').checked = t.facturable !== 'No';
    tmArrancar();
  }));
}

let vaultTimer = null;

function cryptoOk(){ return !!(window.crypto && window.crypto.subtle); }
const b64 = { to:b => btoa(String.fromCharCode.apply(null, new Uint8Array(b))),
              from:t => Uint8Array.from(atob(t), c => c.charCodeAt(0)) };
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:210000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function cifrar(key, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({ v:1, iv:b64.to(iv), ct:b64.to(ct) });
}
async function descifrar(key, txt){
  try{
    const o = JSON.parse(txt);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64.from(o.iv) }, key, b64.from(o.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch(e){ return null; }
}
function metaDe(bov){ return S.claves.find(c => String(c.clave_id) === 'META:' + bov) || null; }
function entradasDe(bov){ return S.claves.filter(c => String(c.boveda) === bov && String(c.clave_id).indexOf('META:') !== 0); }

function armarTemporizador(){
  clearTimeout(vaultTimer);
  vaultTimer = setTimeout(() => { VAULT_KEYS = { equipo:null, admin:null }; if(S.view === 'claves') renderAll(); toast('Bóveda bloqueada por seguridad'); }, VAULT_MINUTOS * 60000);
}
async function crearBoveda(bov, pass){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await deriveKey(pass, salt);
  const comprobante = await cifrar(key, { ok:'prismia' });
  const item = { clave_id:'META:' + bov, boveda:bov, servicio:'(configuración de la bóveda)', url:'',
                 datos: JSON.stringify({ salt:b64.to(salt), comprobante }) };
  S.claves.push(item); VAULT_KEYS[bov] = key; armarTemporizador();
  renderAll();
  if(CFG.demo){ Demo.save(); return; }
  try{ await Api.call('saveSecret', { item }); }catch(err){ toast('No se pudo crear: ' + err.message, true); await load(true); }
}
async function abrirBoveda(bov, pass){
  const meta = metaDe(bov);
  if(!meta) return false;
  const cfg = JSON.parse(meta.datos);
  const key = await deriveKey(pass, b64.from(cfg.salt));
  const ok = await descifrar(key, cfg.comprobante);
  if(!ok) return false;
  VAULT_KEYS[bov] = key; armarTemporizador();
  return true;
}
function generarClave(n){
  const abc = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789!@#$%&*-_=+?';
  return Array.from(crypto.getRandomValues(new Uint8Array(n || 20))).map(x => abc[x % abc.length]).join('');
}
async function copiarYBorrar(texto, que){
  try{ await navigator.clipboard.writeText(texto); }
  catch(e){ window.prompt('Copia ' + que + ':', texto); return; }
  toast(que + ' copiada. Se borrará del portapapeles en 45 segundos.');
  setTimeout(() => { navigator.clipboard.writeText('').catch(() => {}); }, 45000);
}
