<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>PrismIA CRM</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M6 4 L26 16 L6 28 Z' fill='%237C5CFC'/><path d='M6 4 L26 16 L14 16 Z' fill='%23F5A623'/><path d='M6 28 L26 16 L14 16 Z' fill='%2314B8A6'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15151F; --side:#181826; --side-2:#23233A; --side-line:rgba(241,239,250,0.10);
    --paper:#F6F5F2; --col:#EEECE5; --panel:#FFFFFF; --line:#E4E2DA; --line-2:#D6D4CB;
    --muted:#6B6B78; --soft:#9A9AA6;
    --gold:#F5A623; --gold-d:#C98110; --coral:#EC5C8D; --violet:#7C5CFC; --teal:#14B8A6; --red:#D8423F;
    --r-lg:16px; --r-md:12px; --r-sm:8px; --pill:999px;
    --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --display:'Space Grotesk', 'IBM Plex Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:var(--sans);font-size:14.5px;line-height:1.5;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;}
  button,input,select,textarea{font:inherit;color:inherit;}
  button{cursor:pointer;}
  a{color:inherit;}
  [hidden]{display:none !important;}
  :focus-visible{outline:2px solid var(--violet);outline-offset:2px;}
  h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:-0.01em;margin:0;}

  /* ---------- botones y campos ---------- */
  .btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-2);background:var(--panel);
       padding:8px 14px;border-radius:var(--pill);font-weight:500;font-size:13.5px;white-space:nowrap;}
  .btn:hover{border-color:var(--ink);}
  .btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn-primary:hover{background:#2a2a38;}
  .btn-accent{background:var(--violet);border-color:var(--violet);color:#fff;}
  .btn-accent:hover{background:#6a4ae8;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--muted);}
  .btn-ghost:hover{color:var(--ink);border-color:var(--line-2);}
  .btn-danger{color:var(--red);}
  .btn svg{width:15px;height:15px;flex-shrink:0;}
  .field{display:flex;flex-direction:column;gap:5px;}
  .field label{font-size:12.5px;font-weight:600;color:var(--muted);}
  .input, .select, .textarea{width:100%;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:9px 11px;}
  .textarea{resize:vertical;min-height:84px;}
  .input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(124,92,252,0.14);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:560px){ .grid-2{grid-template-columns:1fr;} }

  /* ---------- acceso ---------- */
  .login{min-height:100%;display:grid;place-items:center;padding:24px;
    background:
      radial-gradient(ellipse 50% 60% at 85% 10%, rgba(124,92,252,0.28), transparent 60%),
      radial-gradient(ellipse 45% 55% at 10% 95%, rgba(245,166,35,0.22), transparent 60%),
      var(--side);}
  .login-card{width:100%;max-width:420px;background:var(--panel);border-radius:var(--r-lg);padding:32px 30px;box-shadow:0 30px 80px rgba(0,0,0,0.35);}
  .login-card .logo{height:36px;display:block;margin-bottom:22px;background:var(--side);padding:8px 12px;border-radius:10px;}
  .login-card h1{font-size:1.45rem;margin-bottom:6px;}
  .login-card p.lead{color:var(--muted);margin:0 0 22px;}
  .login-card form{display:flex;flex-direction:column;gap:14px;}
  .login-err{color:var(--red);font-size:13px;min-height:18px;}
  .login-alt{margin-top:18px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);}
  .linklike{background:none;border:none;padding:0;color:var(--violet);font-weight:600;text-decoration:underline;text-underline-offset:3px;}

  /* ---------- estructura ---------- */
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100%;}
  .side{background:var(--side);color:#EDEBF7;display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;}
  .side .brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px;border-bottom:1px solid var(--side-line);margin-bottom:14px;}
  .side .brand img{height:30px;}
  .side .brand span{font-family:var(--display);font-weight:600;font-size:13px;color:#fff;background:var(--side-2);padding:3px 9px;border-radius:var(--pill);}
  .nav{display:flex;flex-direction:column;gap:2px;}
  .nav-item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#CFCDE0;
            padding:10px 12px;border-radius:10px;font-weight:500;}
  .nav-item svg{width:18px;height:18px;opacity:0.8;}
  .nav-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
  .nav-item.active{background:var(--side-2);color:#fff;}
  .nav-item.active svg{opacity:1;}
  .nav-count{margin-left:auto;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:var(--pill);background:rgba(255,255,255,0.1);}
  .nav-count.hot{background:var(--coral);color:#fff;}
  .side-foot{margin-top:auto;padding:14px 8px 0;border-top:1px solid var(--side-line);font-size:12.5px;color:#A9A7BD;display:flex;flex-direction:column;gap:6px;}
  .sync{display:flex;align-items:center;gap:7px;}
  .sync i{width:8px;height:8px;border-radius:50%;background:var(--soft);display:inline-block;}
  .sync.ok i{background:var(--teal);} .sync.busy i{background:var(--gold);} .sync.err i{background:var(--red);}
  .demo-flag{display:inline-block;background:rgba(245,166,35,0.16);color:#FFD08A;padding:2px 9px;border-radius:var(--pill);font-weight:600;width:max-content;}

  .main{min-width:0;display:flex;flex-direction:column;}
  .top{display:flex;align-items:center;gap:12px;padding:18px 28px;border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:0;z-index:5;}
  .top h1{font-size:1.35rem;margin-right:auto;}
  .search{position:relative;width:260px;}
  .search input{padding-left:34px;border-radius:var(--pill);background:#fff;}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--soft);}
  .view{padding:24px 28px 60px;}

  @media (max-width:900px){
    .app{grid-template-columns:1fr;}
    .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;z-index:40;flex-direction:row;padding:6px 2px;border-top:1px solid var(--side-line);overflow:visible;}
    .side nav{display:flex;flex-direction:row;width:100%;}
    /* En el móvil solo caben cuatro: el resto va en «Más». */
    .nav-item[data-view="mensajes"],.nav-item[data-view="tiempos"],
    .nav-item[data-view="claves"],.nav-item[data-view="tareas"],
    .nav-item[data-view="ajustes"]{display:none;}
    .nav-mas{display:flex !important;}
    .side .brand,.side-foot{display:none;}
    .nav{flex-direction:row;width:100%;justify-content:space-around;}
    .nav-item{flex-direction:column;gap:3px;font-size:10.5px;padding:7px 2px;text-align:center;flex:1 1 0;min-width:0;}
    .nav-count{position:absolute;top:2px;left:50%;margin:0 0 0 7px;font-size:10px;padding:0 6px;}
    .nav-item{position:relative;}
    .top{padding:14px 16px;flex-wrap:wrap;}
    .search{order:3;width:100%;}
    .view{padding:18px 16px 90px;}
  }

  /* ---------- hoy ---------- */
  .today-head{margin-bottom:22px;}
  .today-head .date{color:var(--muted);font-size:13.5px;}
  .today-head h2{font-size:1.6rem;margin-top:4px;max-width:30ch;}
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);margin-bottom:22px;}
  .kpi{padding:18px 20px;border-left:1px solid var(--line);}
  .kpi:first-child{border-left:none;}
  .kpi b{display:block;font-family:var(--display);font-size:1.55rem;font-weight:700;line-height:1.1;}
  .kpi span{font-size:12.5px;color:var(--muted);}
  .kpi.warn b{color:var(--coral);}
  @media (max-width:1100px){ .kpis{grid-template-columns:repeat(3,1fr);} .kpi:nth-child(4){border-left:none;} .kpi:nth-child(n+4){border-top:1px solid var(--line);} }
  @media (max-width:560px){ .kpi b{font-size:1.22rem;} .kpi{padding:14px 14px;} .kpis{grid-template-columns:repeat(2,1fr);} .kpi{border-left:none !important;border-top:1px solid var(--line);} .kpi:nth-child(-n+2){border-top:none;} .kpi:nth-child(even){border-left:1px solid var(--line) !important;} }

  .today-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start;}
  @media (max-width:1000px){ .today-grid{grid-template-columns:1fr;} }
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);}
  .panel-head{display:flex;align-items:baseline;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line);}
  .panel-head h3{font-size:1rem;}
  .panel-head small{color:var(--muted);margin-left:auto;font-size:12.5px;}
  .panel-body{padding:6px 0;}
  .stack{display:flex;flex-direction:column;gap:20px;}

  .alert{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 20px;border:none;background:none;width:100%;text-align:left;}
  .alert + .alert{border-top:1px solid var(--line);}
  .alert:hover{background:#FAF9F6;}
  .alert-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);}
  .alert.alta .alert-dot{background:var(--coral);box-shadow:0 0 0 4px rgba(236,92,141,0.14);}
  .alert.info .alert-dot{background:var(--teal);}
  .alert-txt b{display:block;font-weight:600;}
  .alert-txt span{font-size:13px;color:var(--muted);}
  .alert-go{font-size:12.5px;color:var(--soft);}
  .empty{padding:26px 20px;color:var(--muted);text-align:center;}
  .empty b{display:block;color:var(--ink);font-family:var(--display);margin-bottom:4px;}

  .funnel{padding:16px 20px 20px;display:flex;flex-direction:column;gap:11px;}
  .funnel-row{display:grid;grid-template-columns:128px 1fr 34px;gap:10px;align-items:center;font-size:13px;}
  .funnel-track{height:10px;background:var(--col);border-radius:5px;overflow:hidden;}
  .funnel-fill{display:block;height:100%;border-radius:5px;transition:width .6s cubic-bezier(.22,1,.36,1);}
  .funnel-row b{font-family:var(--display);text-align:right;}

  /* ---------- tareas (lista) ---------- */
  .task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:11px 20px;}
  .task + .task{border-top:1px solid var(--line);}
  .check{width:19px;height:19px;border-radius:6px;border:1.6px solid var(--line-2);background:#fff;display:grid;place-items:center;margin-top:1px;padding:0;}
  .check:hover{border-color:var(--teal);}
  .check.on{background:var(--teal);border-color:var(--teal);}
  .check.on::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px);}
  .task-txt b{display:block;font-weight:500;}
  .task.done .task-txt b{text-decoration:line-through;color:var(--soft);}
  .task-txt button{background:none;border:none;padding:0;font-size:12.5px;color:var(--violet);}
  .due{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap;}
  .due.late{color:var(--red);} .due.today{color:var(--gold-d);}
  .task-groups{display:grid;gap:20px;max-width:880px;}
  .add-task{display:grid;grid-template-columns:1fr 150px auto;gap:8px;padding:14px 20px;border-top:1px solid var(--line);}
  @media (max-width:560px){ .add-task{grid-template-columns:1fr;} }

  /* ---------- tableros ---------- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;}
  .toolbar .select{width:auto;border-radius:var(--pill);padding:7px 12px;}
  .toolbar .sum{margin-left:auto;color:var(--muted);font-size:13px;}
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start;}
  .board > .col{flex:1 0 262px;min-width:262px;}
  .col{background:var(--col);border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:200px;max-height:calc(100vh - 210px);}
  .col-head{padding:13px 14px 10px;display:flex;align-items:center;gap:8px;}
  .col-head i{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .col-head h3{font-size:0.93rem;}
  .col-head .n{margin-left:auto;font-family:var(--display);font-weight:600;color:var(--muted);font-size:13px;}
  .col-meta{padding:0 14px 10px;font-size:12px;color:var(--muted);}
  .col-body{padding:4px 10px 12px;display:flex;flex-direction:column;gap:9px;overflow-y:auto;flex:1;min-height:0;}
  .col-body > *{flex-shrink:0;}   /* las tarjetas nunca se encogen: la columna hace scroll */
  .col.drop-on{outline:2px dashed var(--violet);outline-offset:-4px;background:#E9E5F7;}
  .col.muted .card{opacity:0.72;}

  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 13px 12px;text-align:left;width:100%;overflow:hidden;}
  .card:hover{border-color:var(--line-2);}
  .card.dragging{opacity:0.45;}
  .rail{display:flex;gap:3px;margin:-13px -13px 11px;padding:0;}
  .rail span{height:3px;flex:1;background:var(--col);}
  .card-top{display:flex;align-items:flex-start;gap:10px;}
  .card-name{font-weight:600;line-height:1.3;}
  .card-co{font-size:13px;color:var(--muted);}
  .score{margin-left:auto;font-family:var(--display);font-weight:700;font-size:13px;min-width:34px;text-align:center;padding:3px 7px;border-radius:var(--pill);background:var(--col);}
  .score.A{background:rgba(236,92,141,0.14);color:#B8325F;}
  .score.B{background:rgba(245,166,35,0.18);color:#9A5E00;}
  .score.C{background:rgba(20,184,166,0.14);color:#0C7A6D;}
  .card-metric{font-size:13px;margin-top:8px;}
  .card-foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center;}
  .tag{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:var(--pill);background:var(--col);color:var(--muted);}
  .age{font-size:11.5px;color:var(--soft);margin-left:auto;}
  .age.stale{color:var(--red);font-weight:600;}
  .health{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .health.bien{background:var(--teal);} .health.atencion{background:var(--gold);} .health.riesgo{background:var(--red);}


  /* ---------- prospección ---------- */
  .toolbar .btn{border-radius:var(--pill);}
  .prio{font-family:var(--display);font-weight:700;font-size:12px;padding:3px 9px;border-radius:var(--pill);background:var(--col);color:var(--muted);white-space:nowrap;}
  .prio.muy{background:rgba(236,92,141,0.15);color:#B8325F;}
  .prio.alta{background:rgba(245,166,35,0.18);color:#9A5E00;}
  .prio.media{background:rgba(124,92,252,0.13);color:#5B3FD0;}
  .signals{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;}
  @media (max-width:560px){ .signals{grid-template-columns:1fr;} }
  .sig{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
  .sig small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35;}
  .sig .pts{color:var(--soft);font-size:11.5px;margin-left:4px;}
  .yn{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--pill);overflow:hidden;}
  .yn button{border:none;background:#fff;padding:4px 11px;font-size:12.5px;font-weight:600;color:var(--muted);}
  .yn button + button{border-left:1px solid var(--line-2);}
  .yn button.on-si{background:var(--teal);color:#fff;}
  .yn button.on-no{background:var(--col);color:var(--ink);}
  .score-line{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .score-line b{font-family:var(--display);font-size:1.6rem;}
  .score-line span{color:var(--muted);font-size:13px;}
  .auto-note{font-size:12.5px;color:var(--muted);background:var(--col);border-radius:var(--r-sm);padding:9px 11px;margin-top:12px;white-space:pre-wrap;}
  .drop{border:2px dashed var(--line-2);border-radius:var(--r-md);padding:26px 16px;text-align:center;color:var(--muted);cursor:pointer;}
  .drop:hover,.drop.on{border-color:var(--violet);background:#F7F5FF;color:var(--ink);}
  .drop b{display:block;color:var(--ink);margin-bottom:4px;}
  .progress{height:8px;background:var(--col);border-radius:4px;overflow:hidden;margin:14px 0 8px;}
  .progress i{display:block;height:100%;width:0;background:var(--violet);transition:width .3s;}
  .import-sum{font-size:13.5px;background:var(--col);border-radius:var(--r-sm);padding:10px 12px;}
  .legal{font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);padding:6px 10px;margin-top:4px;}


  /* ---------- vistas: tablero, lista, cola ---------- */
  .toolbar-2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-8px 0 18px;}
  .toolbar-2 .btn{padding:6px 12px;font-size:12.5px;}
  .toolbar-2 .lbl{font-size:12.5px;color:var(--muted);margin-right:2px;}
  .seg{display:inline-flex;background:var(--col);border-radius:var(--pill);padding:3px;gap:2px;}
  .seg button{border:none;background:none;border-radius:var(--pill);padding:6px 12px;font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px;}
  .seg button svg{width:14px;height:14px;}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(21,21,31,0.12);}
  .toggle{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;}
  .toggle input{accent-color:var(--violet);}

  .board > .col.folded{flex:0 0 46px;min-width:46px;min-height:220px;}
  .fold-btn{width:100%;height:100%;min-height:220px;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;color:var(--ink);}
  .fold-btn i{width:10px;height:10px;border-radius:3px;}
  .fold-btn span{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--display);font-weight:600;font-size:13px;}
  .fold-btn b{font-family:var(--display);font-size:12px;color:var(--muted);}
  .fold-btn:hover{background:rgba(124,92,252,0.06);border-radius:var(--r-lg);}
  .fold-x{background:none;border:none;color:var(--soft);font-size:18px;line-height:1;padding:0 2px;margin-left:4px;}
  .fold-x:hover{color:var(--ink);}
  .more-btn{border:1px dashed var(--line-2);background:transparent;border-radius:var(--r-md);padding:9px;font-size:12.5px;color:var(--muted);}
  .more-btn:hover{border-color:var(--violet);color:var(--ink);}
  .board.compact .card{padding:9px 11px 8px;}
  .board.compact .rail{margin:-9px -11px 8px;}
  .board.compact .card-metric,.board.compact .card-foot .tag{display:none;}
  .board.compact .card-foot{margin-top:4px;}
  .board.compact .card-co{font-size:12px;}
  .board.compact .col-body{gap:6px;}

  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto;max-height:calc(100vh - 250px);}
  table.grid{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;}
  table.grid th{position:sticky;top:0;z-index:1;background:#FAF9F6;text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.grid td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  table.grid tr:last-child td{border-bottom:none;}
  table.grid tbody tr{cursor:pointer;}
  table.grid tbody tr:hover td{background:#FAF9F6;}
  table.grid tbody tr.on td{background:#F4F1FF;}
  table.grid{min-width:1080px;}
  table.grid td.name{min-width:230px;max-width:300px;}
  table.grid td.name b,table.grid td.name span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  table.grid td.name b{font-weight:600;}
  table.grid td.name span{font-size:12.5px;color:var(--muted);}
  table.grid td.muted{max-width:180px;overflow:hidden;text-overflow:ellipsis;}
  table.grid td.clip{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#3A3A48;}

  table.grid td.muted{color:var(--muted);white-space:nowrap;}
  table.grid input[type=checkbox]{accent-color:var(--violet);width:16px;height:16px;cursor:pointer;}
  .th-sort{background:none;border:none;padding:0;font:inherit;color:inherit;white-space:nowrap;}

  .select.mini{padding:5px 8px;font-size:12.5px;width:auto;border-radius:var(--r-sm);}
  .dot-list{display:flex;gap:3px;}
  .dot-list i{width:7px;height:7px;border-radius:50%;background:var(--line-2);}
  .dot-list i.y{background:var(--teal);}
  .pager{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--muted);}
  .bulk{position:sticky;bottom:14px;z-index:6;margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--ink);color:#fff;border-radius:var(--pill);padding:8px 10px 8px 18px;box-shadow:0 12px 30px rgba(21,21,31,0.25);}
  .bulk b{margin-right:6px;font-weight:600;}
  .bulk .btn{background:rgba(255,255,255,0.1);border-color:transparent;color:#fff;padding:6px 12px;font-size:12.5px;}
  .bulk .btn:hover{background:rgba(255,255,255,0.2);}
  .bulk .select{width:auto;background:#fff;color:var(--ink);padding:6px 10px;font-size:12.5px;border-radius:var(--pill);}
  @media (max-width:900px){ .bulk{bottom:80px;border-radius:var(--r-lg);} }

  .queue{max-width:900px;}
  .q-top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px;}
  .q-top .count{font-size:13.5px;color:var(--muted);margin-left:auto;}
  .q-card{padding:24px 26px;}
  .q-head{display:flex;gap:14px;align-items:flex-start;}
  .q-head h2{font-size:1.45rem;line-height:1.2;}
  .q-head .sub{color:var(--muted);font-size:13.5px;margin-top:3px;}
  .q-head .prio{margin-left:auto;font-size:13px;padding:5px 12px;}
  .q-links{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 18px;}
  .q-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
  @media (max-width:760px){ .q-grid{grid-template-columns:1fr;} }
  .q-grid h4{font-size:12.5px;color:var(--muted);font-family:var(--sans);font-weight:600;margin:0 0 6px;}
  .q-grid p{margin:0 0 14px;font-size:14px;}
  .q-msg{background:var(--col);border-radius:var(--r-md);padding:13px 14px;font-size:14px;white-space:pre-wrap;margin-bottom:8px;}
  .q-grid details{margin-top:10px;font-size:13.5px;}
  .q-grid details pre{white-space:pre-wrap;font-family:var(--sans);background:#FAF9F6;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin:8px 0 0;}
  .q-chips{display:flex;flex-wrap:wrap;gap:5px;}
  .q-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);}
  .q-actions .select{width:auto;}
  .q-actions .push{margin-left:auto;}
  .q-next{margin-top:16px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .q-next button{background:#fff;border:1px solid var(--line);border-radius:var(--pill);padding:4px 11px;font-size:12.5px;}


  .choices{display:flex;flex-direction:column;gap:8px;}
  .choice{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px solid var(--line-2);border-radius:var(--r-md);padding:13px 14px;cursor:pointer;}
  .choice:hover{border-color:var(--violet);}
  .choice:has(input:checked){border-color:var(--violet);background:#F7F5FF;box-shadow:0 0 0 3px rgba(124,92,252,0.10);}
  .choice input{margin-top:3px;accent-color:var(--violet);width:16px;height:16px;}
  .choice b{display:block;font-family:var(--display);font-weight:600;}
  .choice small{display:block;color:var(--muted);font-size:13px;margin-top:2px;}
  .choice.dis{opacity:0.5;cursor:not-allowed;}


  /* ---------- PANEL ---------- */
  .d-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;margin-bottom:20px;}
  .d-head .date{color:var(--muted);font-size:13.5px;}
  .d-head h2{font-size:1.55rem;margin-top:4px;max-width:36ch;line-height:1.25;}
  .d-head .seg{margin-left:auto;}
  .d-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;margin-bottom:18px;}
  .span-3{grid-column:span 3;} .span-4{grid-column:span 4;} .span-5{grid-column:span 5;} .span-6{grid-column:span 6;} .span-7{grid-column:span 7;} .span-8{grid-column:span 8;} .span-12{grid-column:span 12;}
  @media (max-width:1180px){ .span-3{grid-column:span 6;} .span-4,.span-5,.span-7,.span-8{grid-column:span 12;} }
  @media (max-width:620px){ .span-3,.span-6{grid-column:span 12;} }

  .hero{position:relative;overflow:hidden;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px 18px;min-height:150px;display:flex;flex-direction:column;}
  .hero::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--violet));}
  .hero .t{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .hero .t i{width:8px;height:8px;border-radius:50%;background:var(--c,var(--violet));}
  .hero .v{font-family:var(--display);font-weight:700;font-size:2rem;line-height:1.1;margin-top:10px;letter-spacing:-0.02em;}
  .hero .s{font-size:12.5px;color:var(--muted);margin-top:auto;padding-top:10px;}
  .hero .s b{color:var(--ink);font-weight:600;}
  .delta{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:var(--pill);margin-left:6px;vertical-align:middle;}
  .delta.up{background:rgba(20,184,166,0.13);color:#0C7A6D;} .delta.down{background:rgba(216,66,63,0.10);color:#B23431;} .delta.eq{background:var(--col);color:var(--muted);}
  .hero.dark{background:
      radial-gradient(ellipse 70% 90% at 95% 0%, rgba(124,92,252,0.35), transparent 60%),
      radial-gradient(ellipse 60% 80% at 0% 100%, rgba(245,166,35,0.22), transparent 60%), var(--side);
    border-color:var(--side);color:#fff;}
  .hero.dark .t,.hero.dark .s{color:#C9C6DB;} .hero.dark .s b{color:#fff;}
  .hero.dark::before{background:linear-gradient(var(--gold),var(--coral),var(--violet),var(--teal));}

  .pend{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px;}
  @media (max-width:1180px){ .pend{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:560px){ .pend{grid-template-columns:repeat(2,1fr);} }
  .pend button{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:96px;}
  .pend button:hover{border-color:var(--ink);}
  .pend button b{font-family:var(--display);font-size:1.5rem;line-height:1.1;}
  .pend button span{font-size:12.5px;color:var(--muted);line-height:1.3;}
  .pend button em{font-style:normal;font-size:12px;font-weight:600;margin-top:auto;padding-top:4px;color:var(--violet);}
  .pend button.hot{border-color:rgba(236,92,141,0.45);background:linear-gradient(180deg,#FFF6F9,#fff);}
  .pend button.hot b{color:#C23A69;}
  .pend button.zero b{color:var(--soft);}

  .card-d{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;min-width:0;}
  .card-d .h{display:flex;align-items:baseline;gap:10px;padding:16px 20px 4px;}
  .card-d .h h3{font-size:1rem;}
  .card-d .h small{margin-left:auto;font-size:12.5px;color:var(--muted);}
  .card-d .b{padding:8px 20px 18px;flex:1;min-width:0;}
  .card-d .b.flush{padding:4px 0 8px;}
  .card-d .foot{font-size:11.5px;color:var(--soft);padding:0 20px 14px;line-height:1.45;}
  .legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:6px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .legend i.ln{height:3px;border-radius:2px;}
  svg.chart{width:100%;height:auto;display:block;overflow:visible;}
  svg.chart .grow{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.22,1,.36,1) both;}
  svg.chart .draw{stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 1.1s .2s ease forwards;}
  @keyframes grow{from{transform:scaleY(0);}to{transform:scaleY(1);}}
  @keyframes draw{to{stroke-dashoffset:0;}}
  .chart-empty{display:grid;place-items:center;min-height:180px;color:var(--soft);font-size:13px;text-align:center;}

  .fn{display:flex;flex-direction:column;gap:10px;}
  .fn-row{display:grid;grid-template-columns:118px 1fr 92px;gap:10px;align-items:center;font-size:13px;}
  .fn-bar{height:26px;background:var(--col);border-radius:7px;overflow:hidden;position:relative;}
  .fn-bar i{display:block;height:100%;border-radius:7px;transform-origin:left;animation:growx .8s cubic-bezier(.22,1,.36,1) both;}
  .fn-bar b{position:absolute;left:9px;top:50%;transform:translateY(-50%);font-family:var(--display);font-size:12.5px;color:var(--ink);}
  .fn-row .val{text-align:right;font-family:var(--display);font-weight:600;font-size:12.5px;}
  .fn-row .val small{display:block;font-family:var(--sans);font-weight:400;color:var(--soft);font-size:11px;}
  .fn-conv{font-size:11px;color:var(--soft);padding-left:128px;margin:-6px 0 -2px;}
  @keyframes growx{from{transform:scaleX(0);}to{transform:scaleX(1);}}

  .opp{width:100%;border-collapse:collapse;font-size:13.5px;}
  .card-d .b.flush{overflow-x:auto;}
  @media (max-width:620px){
    .opp td{padding:9px 12px;}
    .opp td:nth-child(2){display:none;}
    .cli-row{padding:10px 14px;gap:8px;grid-template-columns:auto 1fr auto;}
    .cli-row .money + .money{display:none;}
    .d-head .seg{margin-left:0;}
    .hero .v{font-size:1.7rem;}
    .hero{min-height:auto;padding:16px 18px 14px;}
    .fn-row{grid-template-columns:92px 1fr 78px;}
    .fn-conv{padding-left:102px;}
  }
  .opp td{padding:9px 20px;border-top:1px solid var(--line);vertical-align:middle;}
  .opp tr{cursor:pointer;}
  .opp tr:hover td{background:#FAF9F6;}
  .opp .nm b{display:block;font-weight:600;} .opp .nm span{font-size:12px;color:var(--muted);}
  .opp .money{text-align:right;font-family:var(--display);font-weight:600;white-space:nowrap;}
  .opp .money small{display:block;font-family:var(--sans);font-weight:400;font-size:11.5px;color:var(--soft);}
  .stage-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;}
  .stage-pill i{width:8px;height:8px;border-radius:50%;}
  .scroll-list{max-height:330px;overflow:auto;}
  .donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .donut-wrap svg{width:132px;height:132px;flex-shrink:0;}
  .donut-legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;flex:1;min-width:120px;}
  .donut-legend div{display:grid;grid-template-columns:10px 1fr auto;gap:8px;align-items:center;}
  .donut-legend i{width:10px;height:10px;border-radius:3px;}
  .donut-legend b{font-family:var(--display);}
  .mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:14px;}
  .mini-stats div{background:#FAF9F6;padding:10px 12px;}
  .mini-stats b{display:block;font-family:var(--display);font-size:1.1rem;}
  .mini-stats span{font-size:11.5px;color:var(--muted);}
  .cli-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:10px 20px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px;}
  .cli-row:hover{background:#FAF9F6;}
  .cli-row b{font-weight:600;} .cli-row small{display:block;color:var(--muted);font-size:12px;}
  .cli-row .money{font-family:var(--display);font-weight:600;white-space:nowrap;}
  .pays{display:flex;flex-direction:column;gap:8px;}
  .pay{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;border:1px solid var(--line-2);border-radius:var(--r-md);padding:12px 14px;}
  .pay b{display:block;font-family:var(--display);font-weight:600;}
  .pay small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;}
  .pay .amount{font-family:var(--display);font-weight:700;font-size:1.05rem;}
  .pay.ok{border-color:rgba(20,184,166,0.45);background:rgba(20,184,166,0.06);}
  .pay.ok .amount{color:#0C7A6D;}
  .pay.due{border-color:rgba(216,66,63,0.40);background:rgba(216,66,63,0.05);}
  .pay.due .amount{color:#B23431;}
  @media (max-width:560px){ .pay{grid-template-columns:1fr auto;} .pay .btn{grid-column:1 / -1;justify-content:center;} }
  .pend{grid-template-columns:repeat(7,1fr);}
  @media (max-width:1400px){ .pend{grid-template-columns:repeat(4,1fr);} }


  /* ---------- mensajería ---------- */
  .msg-wrap{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start;}
  .msg-side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:460px;overflow:hidden;}
  .msg-search{padding:12px 12px 8px;}

  .msg-filtros{display:flex;gap:6px;padding:0 12px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;}

  .msg-filtros button:hover{border-color:var(--ink);color:var(--ink);}
  .msg-filtros button.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .msg-list{flex:1;overflow-y:auto;padding-bottom:8px;}
  .msg-sep{padding:12px 16px 5px;font-size:11px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:var(--soft);}
  .msg-ch{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:9px 12px;border-left:3px solid transparent;}

  .ch-txt small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .msg-ch.nuevo .ch-txt b{font-weight:700;}
  .msg-ch.nuevo .ch-txt small{color:var(--ink);}
  .ch-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .ch-meta i{font-style:normal;font-size:11px;color:var(--soft);white-space:nowrap;}
  .msg-badge{background:var(--muted);color:#fff;font-size:11px;font-weight:700;border-radius:var(--pill);padding:1px 7px;}
  .msg-badge.men{background:var(--coral);}

  .av{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;color:#fff;font-family:var(--display);font-weight:700;font-size:13px;flex-shrink:0;letter-spacing:0.02em;}
  .av.ico{background:var(--col);color:var(--muted);font-size:15px;}
  .av.ico.general{background:rgba(124,92,252,0.14);color:var(--violet);}
  .av.ico.ficha{background:rgba(245,166,35,0.16);color:var(--gold-d);}

  .msg-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:460px;position:relative;overflow:hidden;}
  .msg-head{display:flex;align-items:center;gap:11px;padding:12px 18px;border-bottom:1px solid var(--line);background:#FDFCFA;}
  .msg-head .head-txt{min-width:0;}
  .msg-head b{display:block;font-family:var(--display);font-size:1rem;}
  .msg-head small{display:block;color:var(--muted);font-size:12.5px;}
  .msg-head .btn{margin-left:auto;}
  .msg-head .volver{display:none;background:none;border:none;font-size:24px;line-height:1;color:var(--muted);padding:0 4px 4px;}
  .msg-body{flex:1;overflow-y:auto;padding:16px 18px 8px;display:flex;flex-direction:column;gap:2px;}

  .msg{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:3px 0;position:relative;align-items:flex-start;}

  .burbuja a{color:var(--violet);}
